// UTILITY FUNCTIONS

function uid() {
  return Math.random().toString(36).substr(2, 9);
}

function esc(str) {
  const map = {
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#039;'
  };
  return String(str || '').replace(/[&<>"']/g, m => map[m]);
}

function fmtMoney(n) {
  return (Number(n) || 0).toFixed(2);
}

function fmtDate(iso) {
  if (!iso) return '-';
  try {
    return new Date(iso).toLocaleDateString('ar-OM', {
      year: 'numeric',
      month: 'short',
      day: 'numeric'
    });
  } catch (e) {
    return '-';
  }
}

function showToast(msg, type = 'success') {
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `${icon(type === 'error' ? 'alert' : 'check')} <span>${esc(msg)}</span>`;
  wrap.appendChild(el);
  setTimeout(() => {
    el.style.opacity = '0';
    el.style.transition = 'opacity 0.3s';
    setTimeout(() => el.remove(), 300);
  }, 2600);
}

function hideModal() {
  document.getElementById('modalOverlay').classList.remove('active');
}

const FIELD_MAP = {
  tires: { selling_price: 'sellingPrice', tire_type_id: 'tireTypeId', supplier_id: 'supplierId' },
  services: {},
  customers: {},
  appointments: { customer_id: 'customerId', customer_name: 'customerName', service_name: 'serviceName' },
  sales: {
    invoice_number: 'invoiceNumber',
    customer_id: 'customerId',
    customer_name: 'customerName',
    customer_phone: 'customerPhone',
    payment_method: 'paymentMethod',
    discount_amount: 'discountAmount',
    discount_percent: 'discountPercent',
    discount_total: 'discountTotal'
  },
  suppliers: {},
  tire_types: {},
  supplier_invoices: {
    supplier_id: 'supplierId',
    invoice_number: 'invoiceNumber',
    total_amount: 'totalAmount',
    paid_amount: 'paidAmount',
    remaining_amount: 'remainingAmount',
    invoice_date: 'invoiceDate'
  },
  supplier_payments: {
    supplier_invoice_id: 'supplierInvoiceId',
    payment_amount: 'paymentAmount',
    payment_date: 'paymentDate'
  },
};

function rowFromDb(row, table) {
  if (!row) return {};
  const map = FIELD_MAP[table] || {};
  const out = { ...row };
  
  Object.entries(map).forEach(([snake, camel]) => {
    if (snake in out) {
      out[camel] = out[snake];
      delete out[snake];
    }
  });
  
  out.createdAt = row.created_at;
  delete out.created_at;
  return out;
}

function rowToDb(obj, table) {
  if (!obj) return {};
  const map = FIELD_MAP[table] || {};
  const out = { ...obj };
  
  Object.entries(map).forEach(([snake, camel]) => {
    if (camel in out) {
      out[snake] = out[camel];
      delete out[camel];
    }
  });
  
  delete out.id;
  delete out.createdAt;
  delete out.created_at;
  return out;
}

class TireShopApp {
  constructor() {
    this.sb = null;
    this.currentUser = null;
    this.currentView = 'login';
    
    // Database collections
    this.tires = [];
    this.services = [];
    this.customers = [];
    this.appointments = [];
    this.sales = [];
    this.suppliers = [];
    this.tireTypes = [];
    this.supplierInvoices = [];
    this.supplierPayments = [];
    
    // Sale wizard state
    this.saleWizard = {
      step: 1,
      selectedService: null,
      quantity: 1,
      warranty: 'noWarranty',
      paymentMethod: 'cash',
      customerName: '',
      customerPhone: '',
    };
    
    this.init();
  }

  async init() {
    try {
      const saved = sessionStorage.getItem('tireshop_user');
      if (saved) {
        this.currentUser = JSON.parse(saved);
        this.currentView = 'dashboard';
      }
    } catch (e) {
      console.error('Session load failed:', e);
    }

    try {
      if (window.supabase) {
        this.sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        console.log('✅ Supabase initialized');
      }
    } catch (e) {
      console.error('❌ Supabase init error:', e);
      this.sb = null;
    }

    if (this.currentUser) {
      await this.loadAllData();
    }

    this.render();
  }

  async loadAllData() {
    if (!this.sb) {
      console.warn('⚠️ Supabase not available');
      return;
    }

    try {
      const tables = [
        'tires', 'services', 'customers', 'appointments', 'sales',
        'suppliers', 'tire_types', 'supplier_invoices', 'supplier_payments'
      ];

      for (const table of tables) {
        const { data, error } = await this.sb.from(table).select('*').order('created_at', { ascending: false });
        if (error) {
          console.error(`Error loading ${table}:`, error);
          continue;
        }

        const mapped = data.map(row => rowFromDb(row, table));
        
        const propName = table
          .replace('tire_types', 'tireTypes')
          .replace('supplier_invoices', 'supplierInvoices')
          .replace('supplier_payments', 'supplierPayments');
        
        this[propName] = mapped;
        console.log(`✅ Loaded ${mapped.length} from ${table}`);
      }
    } catch (e) {
      console.error('Data load error:', e);
    }
  }

  async addRecord(table, data) {
    if (!this.sb) {
      const id = uid();
      const record = { id, ...data, createdAt: new Date().toISOString() };
      this[table].unshift(record);
      return true;
    }

    try {
      const dbData = rowToDb(data, table);
      const { error } = await this.sb.from(table).insert([dbData]);
      
      if (error) {
        console.error(`Error adding to ${table}:`, error);
        showToast(t('error'), 'error');
        return false;
      }

      await this.loadAllData();
      showToast(t('saved'), 'success');
      return true;
    } catch (e) {
      console.error('Add record error:', e);
      showToast(t('error'), 'error');
      return false;
    }
  }

  login(username, password, role) {
    const creds = {
      manager: { u: 'admin', p: 'admin123', name: 'المدير' },
      employee: { u: 'employee', p: 'emp123', name: 'الموظف' }
    };

    const c = creds[role];
    if (!c || username !== c.u || password !== c.p) {
      showToast('بيانات خاطئة', 'error');
      return;
    }

    this.currentUser = { id: uid(), name: c.name, role };
    sessionStorage.setItem('tireshop_user', JSON.stringify(this.currentUser));
    this.currentView = 'dashboard';
    this.loadAllData().then(() => this.render());
  }

  logout() {
    this.currentUser = null;
    this.currentView = 'login';
    sessionStorage.removeItem('tireshop_user');
    this.render();
  }

  startNewSale() {
    this.saleWizard = {
      step: 1,
      selectedService: null,
      quantity: 1,
      warranty: 'noWarranty',
      paymentMethod: 'cash',
      customerName: '',
      customerPhone: '',
    };
    this.switchView('sales');

  nextWizardStep() {
    if (this.saleWizard.step < 4) {
      this.saleWizard.step++;
      this.switchView('sales');
    }
  }

  prevWizardStep() {
    if (this.saleWizard.step > 1) {
      this.saleWizard.step--;
      this.switchView('sales');
    }

  saveSale() {
    const service = this.services.find(s => s.id === this.saleWizard.selectedService);
    if (!service) {
      showToast(t('error'), 'error');
      return;
    }

    const total = service.price * this.saleWizard.quantity;

    this.addRecord('sales', {
      invoice_number: 'INV-' + Date.now(),
      customer_name: this.saleWizard.customerName,
      customer_phone: this.saleWizard.customerPhone,
      payment_method: this.saleWizard.paymentMethod,
      warranty: this.saleWizard.warranty,
      service_name: service.name,
      quantity: this.saleWizard.quantity,
      unit_price: service.price,
      total: total,
      subtotal: total
    }).then(() => {
      showToast(t('invoiceCreated'), 'success');
      this.saleWizard = {
        step: 1,
        selectedService: null,
        quantity: 1,
        warranty: 'noWarranty',
        paymentMethod: 'cash',
        customerName: '',
        customerPhone: '',
      };
      setTimeout(() => this.switchView('sales'), 1000);
    });
  }

`;

          <div class="summary-box">
            <div class="summary-row">
              <span>الخدمة:</span>
              <span>${esc(this.services.find(s => s.id === this.saleWizard.selectedService)?.name)}</span>
            </div>
            <div class="summary-row">
              <span>العدد:</span>
              <span class="num">${this.saleWizard.quantity}</span>
            </div>
            <div class="summary-row">
              <span>الضمان:</span>
              <span>${t(this.saleWizard.warranty)}</span>
            </div>
            <div class="summary-row">
              <span>طريقة الدفع:</span>
              <span>${t(this.saleWizard.paymentMethod)}</span>
            </div>
            <div class="summary-row total">
              <span>الإجمالي:</span>
              <span class="num">${fmtMoney(this.services.find(s => s.id === this.saleWizard.selectedService)?.price * this.saleWizard.quantity)}</span>
            </div>
          </div>

          <div class="modal-footer">
            <button class="btn btn-ghost" id="prevStep4Btn">${t('cancel')}</button>
            <button class="btn btn-blue" id="saveInvoiceBtn" style="flex: 1;">${icon('save')} ${t('saveSale')}</button>
            <button class="btn btn-green" id="sendWhatsappBtn" style="flex: 1;">${icon('whatsapp')} ${t('sendWhatsapp')}</button>
          </div>
        </div>
      </div>
    `;
  }

  render() {
    const app = document.getElementById('app');
    
    if (!this.currentUser) {
      app.innerHTML = this.renderLoginView();
      this.bindLoginEvents();
      return;
    }

    app.innerHTML = this.renderShell();
    this.switchView(this.currentView);
  }

  renderShell() {
    const initials = this.currentUser.name.trim().charAt(0);
    
    let navItems = [
      ['dashboard', t('dashboard'), 'dashboard'],
      ['services', t('services'), 'services'],
      ['customers', t('customers'), 'customers'],
      ['tires', t('tires'), 'tires'],
      ['appointments', t('appointments'), 'appointments'],
      ['sales', t('sales'), 'sales'],
      ['reports', t('reports'), 'reports'],
    ];

    if (this.currentUser.role === 'manager') {
      navItems.push(['suppliers', t('suppliers'), 'suppliers']);
      navItems.push(['tireTypes', t('tireTypes'), 'tireTypes']);
    }

    return `
      <div class="shell">
        <aside class="sidebar">
          <div class="brand">
            <div class="brand-mark">🏪</div>
            <div class="brand-text">
              <h1>ورشتي</h1>
              <p>${esc(SHOP.name)}</p>
            </div>
          </div>

          <nav class="side-nav">
            ${navItems.map(([view, label, ico]) => `
              <button class="side-link" data-view="${view}">
                ${icon(ico)}
                <span>${label}</span>
              </button>
            `).join('')}
          </nav>

          <div class="side-foot">
            <div class="user-chip">
              <div class="user-avatar">${esc(initials)}</div>
              <div class="user-meta">
                <p>${esc(this.currentUser.name)}</p>
                <span>${this.currentUser.role === 'manager' ? t('manager') : t('employee')}</span>
              </div>
            </div>
            <button class="lang-btn" id="langBtn">${currentLang === 'ar' ? 'EN' : 'AR'}</button>
            <button class="logout-btn" id="logoutBtn">${icon('logout')} ${t('logout')}</button>
          </div>
        </aside>

        <main class="main">
          <div class="page-title" id="pageTitle"></div>
          <div id="content"></div>
        </main>
      </div>
    `;
  }

  switchView(view) {
    this.currentView = view;
    
    document.querySelectorAll('.side-link').forEach(b => {
      b.classList.toggle('active', b.dataset.view === view);
    });

    const titles = {
      dashboard: t('dashboard'),
      tires: t('tires'),
      services: t('services'),
      customers: t('customers'),
      appointments: t('appointments'),
      sales: t('sales'),
      reports: t('reports'),
      suppliers: t('suppliers'),
      tireTypes: t('tireTypes'),
    };
    
    document.getElementById('pageTitle').textContent = titles[view] || 'صفحة';

    const renderers = {
      dashboard: () => this.renderDashboard(),
      sales: () => this.renderSalesView(),
      services: () => this.renderServicesView(),
      customers: () => this.renderCustomersView(),
      tires: () => this.renderTiresView(),
      appointments: () => this.renderAppointmentsView(),
      reports: () => this.renderReportsView(),
      suppliers: () => this.renderSuppliersView(),
      tireTypes: () => this.renderTireTypesView(),
    };

    const content = document.getElementById('content');
    content.innerHTML = (renderers[view] || (() => ''))();
    
    this.bindViewEvents(view);
  }

  bindLoginEvents() {
    document.getElementById('adminLoginBtn')?.addEventListener('click', () => {
      document.getElementById('username').value = 'admin';
      document.getElementById('password').value = 'admin123';
      this.login('admin', 'admin123', 'manager');
    });

    document.getElementById('empLoginBtn')?.addEventListener('click', () => {
      document.getElementById('username').value = 'employee';
      document.getElementById('password').value = 'emp123';
      this.login('employee', 'emp123', 'employee');
    });

    document.getElementById('doLoginBtn')?.addEventListener('click', () => {
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      if (u && p) {
        const role = u === 'admin' ? 'manager' : 'employee';
        this.login(u, p, role);
      }
    });
  }

  bindViewEvents(view) {
    document.getElementById('logoutBtn')?.addEventListener('click', () => this.logout());
    document.getElementById('langBtn')?.addEventListener('click', () => {
      currentLang = currentLang === 'ar' ? 'en' : 'ar';
      localStorage.setItem('tireshop_lang', currentLang);
      document.getElementById('htmlRoot').lang = currentLang;
      document.getElementById('htmlRoot').dir = currentLang === 'ar' ? 'rtl' : 'ltr';
      this.render();
    });

    document.querySelectorAll('.side-link').forEach(link => {
      link.addEventListener('click', (e) => {
        const view = e.currentTarget.dataset.view;
        if (view) this.switchView(view);
      });
    });

    if (view === 'dashboard') this.bindDashboardEvents();
    if (view === 'sales') this.bindSalesWizardEvents();
    if (view === 'services') this.bindServicesEvents();
    if (view === 'customers') this.bindCustomersEvents();
    if (view === 'tires') this.bindTiresEvents();
    if (view === 'appointments') this.bindAppointmentsEvents();
  }

  bindDashboardEvents() {
    document.getElementById('startNewSaleBtn')?.addEventListener('click', () => {
      this.startNewSale();
    });
  }

  bindSalesWizardEvents() {
    // Step 1: Service Selection
    if (this.saleWizard.step === 1) {
      document.querySelectorAll('.service-card').forEach(card => {
        card.addEventListener('click', () => {
          document.querySelectorAll('.service-card').forEach(c => c.classList.remove('selected'));
          card.classList.add('selected');
          this.saleWizard.selectedService = card.dataset.serviceId;
          document.getElementById('nextStep1Btn').disabled = false;
        });
      });

      document.getElementById('nextStep1Btn')?.addEventListener('click', () => {
        this.nextWizardStep();
      });
      
      document.getElementById('cancelWizardBtn')?.addEventListener('click', () => {
        this.switchView('dashboard');
      });
    }

    // Step 2: Quantity Selection
    if (this.saleWizard.step === 2) {
      const updateDisplay = () => {
        const val = parseInt(document.getElementById('qtyInput').value) || 1;
        this.saleWizard.quantity = Math.max(1, val);
        document.getElementById('qtyDisplay').textContent = this.saleWizard.quantity;
        document.getElementById('qtyInput').value = this.saleWizard.quantity;
      };

      document.getElementById('qtyMinus')?.addEventListener('click', () => {
        this.saleWizard.quantity = Math.max(1, this.saleWizard.quantity - 1);
        updateDisplay();
      });

      document.getElementById('qtyPlus')?.addEventListener('click', () => {
        this.saleWizard.quantity++;
        updateDisplay();
      });

      document.getElementById('qtyInput')?.addEventListener('change', updateDisplay);

      document.getElementById('nextStep2Btn')?.addEventListener('click', () => {
        this.nextWizardStep();
      });

      document.getElementById('prevStep2Btn')?.addEventListener('click', () => {
        this.prevWizardStep();
      });
    }

    // Step 3: Warranty & Payment
    if (this.saleWizard.step === 3) {
      document.querySelectorAll('.warranty-option').forEach(opt => {
        if (opt.dataset.warranty === this.saleWizard.warranty) {
          opt.classList.add('selected');
        }
        opt.addEventListener('click', () => {
          document.querySelectorAll('.warranty-option').forEach(o => o.classList.remove('selected'));
          opt.classList.add('selected');
          this.saleWizard.warranty = opt.dataset.warranty;
        });
      });

      document.getElementById('paymentMethodSelect')?.addEventListener('change', (e) => {
        this.saleWizard.paymentMethod = e.target.value;
      });

      document.getElementById('nextStep3Btn')?.addEventListener('click', () => {
        this.nextWizardStep();
      });

      document.getElementById('prevStep3Btn')?.addEventListener('click', () => {
        this.prevWizardStep();
      });
    }

    // Step 4: Customer Info
    if (this.saleWizard.step === 4) {
      document.getElementById('customerNameInput')?.addEventListener('input', (e) => {
        this.saleWizard.customerName = e.target.value;
      });

      document.getElementById('customerPhoneInput')?.addEventListener('input', (e) => {
        this.saleWizard.customerPhone = e.target.value;
      });

      document.getElementById('saveInvoiceBtn')?.addEventListener('click', () => {
        if (!this.saleWizard.customerName || !this.saleWizard.customerPhone) {
          showToast('أدخل بيانات العميل', 'warning');
          return;
        }
        this.saveSale();
      });

      document.getElementById('sendWhatsappBtn')?.addEventListener('click', () => {
        if (!this.saleWizard.customerName || !this.saleWizard.customerPhone) {
          showToast('أدخل بيانات العميل', 'warning');
          return;
        }
        this.sendWhatsApp();
      });

      document.getElementById('prevStep4Btn')?.addEventListener('click', () => {
        this.prevWizardStep();
      });
    }
  }

  renderServicesView() {
    return '<p>خدمات</p>';
  }

  renderCustomersView() {
    return '<p>عملاء</p>';
  }

  renderTiresView() {
    return '<p>إطارات</p>';
  }

  renderAppointmentsView() {
    return '<p>مواعيد</p>';
  }

  renderReportsView() {
    return '<p>تقارير</p>';
  }

  renderSuppliersView() {
    return '<p>موردين</p>';
  }

  renderTireTypesView() {
    return '<p>أنواع الإطارات</p>';
  }

  bindServicesEvents() {}
  bindCustomersEvents() {}
  bindTiresEvents() {}
  bindAppointmentsEvents() {}
}

// =====================================================================
// INITIALIZE APP
// =====================================================================

const app = new TireShopApp();
window.app = app;

</script>

</body>
</html>
