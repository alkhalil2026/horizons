  renderImportInventoryView() {
    const self = this;
    let loadedData = [];
    
    // ربط الأحداث بعد عرض الـ HTML
    setTimeout(() => {
      const fileInput = document.getElementById('importExcelFile');
      const uploadBtn = document.getElementById('importUploadBtn');
      const previewBtn = document.getElementById('importPreviewBtn');
      const startBtn = document.getElementById('importStartBtn');

      // معالج رفع الملف
      uploadBtn?.addEventListener('click', () => fileInput?.click());

      fileInput?.addEventListener('change', (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        const isCSV = file.name.endsWith('.csv');
        const reader = new FileReader();

        reader.onload = (event) => {
          try {
            let json = [];
            
            if (isCSV) {
              // قراءة CSV كـ نص
              const text = event.target?.result;
              const lines = text.trim().split('\n');
              
              if (lines.length < 2) throw new Error('الملف فارغ');
              
              const headers = lines[0].split(',').map(h => h.trim());
              json = lines.slice(1).map(line => {
                const values = line.split(',').map(v => v.trim());
                const obj = {};
                headers.forEach((h, i) => {
                  obj[h.toLowerCase()] = values[i] || '';
                });
                return obj;
              });
            } else {
              // قراءة Excel
              // التحقق من تحميل المكتبة
              if (typeof XLSX === 'undefined' || !XLSX.read) {
                throw new Error('مكتبة Excel لم تُحمل. يرجى استخدام ملف CSV أو إعادة تحميل الصفحة');
              }
              
              const data = event.target?.result;
              const workbook = XLSX.read(data, { type: 'array' });
              const worksheet = workbook.Sheets[workbook.SheetNames[0]];
              json = XLSX.utils.sheet_to_json(worksheet);
              
              // تحويل أسماء الأعمدة إلى lowercase
              json = json.map(row => {
                const newRow = {};
                Object.keys(row).forEach(key => {
                  newRow[key.toLowerCase()] = row[key];
                });
                return newRow;
              });
            }

            // معالجة البيانات وتحويل الأعمدة
            loadedData = json.map(row => {
              // البحث عن أسماء الأعمدة بأي شكل
              const brand = row.brand || row['الماركة'] || row['ماركة'] || '';
              const size = row.size || row['المقاس'] || row['مقاس'] || '';
              const stock = parseInt(row.stock || row['الكمية'] || row['كمية'] || row['qty'] || row['قطعة'] || 0) || 0;
              const selling_price = parseFloat(row.selling_price || row['السعر'] || row['سعر'] || row['price'] || 0) || 0;
              const cost = parseFloat(row.cost || row['سعر التكلفة'] || row['تكلفة'] || 0) || 0;
              const model = row.model || row['موديل'] || row['موديل الطراز'] || '2026';

              return {
                brand: String(brand).trim(),
                size: String(size).trim(),
                model: String(model).trim(),
                stock,
                selling_price,
                cost,
                supplier_id: null
              };
            }).filter(t => t.brand && t.size && t.stock > 0);

            if (loadedData.length === 0) {
              throw new Error('لم يتم العثور على بيانات صحيحة في الملف');
            }

            const statusMsg = document.getElementById('importFileStatus');
            if (statusMsg) {
              statusMsg.style.display = 'block';
              statusMsg.style.background = '#4caf50';
              statusMsg.style.color = 'white';
              statusMsg.textContent = `✅ تم تحميل ${loadedData.length} إطار من الملف`;
            }

            // تفعيل الأزرار
            if (previewBtn) previewBtn.disabled = false;
            if (startBtn) startBtn.disabled = false;

          } catch (error) {
            const statusMsg = document.getElementById('importFileStatus');
            if (statusMsg) {
              statusMsg.style.display = 'block';
              statusMsg.style.background = '#f44336';
              statusMsg.style.color = 'white';
              statusMsg.textContent = `❌ ${error.message}`;
            }
            console.error('خطأ في قراءة الملف:', error);
            loadedData = [];
          }
        };

        if (isCSV) {
          reader.readAsText(file);
        } else {
          reader.readAsArrayBuffer(file);
        }
      });

      // زر المعاينة
      previewBtn?.addEventListener('click', (e) => {
        e.preventDefault();
        if (loadedData.length === 0) {
          alert('يرجى تحميل ملف Excel أولاً');
          return;
        }

        const previewBox = document.getElementById('importPreviewBox');
        if (!previewBox) return;
        
        if (previewBox.style.display === 'none' || previewBox.style.display === '') {
          let html = '';
          let totalQty = 0;
          let totalPrice = 0;

          loadedData.forEach(tire => {
            html += `
              <div style="padding: 8px; background: white; margin-bottom: 6px; border-radius: 3px; border-left: 3px solid #f2a71b; font-size: 12px; display: flex; justify-content: space-between;">
                <span>${tire.brand} ${tire.size}</span>
                <span style="color: #f44336; font-weight: bold; margin: 0 10px;">×${tire.stock}</span>
                <span style="color: #4caf50; font-weight: bold;">${tire.selling_price.toFixed(2)}</span>
              </div>
            `;
            totalQty += tire.stock;
            totalPrice += tire.selling_price;
          });

          const tiresList = document.getElementById('importTiresList');
          if (tiresList) tiresList.innerHTML = html;
          
          const totalItemsEl = document.getElementById('importTotalItems');
          if (totalItemsEl) totalItemsEl.textContent = loadedData.length;

          const totalQtyEl = document.getElementById('importTotalQty');
          if (totalQtyEl) totalQtyEl.textContent = totalQty;
          
          const avgPriceEl = document.getElementById('importAvgPrice');
          if (avgPriceEl) avgPriceEl.textContent = (totalPrice / loadedData.length).toFixed(2);
          
          previewBox.style.display = 'block';
        } else {
          previewBox.style.display = 'none';
        }
      });

      // زر الاستيراج
      startBtn?.addEventListener('click', async (e) => {
        e.preventDefault();
        
        if (loadedData.length === 0) {
          alert('لا توجد بيانات للاستيراج');
          return;
        }

        startBtn.disabled = true;
        const progressDiv = document.getElementById('importProgress');
        const statusDiv = document.getElementById('importStatus');
        
        if (progressDiv) progressDiv.style.display = 'block';
        if (statusDiv) {
          statusDiv.style.display = 'block';
          statusDiv.style.background = '#2196f3';
          statusDiv.style.color = 'white';
          statusDiv.textContent = '⏳ جاري الاستيراج...';
        }

        let successful = 0;
        let failed = 0;

        for (let i = 0; i < loadedData.length; i++) {
          const tire = loadedData[i];

          try {
            const { error } = await self.supabase.from('tires').insert([tire]);

            if (error) {
              console.error(`خطأ في ${tire.brand} ${tire.size}:`, error);
              failed++;
            } else {
              successful++;
            }
          } catch (error) {
            console.error(`خطأ في ${tire.brand} ${tire.size}:`, error);
            failed++;
          }

          const progress = ((i + 1) / loadedData.length) * 100;
          const progressFill = document.getElementById('importProgressFill');
          const progressText = document.getElementById('importProgressText');
          
          if (progressFill) progressFill.style.width = progress + '%';
          if (progressText) progressText.textContent = `${i + 1}/${loadedData.length}`;
        }

        if (progressDiv) progressDiv.style.display = 'none';
        startBtn.disabled = false;

        if (statusDiv) {
          if (failed === 0) {
            statusDiv.style.background = '#4caf50';
            statusDiv.textContent = `✅ تم استيراج ${successful} إطار بنجاح!`;
            setTimeout(() => self.switchView('tires'), 1500);
          } else {
            statusDiv.style.background = '#f44336';
            statusDiv.textContent = `⚠️ تم استيراج ${successful} | فشل: ${failed}`;
          }
        }
      });

      // تعطيل الأزرار حتى يتم تحميل ملف
      if (previewBtn) previewBtn.disabled = true;
      if (startBtn) startBtn.disabled = true;

    }, 100);

    return `
      <div class="card">
        <div class="card-head">
          <h3>📦 استيراج الإطارات من Excel</h3>
        </div>

        <div style="background: #e3f2fd; border-left: 4px solid #2196f3; padding: 15px; border-radius: 5px; margin-bottom: 20px; color: #1976d2;">
          <strong>ℹ️ متطلبات الملف:</strong><br>
          الملف يجب أن يحتوي على الأعمدة: brand, size, stock, selling_price<br>
          الأعمدة الاختيارية: model, cost
        </div>

        <div style="margin-bottom: 20px; padding: 15px; background: #f5f5f5; border-radius: 5px;">
          <input type="file" id="importExcelFile" accept=".xlsx,.xls,.csv" style="display: none;">
          <button class="btn btn-amber" id="importUploadBtn" style="width: 100%; margin-bottom: 10px;">📁 اختر ملف Excel</button>
          <div id="importFileStatus" style="display: none; padding: 10px; border-radius: 3px; font-weight: bold; text-align: center;"></div>
        </div>

        <div class="grid-2" style="margin-bottom: 20px;">
          <div></div>
          <div style="display: flex; gap: 10px;">
            <button class="btn btn-ghost" id="importPreviewBtn" style="flex: 1;">👁️ معاينة</button>
            <button class="btn btn-amber" id="importStartBtn" style="flex: 1;">📥 استيراج</button>
          </div>
        </div>

        <div id="importProgress" style="display: none; margin: 20px 0;">
          <div style="background: #ddd; height: 8px; border-radius: 4px; overflow: hidden;">
            <div id="importProgressFill" style="height: 100%; background: linear-gradient(90deg, #f2a71b, #d6900f); width: 0%; transition: width 0.3s;"></div>
          </div>
          <div style="text-align: center; font-size: 12px; color: #666; margin-top: 5px;">
            <span id="importProgressText">0/0</span>
          </div>
        </div>

        <div id="importStatus" style="margin: 20px 0; padding: 15px; border-radius: 5px; display: none; font-weight: bold; text-align: center;">
        </div>

        <div id="importPreviewBox" style="display: none; background: #f5f5f5; border: 1px solid #ddd; border-radius: 5px; padding: 15px; max-height: 400px; overflow-y: auto; margin-top: 20px;">
          <div style="font-weight: bold; color: #333; margin-bottom: 10px;">📋 البيانات التي ستُضاف:</div>
          <div id="importTiresList"></div>
          <div style="background: #fff3cd; border-left: 4px solid #ffc107; padding: 15px; border-radius: 5px; margin-top: 15px;">
            <div style="display: flex; justify-content: space-between; padding: 5px 0; font-size: 14px;">
              <span>📊 إجمالي الإطارات:</span>
              <span style="font-weight: bold;" id="importTotalItems">0</span>
            </div>
            <div style="display: flex; justify-content: space-between; padding: 5px 0; font-size: 14px;">
              <span>📦 الكمية الإجمالية:</span>
              <span style="font-weight: bold;" id="importTotalQty">0</span>
            </div>
            <div style="display: flex; justify-content: space-between; padding: 5px 0; font-size: 14px;">
              <span>💵 متوسط السعر:</span>
              <span style="font-weight: bold;" id="importAvgPrice">0</span>
            </div>
          </div>
        </div>
      </div>
    `;
  }
}

// =====================================================================
// INITIALIZE APP
// =====================================================================

const app = new TireShopApp();
window.app = app;

</script>

</body>
</html>
