const FIELD_MAP = {
  tires: { 
    selling_price: 'sellingPrice', 
    cost_price: 'costPrice',
    tire_type_id: 'tireTypeId', 
    supplier_id: 'supplierId'
  },
  services: {},
  customers: {},
  appointments: { customer_id: 'customerId', customer_name: 'customerName', service_name: 'serviceName' },
  sales: {
    invoice_number: 'invoiceNumber',
    customer_id: 'customerId',
    customer_name: 'customerName',
    customer_phone: 'customerPhone',
    payment_method: 'paymentMethod',
    discount_amount: 'discountAmount',
    discount_percent: 'discountPercent',
    discount_total: 'discountTotal'
  },
  suppliers: {},
  supplier_invoices: {
    supplier_id: 'supplierId',
    invoice_number: 'invoiceNumber',
    total_amount: 'totalAmount',
    paid_amount: 'paidAmount',
    remaining_amount: 'remainingAmount',
    invoice_date: 'invoiceDate'
  },
  supplier_payments: {
    supplier_invoice_id: 'supplierInvoiceId',
    payment_amount: 'paymentAmount',
    payment_date: 'paymentDate'
  },
  expenses: {
    expense_type: 'expenseType',
    expense_date: 'expenseDate'
  },
};

function rowFromDb(row, table) {
  if (!row) return {};
  const map = FIELD_MAP[table] || {};
  const out = { ...row };
  
  Object.entries(map).forEach(([snake, camel]) => {
    if (snake in out) {
      out[camel] = out[snake];
      delete out[snake];
    }
  });
  
  out.createdAt = row.created_at;
  delete out.created_at;
  return out;
}

function rowToDb(obj, table) {
  if (!obj) return {};
  const map = FIELD_MAP[table] || {};
  const out = { ...obj };
  
  Object.entries(map).forEach(([snake, camel]) => {
    if (camel in out) {
      out[snake] = out[camel];
      delete out[camel];
    }
  });
  
  delete out.id;
  delete out.createdAt;
  delete out.created_at;
  
  // Log data for debugging
  if (table === 'customers') {
    console.log(`🔍 Customers rowToDb:`, out);
  }
  
  return out;
}

// =====================================================================
// MAIN APP CLASS
// =====================================================================

class TireShopApp {
  constructor() {
    this.sb = null;
    this.currentUser = null;
    this.currentView = 'login';
    this.isLoading = false; // علم لمنع تحميل متزامن متعدد
    
    // Database collections
    this.tires = [];
    this.services = [];
    this.customers = [];
    this.appointments = [];
    this.sales = [];
    this.suppliers = [];
    this.supplierInvoices = [];
    this.supplierPayments = [];
    this.expenses = [];
    
    // Sale wizard state
    this.saleWizard = {
      step: 1,
      selectedService: null,
      quantity: 1,
      warranty: 'noWarranty',
      paymentMethod: 'cash',
      customerName: '',
      customerPhone: '',
    };
    
    // Sales period filter
    this.currentSalesPeriod = 'today';
    this.currentCustomFromDate = null;
    this.currentCustomToDate = null;
    
    this.init();
  }

  async init() {
    try {
      const saved = sessionStorage.getItem('tireshop_user');
      if (saved) {
        this.currentUser = JSON.parse(saved);
        this.currentView = 'dashboard';
      }
    } catch (e) {
      console.error('Session load failed:', e);
    }

    try {
      if (window.supabase) {
        this.sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        console.log('✅ Supabase initialized');
      }
    } catch (e) {
      console.error('❌ Supabase init error:', e);
      this.sb = null;
    }

    if (this.currentUser) {
      await this.loadAllData();
    }

    this.render();
  }

  async loadAllData() {
    if (!this.sb) {
      console.warn('⚠️ Supabase not available');
      return;
    }

    // منع استدعاءات متعددة متزامنة
    if (this.isLoading) return;
    this.isLoading = true;

    try {
      const tables = [
        'tires', 'services', 'customers', 'appointments', 'sales',
        'suppliers', 'supplier_invoices', 'supplier_payments', 'expenses'
      ];

      // تحميل جميع الجداول بالتوازي بدلاً من التسلسل
      const results = await Promise.all(
        tables.map(table => 
          this.sb.from(table).select('*')
        )
      );

      results.forEach((result, idx) => {
        const table = tables[idx];
        const { data, error } = result;
        
        if (error) {
          console.error(`Error loading ${table}:`, error);
          return;
        }

        const mapped = data.map(row => rowFromDb(row, table));
        
        const propName = table
          .replace('supplier_invoices', 'supplierInvoices')
          .replace('supplier_payments', 'supplierPayments');
        
        this[propName] = mapped;
        console.log(`✅ Loaded ${mapped.length} from ${table}`);
      });
    } catch (e) {
      console.error('Data load error:', e);
    } finally {
      this.isLoading = false;
    }
  }

  async addRecord(table, data) {
    if (!this.sb) {
      const id = uid();
      const record = { id, ...data, createdAt: new Date().toISOString() };
      this[table].unshift(record);
      return true;
    }

    try {
      const dbData = rowToDb(data, table);
      console.log(`📤 Sending to ${table}:`, dbData);
      console.log(`📤 Keys:`, Object.keys(dbData));
      
      // تحقق من البيانات
      if (!dbData || Object.keys(dbData).length === 0) {
        console.error('❌ No data to send!');
        showToast('بيانات فارغة!', 'error');
        return false;
      }
      
      // تحقق من أن البيانات ليست undefined/null
      Object.entries(dbData).forEach(([key, value]) => {
        console.log(`  ${key}: "${value}" (type: ${typeof value})`);
      });
      
      const { data: insertedData, error } = await this.sb.from(table).insert([dbData]);
      
      if (error) {
        console.error(`❌ Error adding to ${table}:`, error);
        console.error('Error message:', error.message);
        console.error('Error code:', error.code);
        console.error('Error details:', error.details);
        console.log('📤 Data tried to send:', dbData);
        showToast(`❌ ${error.message || 'خطأ'}`, 'error');
        return false;
      }

      console.log('✅ Insert successful:', insertedData);
      await this.loadAllData();
      showToast(t('saved'), 'success');
      return true;
    } catch (e) {
      console.error('❌ Add record error:', e);
      console.error('Full error:', JSON.stringify(e));
      showToast(t('error'), 'error');
      return false;
    }
  }

  login(username, password, role) {
    const creds = {
      manager: { u: 'admin', p: 'admin123', name: 'المدير' },
      employee: { u: 'employee', p: 'emp123', name: 'الموظف' }
    };

    const c = creds[role];
    if (!c || username !== c.u || password !== c.p) {
      showToast('بيانات خاطئة', 'error');
      return;
    }

    this.currentUser = { id: uid(), name: c.name, role };
    sessionStorage.setItem('tireshop_user', JSON.stringify(this.currentUser));
    this.currentView = 'dashboard';
    this.loadAllData().then(() => this.render());
  }

  logout() {
    this.currentUser = null;
    this.currentView = 'login';
    sessionStorage.removeItem('tireshop_user');
    this.render();
  }

  // ===== SALES WIZARD =====

  startNewSale() {
    this.saleWizard = {
      step: 1,
      selectedService: null,
      quantity: 1,
      warranty: 'noWarranty',
      paymentMethod: 'cash',
      customerName: '',
      customerPhone: '',
    };
    this.switchView('sales');
  }

  nextWizardStep() {
    if (this.saleWizard.step < 4) {
      this.saleWizard.step++;
      this.switchView('sales');
    }
  }

  prevWizardStep() {
    if (this.saleWizard.step > 1) {
      this.saleWizard.step--;
      this.switchView('sales');
    }
  }

  saveSale() {
    const service = this.services.find(s => s.id === this.saleWizard.selectedService);
    if (!service) {
      showToast(t('error'), 'error');
      return;
    }

    const total = service.price * this.saleWizard.quantity;

    this.addRecord('sales', {
      invoice_number: 'INV-' + Date.now(),
      customer_name: this.saleWizard.customerName,
      customer_phone: this.saleWizard.customerPhone,
      payment_method: this.saleWizard.paymentMethod,
      warranty: this.saleWizard.warranty,
      service_name: service.name,
      quantity: this.saleWizard.quantity,
      unit_price: service.price,
      total: total,
      subtotal: total
    }).then(() => {
      showToast(t('invoiceCreated'), 'success');
      this.saleWizard = {
        step: 1,
        selectedService: null,
        quantity: 1,
        warranty: 'noWarranty',
        paymentMethod: 'cash',
        customerName: '',
        customerPhone: '',
      };
      setTimeout(() => this.switchView('sales'), 1000);
    });

  sendWhatsApp() {
    const service = this.services.find(s => s.id === this.saleWizard.selectedService);
    if (!service) {
      showToast(t('error'), 'error');
      return;
    }

    const total = service.price * this.saleWizard.quantity;
    const invoiceNumber = 'INV-' + Date.now();

    const message = `
🏪 *${SHOP.name}*
📋 *فاتورة خدمة*

*رقم الفاتورة:* ${invoiceNumber}
*اسم العميل:* ${this.saleWizard.customerName}
*الهاتف:* ${this.saleWizard.customerPhone}

*الخدمة:* ${service.name}
*العدد:* ${this.saleWizard.quantity}
*السعر الواحد:* ${fmtMoney(service.price)}
*المجموع:* ${fmtMoney(total)}

*الضمان:* ${t(this.saleWizard.warranty)}
*طريقة الدفع:* ${t(this.saleWizard.paymentMethod)}

شكراً لك 🙏
`;

    const encodedMsg = encodeURIComponent(message);
    const whatsappUrl = `https://wa.me/?text=${encodedMsg}`;
    window.open(whatsappUrl, '_blank');

    // Still save the invoice
    this.saveSale();
  }

  getSalesByPeriod(period, customFromDate = null, customToDate = null) {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    
    let fromDate = new Date(today);
    let toDate = new Date(today);
    toDate.setHours(23, 59, 59, 999);

    if (period === 'yesterday') {
      fromDate = new Date(today);
      fromDate.setDate(today.getDate() - 1);
      toDate = new Date(fromDate);
      toDate.setHours(23, 59, 59, 999);
    } else if (period === 'week') {
      fromDate = new Date(today);
      fromDate.setDate(today.getDate() - 6);
      toDate = new Date(today);
      toDate.setHours(23, 59, 59, 999);
    } else if (period === 'month') {
      fromDate = new Date(today.getFullYear(), today.getMonth(), 1);
      toDate = new Date(today);
      toDate.setHours(23, 59, 59, 999);
    } else if (period === 'custom' && customFromDate && customToDate) {
      fromDate = new Date(customFromDate);
      fromDate.setHours(0, 0, 0, 0);
      toDate = new Date(customToDate);
      toDate.setHours(23, 59, 59, 999);
    } else if (period === 'custom') {
      return [];
    }

    return this.sales.filter(sale => {
      const saleDate = new Date(sale.createdAt);
      return saleDate >= fromDate && saleDate <= toDate;
    });
  }

  filterByDate(data, dateField) {
    const specificDate = document.getElementById('filterSpecificDate')?.value;
    const fromDate = document.getElementById('filterFromDate')?.value;
    const toDate = document.getElementById('filterToDate')?.value;

    return data.filter(item => {
      const itemDate = item[dateField];
      if (!itemDate) return true;

      const date = new Date(itemDate).toISOString().split('T')[0];

      if (specificDate && date !== specificDate) return false;
      if (fromDate && date < fromDate) return false;
      if (toDate && date > toDate) return false;

      return true;
    });
  }

  async updateRecord(table, id, data) {
    if (!this.sb) {
      const idx = this[table].findIndex(x => x.id === id);
      if (idx > -1) {
        this[table][idx] = { ...this[table][idx], ...data };
      }
      return true;
    }

    try {
      const dbData = rowToDb(data, table);
      const { error } = await this.sb.from(table).update(dbData).eq('id', id);
      
      if (error) {
        console.error(`Error updating ${table}:`, error);
        showToast('خطأ في التحديث', 'error');
        return false;
      }

      await this.loadAllData();
      showToast('تم التحديث', 'success');
      return true;
    } catch (e) {
      console.error('Update record error:', e);
      showToast('خطأ', 'error');
      return false;
    }
  }

  async deleteRecord(table, id) {
    if (!this.sb) {
      const idx = this[table].findIndex(x => x.id === id);
      if (idx > -1) {
        this[table].splice(idx, 1);
      }
      return true;
    }

    try {
      const { error } = await this.sb.from(table).delete().eq('id', id);
      
      if (error) {
        console.error(`Error deleting from ${table}:`, error);
        return false;
      }

      await this.loadAllData();
      showToast('تم الحذف', 'success');
      return true;
    } catch (e) {
      console.error('Delete record error:', e);
      return false;
    }
  }

  bindSupplierPaymentsEvents() {
    const addBtn = document.getElementById('addPaymentBtn');
    if (addBtn && !addBtn.hasListener) {
      addBtn.hasListener = true;
      addBtn.addEventListener('click', () => {
        const invoiceId = document.getElementById('paymentInvoice').value;
        const amount = parseFloat(document.getElementById('paymentAmount').value) || 0;
        const notes = document.getElementById('paymentNotes').value;
        const invoice = this.supplierInvoices.find(i => i.id === invoiceId);

        if (!invoiceId || !amount || !invoice) {
          showToast('أدخل البيانات', 'error');
          return;
        }

        if (amount > invoice.remainingAmount) {
          showToast('المبلغ أكبر من المتبقي', 'error');
          return;
        }

        this.addRecord('supplier_payments', {
          supplier_invoice_id: invoiceId,
          payment_amount: amount,
          payment_date: new Date().toISOString(),
          notes
        }).then(() => {
          // تحديث المبلغ المدفوع والمتبقي
          const newPaidAmount = (invoice.paidAmount || 0) + amount;
          const newRemainingAmount = invoice.totalAmount - newPaidAmount;
          
          this.updateRecord('supplier_invoices', invoiceId, {
            paid_amount: newPaidAmount,
            remaining_amount: newRemainingAmount
          }).then(() => {
            document.getElementById('paymentInvoice').value = '';
            document.getElementById('paymentAmount').value = '';
            document.getElementById('paymentNotes').value = '';
            this.switchView('supplierPayments');
          });
        });
      });
    }
  }

      });
      
      document.getElementById('cancelWizardBtn')?.addEventListener('click', () => {
        this.switchView('dashboard');
      });
    }

    // Step 2: Quantity Selection
    if (this.saleWizard.step === 2) {
      const updateDisplay = () => {
        const val = parseInt(document.getElementById('qtyInput').value) || 1;
        this.saleWizard.quantity = Math.max(1, val);
        document.getElementById('qtyDisplay').textContent = this.saleWizard.quantity;
        document.getElementById('qtyInput').value = this.saleWizard.quantity;
      };

        this.saleWizard.quantity = Math.max(1, this.saleWizard.quantity - 1);
        updateDisplay();
      });

      document.getElementById('qtyPlus')?.addEventListener('click', () => {
        this.saleWizard.quantity++;
        updateDisplay();
      });

      document.getElementById('qtyInput')?.addEventListener('change', updateDisplay);

      document.getElementById('nextStep2Btn')?.addEventListener('click', () => {
        this.nextWizardStep();
      });

      document.getElementById('prevStep2Btn')?.addEventListener('click', () => {
        this.prevWizardStep();
      });

    // Step 3: Warranty & Payment

  bindImportInventoryEvents(tiresData) {
    const previewBtn = document.getElementById('importPreviewBtn');
    const startBtn = document.getElementById('importStartBtn');

    if (!previewBtn || !startBtn) return;

    previewBtn.addEventListener('click', () => {
      const previewBox = document.getElementById('importPreviewBox');
      if (previewBox.style.display === 'none') {
        let html = '';
        let totalQty = 0;
        let totalPrice = 0;

        tiresData.forEach(tire => {
          html += `
            <div style="padding: 8px; background: white; margin-bottom: 6px; border-radius: 3px; border-left: 3px solid #f2a71b; font-size: 12px; display: flex; justify-content: space-between;">
              <span>${esc(tire.name)}</span>
              <span style="color: #f44336; font-weight: bold; margin: 0 10px;">×${tire.quantity}</span>
              <span style="color: #4caf50; font-weight: bold;">${tire.selling_price.toFixed(2)}</span>
            </div>
          `;
          totalQty += tire.quantity;
          totalPrice += tire.selling_price;
        });

        document.getElementById('importTiresList').innerHTML = html;
        document.getElementById('importTotalQty').textContent = totalQty;
        document.getElementById('importAvgPrice').textContent = (totalPrice / tiresData.length).toFixed(2);
        previewBox.style.display = 'block';
      } else {
        previewBox.style.display = 'none';
      }
    });

    startBtn.addEventListener('click', async () => {
      const costPrice = parseFloat(document.getElementById('importCostPrice').value) || 0;

      startBtn.disabled = true;
      const progressDiv = document.getElementById('importProgress');
      const statusDiv = document.getElementById('importStatus');
      progressDiv.style.display = 'block';
      statusDiv.style.display = 'block';
      statusDiv.style.background = '#2196f3';
      statusDiv.style.color = 'white';
      statusDiv.textContent = '⏳ جاري الاستيراج...';

      let successful = 0;
      let failed = 0;

      for (let i = 0; i < tiresData.length; i++) {
        const tire = tiresData[i];

        try {
          const { error } = await this.supabase.from('tires').insert([{
            name: tire.name,
            size: tire.size,
            brand: tire.brand,
            model: tire.model,
            quantity: tire.quantity,
            selling_price: tire.selling_price,
            cost_price: costPrice,
            supplier_id: null
          }]);

          if (error) {
            console.error(`خطأ في ${tire.name}:`, error);
            failed++;
          } else {
            successful++;
          }
        } catch (error) {
          console.error(`خطأ في ${tire.name}:`, error);
          failed++;
        }

        const progress = ((i + 1) / tiresData.length) * 100;
        document.getElementById('importProgressFill').style.width = progress + '%';
        document.getElementById('importProgressText').textContent = `${i + 1}/${tiresData.length}`;
      }

      progressDiv.style.display = 'none';
      startBtn.disabled = false;

      if (failed === 0) {
        statusDiv.style.background = '#4caf50';
        statusDiv.textContent = `✅ تم استيراج ${successful} إطار بنجاح!`;
        showToast(`تم إضافة ${successful} إطار`, 'success');
        setTimeout(() => this.switchView('tires'), 1500);
      } else {
        statusDiv.style.background = '#f44336';
        statusDiv.textContent = `⚠️ تم استيراج ${successful} | فشل: ${failed}`;
        showToast(`تم إضافة ${successful} إطار (فشل: ${failed})`, 'error');
      }
    });
  }
}

// =====================================================================
// INITIALIZE APP
// =====================================================================

const app = new TireShopApp();
window.app = app;

</script>
