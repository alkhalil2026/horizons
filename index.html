    const nav = document.querySelector('.side-nav');
    if (nav && !nav.hasListener) {
      nav.hasListener = true;
      nav.addEventListener('click', (e) => {
        const link = e.target.closest('.side-link');
        if (link) {
          const view = link.dataset.view;
          if (view === 'newSale') this.lastSaleNumber = null;
          if (view) this.switchView(view);
        }
      });
    }

    // معالج عام لجميع أزرار الحذف والتعديل بـ event delegation
    const content = document.getElementById('content');
    if (content && !content.hasGeneralListener) {
      content.hasGeneralListener = true;
      content.addEventListener('click', (e) => {
        // معالجات الحذف
        if (e.target.matches('[data-delete-service]')) {
          if (!this.isManager()) return;
          const id = e.target.dataset.deleteService;
          if (confirm('حذف الخدمة؟')) {
            this.deleteRecord('services', id).then(() => this.switchView('services'));
          }
        }
        if (e.target.matches('[data-delete-customer]')) {
          const id = e.target.dataset.deleteCustomer;
          if (confirm('حذف العميل؟')) {
            this.deleteRecord('customers', id).then(() => this.switchView('customers'));
          }
        }
        if (e.target.matches('[data-delete-tire]')) {
          if (!this.isManager()) return;
          const id = e.target.dataset.deleteTire;
          if (confirm('حذف الإطار؟')) {
            this.deleteRecord('tires', id).then(() => this.switchView('tires'));
          }
        }
        if (e.target.matches('[data-delete-appointment]')) {
          const id = e.target.dataset.deleteAppointment;
          if (confirm('حذف الموعد؟')) {
            this.deleteRecord('appointments', id).then(() => this.switchView('appointments'));
          }
        }
        if (e.target.matches('[data-delete-supplier]')) {
          const id = e.target.dataset.deleteSupplier;
          if (confirm('حذف المورد؟')) {
            this.deleteRecord('suppliers', id).then(() => this.switchView('suppliers'));
          }
        }
        if (e.target.matches('[data-delete-invoice]')) {
          const id = e.target.dataset.deleteInvoice;
          if (confirm('حذف الفاتورة؟')) {
            this.deleteRecord('supplier_invoices', id).then(() => this.switchView('supplierInvoices'));
          }
        }
        if (e.target.matches('[data-delete-payment]')) {
          const id = e.target.dataset.deletePayment;
          if (confirm('حذف الدفعة؟')) {
            this.deleteRecord('supplier_payments', id).then(() => this.switchView('supplierPayments'));
          }
        }
        if (e.target.matches('[data-delete-fixed-expense]')) {
          const id = e.target.dataset.deleteFixedExpense;
          if (confirm('حذف المصروف الثابت؟')) {
            this.deleteRecord('expenses', id).then(() => this.switchView('fixedExpenses'));
          }
        }
        if (e.target.matches('[data-delete-daily-expense]')) {
          const id = e.target.dataset.deleteDailyExpense;
          if (confirm('حذف المصروف اليومي؟')) {
            this.deleteRecord('expenses', id).then(() => this.switchView('dailyExpenses'));
          }
        }
        if (e.target.matches('[data-delete-expense]')) {
          const id = e.target.dataset.deleteExpense;
          if (confirm('حذف المصروفة؟')) {
            this.deleteRecord('expenses', id).then(() => this.switchView('expenses'));
          }
        }

        // معالجات المبيعات
        if (e.target.matches('[data-delete-sale]')) {
          const id = e.target.dataset.deleteSale;
          if (confirm('حذف الفاتورة؟ هذا الإجراء غير قابل للتراجع')) {
            this.deleteRecord('sales', id).then(() => this.switchView(this.saleView()));
          }
        }

        if (e.target.matches('[data-edit-sale]')) {
          this.startEditSale(e.target.dataset.editSale);
        }

        if (e.target.matches('[data-print-invoice]')) {
          const id = e.target.dataset.printInvoice;
          const sale = this.sales.find(s => s.id === id);
          if (sale) this.printSaleInvoice(sale);
        }

        if (e.target.matches('[data-whatsapp-invoice]')) {
          const id = e.target.dataset.whatsappInvoice;
          const phone = e.target.dataset.customerPhone;
          const sale = this.sales.find(s => s.id === id);
          if (sale && phone) this.sendInvoiceViaWhatsApp(sale, phone);
        }

        // معالجات التعديل
        if (e.target.matches('[data-edit-service]')) {
          if (!this.isManager()) return;
          const service = this.services.find(s => s.id === e.target.dataset.editService);
          if (service) this.showEditServiceModal(service);
        }
        if (e.target.matches('[data-edit-customer]')) {
          const customer = this.customers.find(c => c.id === e.target.dataset.editCustomer);
          if (customer) this.showEditCustomerModal(customer);
        }
        if (e.target.matches('[data-edit-tire]')) {
          if (!this.isManager()) return;
          const tire = this.tires.find(t => t.id === e.target.dataset.editTire);
          if (tire) this.showEditTireModal(tire);
        }
        if (e.target.matches('[data-edit-appointment]')) {
          const appointment = this.appointments.find(a => a.id === e.target.dataset.editAppointment);
          if (appointment) this.showEditAppointmentModal(appointment);
        }
        if (e.target.matches('[data-edit-supplier]')) {
          const supplier = this.suppliers.find(s => s.id === e.target.dataset.editSupplier);
          if (supplier) this.showEditSupplierModal(supplier);
        }
        if (e.target.matches('[data-pay-invoice]')) {
          const invoiceId = e.target.dataset.payInvoice;
          const invoice = this.supplierInvoices.find(i => i.id === invoiceId);
          if (invoice) this.showPaymentModal(invoice);
        }
      });
    }

    // تحديث الأزرار النشطة
    document.querySelectorAll('.side-link').forEach(b => {
      b.classList.toggle('active', b.dataset.view === view);
    });

    if (view === 'dashboard') this.bindDashboardEvents();
    if (view === 'sales' || view === 'newSale') this.bindSalesWizardEvents();
    if (view === 'reports') this.bindReportsEvents();
    if (view === 'hr') this.bindHREvents();
    if (view === 'myHR') this.bindMyHREvents();
    if (view === 'newSale') this.bindNewSaleDoneEvents();
    if (view === 'shopSettings') this.bindShopSettingsEvents();
    if (view === 'services') this.bindServicesEvents();
    if (view === 'customers') this.bindCustomersEvents();
    if (view === 'tires') this.bindTiresEvents();
    if (view === 'appointments') this.bindAppointmentsEvents();
    if (view === 'fixedExpenses') this.bindFixedExpensesEvents();
    if (view === 'dailyExpenses') this.bindDailyExpensesEvents();
    if (view === 'suppliers') this.bindSuppliersEvents();
    if (view === 'supplierInvoices') this.bindSupplierInvoicesEvents();
    if (view === 'supplierPayments') this.bindSupplierPaymentsEvents();

    // ربط أحداث الفلتر
    document.getElementById('applyDateFilterBtn')?.addEventListener('click', () => {
      this.switchView(this.currentView);
    });

    document.getElementById('clearDateFilterBtn')?.addEventListener('click', () => {
      document.getElementById('filterSpecificDate').value = '';
      document.getElementById('filterFromDate').value = '';
      document.getElementById('filterToDate').value = '';
      this.switchView(this.currentView);
    });
  }

  bindServicesEvents() {
    if (!this.isManager()) return;
    const addBtn = document.getElementById('addServiceBtn');
    if (addBtn && !addBtn.hasListener) {
      addBtn.hasListener = true;
      addBtn.addEventListener('click', () => {
        const name = document.getElementById('serviceName').value.trim();
        const price = parseFloat(document.getElementById('servicePrice').value) || 0;

        if (!name || !price) {
          showToast('أدخل البيانات', 'error');
          return;
        }

        const nameEn = document.getElementById('serviceNameEn')?.value.trim() || null;
        this.addRecord('services', nameEn ? { name, name_en: nameEn, price } : { name, price }).then(async (ok) => {
          if (ok === false) return;
          if (nameEn) {
            const created = [...this.services].reverse().find(sv => sv.name === name) || this.services.find(sv => sv.name === name);
            await this.afterServiceSaved(created?.id, nameEn);
          }
          document.getElementById('serviceName').value = '';
          if (document.getElementById('serviceNameEn')) document.getElementById('serviceNameEn').value = '';
          document.getElementById('servicePrice').value = '';
          this.switchView('services');
        });
      });
    }
  }

  // بيانات العميل: الاسم مطلوب، والباقي اختياري (الفارغ يُرسل null)
  customerFormData(prefix) {
    const val = id => (document.getElementById(prefix + id)?.value || '').trim();
    const email = val('Email');
    return {
      name: val('Name'),
      phone: val('Phone') || null,
      email: email || null,
      address: val('Address') || null,
    };
  }

  validCustomer(data) {
    if (!data.name) {
      showToast('أدخل اسم العميل', 'error');
      return false;
    }
    if (data.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)) {
      showToast('صيغة البريد الإلكتروني غير صحيحة (أو اتركه فارغاً)', 'error');
      return false;
    }
    return true;
  }

  bindCustomersEvents() {
    // معالج الإضافة - يُضاف مرة واحدة فقط
    const addBtn = document.getElementById('addCustomerBtn');
    if (addBtn && !addBtn.hasListener) {
      addBtn.hasListener = true;
      addBtn.addEventListener('click', () => {
        const data = this.customerFormData('customer');
        if (!this.validCustomer(data)) return;

        this.addRecord('customers', data).then((ok) => {
          if (ok === false) return; // نُبقي البيانات في النموذج لتصحيحها
          document.getElementById('customerName').value = '';
          document.getElementById('customerPhone').value = '';
          document.getElementById('customerEmail').value = '';
          document.getElementById('customerAddress').value = '';
          this.switchView('customers');
        });
      });
    }
    
    // معالجات الحذف والتعديل موجودة في event delegation بـ bindViewEvents
  }

    if (!this.isManager()) return;

        const model = document.getElementById('tireModel').value.trim();

          document.getElementById('tireBrand').value = '';
          document.getElementById('tireModel').value = '';
          document.getElementById('tireSupplier').value = '';
          document.getElementById('tireCostPrice').value = '';
          document.getElementById('tireSellingPrice').value = '';
          document.getElementById('tireQuantity').value = '';
          this.switchView('tires');
        });
      });
    }
  }

  bindAppointmentsEvents() {
    const addBtn = document.getElementById('addAppointmentBtn');

      addBtn.hasListener = true;

        }).then(() => {

          document.getElementById('appointmentServiceName').value = '';
          document.getElementById('appointmentDateTime').value = '';

  bindSuppliersEvents() {
    const addBtn = document.getElementById('addSupplierBtn');
    if (addBtn && !addBtn.hasListener) {
      addBtn.hasListener = true;
      addBtn.addEventListener('click', () => {
        const name = document.getElementById('supplierName').value.trim();

        if (!name) {
          showToast('أدخل الاسم', 'error');
          return;
        }

        this.addRecord('suppliers', {

        }).then(() => {

          document.getElementById('supplierPhone').value = '';
          document.getElementById('supplierEmail').value = '';
          document.getElementById('supplierAddress').value = '';
          this.switchView('suppliers');
        });
      });
    }
  }

  bindSupplierInvoicesEvents() {
    // معالجة رفع صورة الفاتورة
    const imageInput = document.getElementById('invoiceImageInput');
    if (imageInput && !imageInput.hasListener) {
      imageInput.hasListener = true;
      imageInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            this.invoiceImage = event.target.result;
            document.getElementById('invoiceImagePreview').style.display = 'block';
            document.getElementById('invoiceImg').src = this.invoiceImage;
          };
          reader.readAsDataURL(file);
        }
      });
    }

    const addBtn = document.getElementById('addInvoiceBtn');
    if (addBtn && !addBtn.hasListener) {
      addBtn.hasListener = true;
      addBtn.addEventListener('click', () => {
        const supplierId = document.getElementById('invoiceSupplier').value;
        const invoiceNumber = document.getElementById('invoiceNumber').value.trim();
        const totalAmount = parseFloat(document.getElementById('invoiceTotal').value) || 0;

        if (!supplierId || !invoiceNumber || !totalAmount) {
          showToast('أدخل البيانات', 'error');
          return;
        }

        const recordData = {
          supplier_id: supplierId,
          invoice_number: invoiceNumber,
          total_amount: totalAmount,
          paid_amount: 0,
          remaining_amount: totalAmount,
          invoice_date: new Date().toISOString()
        };

        if (this.invoiceImage) {
          recordData.invoice_image = this.invoiceImage;
        }

        this.addRecord('supplier_invoices', recordData).then(() => {
          document.getElementById('invoiceSupplier').value = '';
          document.getElementById('invoiceNumber').value = '';
          document.getElementById('invoiceTotal').value = '';
          document.getElementById('invoiceImageInput').value = '';
          document.getElementById('invoiceImagePreview').style.display = 'none';
          this.invoiceImage = null;
          this.switchView('supplierInvoices');
        });
      });
    }
  }

  bindSupplierPaymentsEvents() {
    const addBtn = document.getElementById('addPaymentBtn');
    if (addBtn && !addBtn.hasListener) {
      addBtn.hasListener = true;
      addBtn.addEventListener('click', async () => {
        const invoiceId = document.getElementById('paymentInvoice').value;
        const amount = parseFloat(document.getElementById('paymentAmount').value) || 0;
        const notes = document.getElementById('paymentNotes').value;
        const invoice = this.supplierInvoices.find(i => i.id === invoiceId);

        if (!invoiceId || !amount || !invoice) {
          showToast('أدخل البيانات', 'error');
          return;
        }

        if (amount > (parseFloat(invoice.remainingAmount) || 0) + 0.0001) {
          showToast('المبلغ أكبر من المتبقي', 'error');
          return;
        }

        addBtn.disabled = true;
        const ok = await this.saveSupplierPayment(invoice, amount, readPaymentMethod('payMethod'), notes);
        addBtn.disabled = false;
        if (!ok) return; // نُبقي البيانات في النموذج
        this.switchView('supplierPayments');
      });
    }
    this.bindPayMethodPickers();
  }

  bindDashboardEvents() {
    // معالجات التصفية السريعة للوحة التحكم
    document.querySelectorAll('[data-dashboard-period]').forEach(btn => {
      btn.addEventListener('click', () => {
        const period = btn.dataset.dashboardPeriod;
        
        if (period === 'custom') {
          const picker = document.getElementById('dashboardCustomDatePicker');
          if (picker) {
            picker.style.display = picker.style.display === 'none' ? 'flex' : 'none';
          }
        } else {
          this.switchView('dashboard');
        }
      });
    });

    document.getElementById('applyDashboardCustomPeriod')?.addEventListener('click', () => {
      const fromInput = document.getElementById('dashboardCustomFromDate')?.value;
      const toInput = document.getElementById('dashboardCustomToDate')?.value;
      
      if (!fromInput || !toInput) {
        showToast('اختر التاريخين', 'warning');
        return;
      }
      
      this.switchView('dashboard');
    });
  }

  bindSalesWizardEvents() {
    document.getElementById('newSaleBtn')?.addEventListener('click', () => this.startNewSale());
    const w = this.saleWizard;
    const wizardActive = !!(w && w.active);

    if (wizardActive) {
      const root = document.getElementById('content');

      // أزرار عامة للسلة (إضافة / زيادة / نقص / حذف / تبويب)
      root.querySelectorAll('[data-add-item]').forEach(el => {
        el.addEventListener('click', () => this.addToCart(el.dataset.addItem, el.dataset.refId));
      });
      root.querySelectorAll('[data-cart-inc]').forEach(el => el.addEventListener('click', () => this.changeCartQty(el.dataset.cartInc, 1)));
      root.querySelectorAll('[data-cart-dec]').forEach(el => el.addEventListener('click', () => this.changeCartQty(el.dataset.cartDec, -1)));
      root.querySelectorAll('[data-cart-remove]').forEach(el => el.addEventListener('click', () => this.removeFromCart(el.dataset.cartRemove)));
      root.querySelectorAll('[data-wz-tab]').forEach(el => el.addEventListener('click', () => {
        w.tab = el.dataset.wzTab;
        this.switchView(this.saleView());
      }));

      // بحث فوري بدون إعادة رسم الصفحة
      document.getElementById('wzSearch')?.addEventListener('input', (e) => {
        const q = e.target.value.trim().toLowerCase();
        root.querySelectorAll('.pick-card').forEach(card => {
          card.style.display = !q || (card.dataset.search || '').includes(q) ? '' : 'none';
        });
      });

      document.getElementById('cancelWizardBtn')?.addEventListener('click', () => {
        const msg = w.editingSaleId ? 'إلغاء التعديل؟ ستبقى الفاتورة كما كانت.' : 'إلغاء الفاتورة وحذف الأصناف المختارة؟';
        if (w.cart.length && !confirm(msg)) return;
        this.cancelSale();
      });
      document.getElementById('nextStep1Btn')?.addEventListener('click', () => this.nextWizardStep());

      // الخطوة 2
      root.querySelectorAll('.warranty-option').forEach(opt => {
        opt.addEventListener('click', () => {
          root.querySelectorAll('.warranty-option').forEach(o => o.classList.remove('selected'));
          opt.classList.add('selected');
          w.warranty = opt.dataset.warranty;
        });
      });
      document.getElementById('paymentMethodSelect')?.addEventListener('change', (e) => {
        w.paymentMethod = e.target.value;
      });
      const refreshDiscount = () => {
        const box = document.getElementById('wzCartBox');
        if (box) box.innerHTML = this.renderCartPanel(false);
        const hint = document.getElementById('discountHint');
        const { discount, percent, subtotal } = this.cartTotals();
        if (hint) {
          hint.textContent = !discount ? ''
            : w.discountType === 'percent'
              ? `= ${fmtMoney(discount)} ر.ع`
              : `= ${subtotal ? +(discount / subtotal * 100).toFixed(2) : 0}% من المجموع`;
        }
        const raw = parseFloat(w.discount) || 0;
        if (w.discountType === 'percent' && raw > 100) showToast('أقصى نسبة خصم 100%', 'warning');
        if (w.discountType !== 'percent' && raw > subtotal) showToast('الخصم أكبر من المجموع', 'warning');
      };
      document.getElementById('discountInput')?.addEventListener('input', (e) => {
        w.discount = parseFloat(e.target.value) || 0;
        refreshDiscount();
      });
      root.querySelectorAll('[data-disc-type]').forEach(btn => btn.addEventListener('click', () => {
        if (w.discountType === btn.dataset.discType) return;
        w.discountType = btn.dataset.discType;
        w.discount = 0;
        this.switchView(this.saleView());
        document.getElementById('discountInput')?.focus();
      }));
      if (document.getElementById('discountInput')) refreshDiscount();
      document.getElementById('prevStep2Btn')?.addEventListener('click', () => this.prevWizardStep());
      document.getElementById('nextStep2Btn')?.addEventListener('click', () => this.nextWizardStep());

      // الخطوة 3
      const nameInput = document.getElementById('customerNameInput');
      const phoneInput = document.getElementById('customerPhoneInput');
      nameInput?.addEventListener('input', (e) => {
        w.customerName = e.target.value;
        const match = this.customers.find(c => c.name === e.target.value);
        if (match && match.phone && phoneInput) {
          phoneInput.value = match.phone;
          w.customerPhone = match.phone;
        }
      });
      phoneInput?.addEventListener('input', (e) => { w.customerPhone = e.target.value; });

      const checkCustomer = () => {
        if (!w.customerName.trim() || !w.customerPhone.trim()) {
          showToast('أدخل اسم العميل ورقم الهاتف', 'warning');
          return false;
        }
        return true;
      };
      document.getElementById('saveInvoiceBtn')?.addEventListener('click', () => {
        if (checkCustomer()) this.saveSale();
      });
      document.getElementById('sendWhatsappBtn')?.addEventListener('click', () => {
        if (checkCustomer()) this.sendWhatsApp();
      });
      document.getElementById('prevStep3Btn')?.addEventListener('click', () => this.prevWizardStep());
    }

    // معالجات التصفية السريعة للمبيعات
    document.querySelectorAll('[data-period-filter]').forEach(btn => {
      btn.addEventListener('click', () => {
        const period = btn.dataset.periodFilter;
        
        if (period === 'custom') {
          const picker = document.getElementById('customDatePicker');
          if (picker) {
            picker.style.display = picker.style.display === 'none' ? 'flex' : 'none';
          }
        } else {
          this.currentSalesPeriod = period;
          this.currentCustomFromDate = null;
          this.currentCustomToDate = null;
          this.switchView(this.saleView());
        }
      });
    });

    document.getElementById('applyCustomPeriod')?.addEventListener('click', () => {
      const fromInput = document.getElementById('customFromDate')?.value;
      const toInput = document.getElementById('customToDate')?.value;
      
      if (!fromInput || !toInput) {
        showToast('اختر التاريخين', 'warning');
        return;
      }
      
      this.currentSalesPeriod = 'custom';
      this.currentCustomFromDate = fromInput;
      this.currentCustomToDate = toInput;
      this.switchView(this.saleView());
    });
  }

  renderServicesView() {

    const canEdit = this.isManager();
    
    return `
      ${this.renderDateFilterBar()}
      <div class="${canEdit ? 'grid-2' : ''}">
        ${canEdit ? `<div class="card">
          <div class="card-head"><h3>${t('addService')}</h3></div>
          <div class="form-group">
            <label>اسم الخدمة *</label>
            <input type="text" id="serviceName" placeholder="مثال: بنشر">
          </div>

  // ===== التقارير: مقارنة المبيعات + الأعلى مبيعاً =====

  saleDate(s) {
    const d = new Date(s.createdAt || s.created_at);
    return isNaN(d) ? null : d;
  }

  saleTotal(s) {
    return parseFloat(s.total) || 0;
  }

  // تجميع المبيعات حسب الفترة: day (آخر 30 يوم) / month (آخر 12 شهر) / year (كل السنوات)
  salesSeries(mode) {
    const now = new Date();
    const loc = currentLang === 'en' ? 'en-GB' : 'ar-OM';
    const buckets = [];
    if (mode === 'day') {
      for (let i = 29; i >= 0; i--) {
        const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
        buckets.push({ key: d.toDateString(), label: d.toLocaleDateString(loc, { day: 'numeric', month: 'short' }), total: 0, count: 0 });
      }
    } else if (mode === 'month') {
      for (let i = 11; i >= 0; i--) {
        const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        buckets.push({ key: d.getFullYear() + '-' + d.getMonth(), label: d.toLocaleDateString(loc, { month: 'short', year: 'numeric' }), total: 0, count: 0 });
      }
    } else {
      const years = this.sales.map(s => this.saleDate(s)?.getFullYear()).filter(Boolean);
      const first = Math.min(now.getFullYear() - 2, ...years);
      for (let y = first; y <= now.getFullYear(); y++) {
        buckets.push({ key: String(y), label: String(y), total: 0, count: 0 });
      }
    }
    const index = new Map(buckets.map(b => [b.key, b]));
    this.sales.forEach(s => {
      const d = this.saleDate(s);
      if (!d) return;
      const key = mode === 'day' ? new Date(d.getFullYear(), d.getMonth(), d.getDate()).toDateString()
        : mode === 'month' ? d.getFullYear() + '-' + d.getMonth()
        : String(d.getFullYear());
      const b = index.get(key);
      if (b) { b.total += this.saleTotal(s); b.count++; }
    });
    return buckets;
  }

  // مجموع فترة: today / yesterday / month / lastMonth / year / lastYear
  periodTotal(which) {
    const now = new Date();
    const y = now.getFullYear(), m = now.getMonth(), dd = now.getDate();
    const ranges = {
      today: [new Date(y, m, dd), new Date(y, m, dd + 1)],
      yesterday: [new Date(y, m, dd - 1), new Date(y, m, dd)],
      month: [new Date(y, m, 1), new Date(y, m + 1, 1)],
      lastMonth: [new Date(y, m - 1, 1), new Date(y, m, 1)],
      year: [new Date(y, 0, 1), new Date(y + 1, 0, 1)],
      lastYear: [new Date(y - 1, 0, 1), new Date(y, 0, 1)],
    };
    const [from, to] = ranges[which];
    let total = 0, count = 0;
    this.sales.forEach(s => {
      const d = this.saleDate(s);
      if (d && d >= from && d < to) { total += this.saleTotal(s); count++; }
    });
    return { total, count };
  }

  // الأصناف المباعة (خدمات + إطارات) مع النوع
  topProducts(range) {
    const now = new Date();
    const from = range === 'month' ? new Date(now.getFullYear(), now.getMonth(), 1)
      : range === 'year' ? new Date(now.getFullYear(), 0, 1) : null;
    const map = new Map();
    const add = (name, type, qty, revenue) => {
      name = String(name || '-').trim();
      const key = name;
      const row = map.get(key) || { name, type, qty: 0, revenue: 0, invoices: 0, revenueKnown: true };
      row.qty += qty;
      if (revenue == null) row.revenueKnown = false; else row.revenue += revenue;
      row.invoices++;
      if (type !== 'unknown') row.type = type;
      map.set(key, row);
    };
    const tireNames = new Set(this.tires.map(t => this.tireLabel(t)));
    const guessType = name => tireNames.has(name) || /\d{3}\/\d{2}R?\d{2}/i.test(name) ? 'tire'
      : this.services.some(s => s.name === name) ? 'service' : 'unknown';

    this.sales.forEach(s => {
      const d = this.saleDate(s);
      if (from && (!d || d < from)) return;
      let items = s.items;
      if (typeof items === 'string') { try { items = JSON.parse(items); } catch (e) { items = null; } }
      if (Array.isArray(items) && items.length) {
        items.forEach(i => {
          const q = parseFloat(i.quantity) || 1;
          const u = parseFloat(i.unitPrice ?? i.unit_price) || 0;
          const name = i.description || i.name;
          add(name, i.type === 'tire' || i.type === 'service' ? i.type : guessType(name), q, q * u);
        });
      } else if (s.service_name) {
        const unit = parseFloat(s.unit_price);
        if (unit) {
          const q = parseFloat(s.quantity) || 1;
          add(s.service_name, guessType(s.service_name), q, q * unit);
        } else {
          // فاتورة قديمة متعددة الأصناف بدون تفاصيل: نستخرج الأسماء والكميات من النص
          String(s.service_name).split(/[،,]\s*/).forEach(part => {
            const m = /^(.*?)\s*×\s*(\d+(?:\.\d+)?)\s*$/.exec(part.trim());
            const name = m ? m[1] : part;
            add(name, guessType(name.trim()), m ? parseFloat(m[2]) : 1, null);
          });
        }
      }
    });
    return [...map.values()].sort((a, b) => b.qty - a.qty || b.revenue - a.revenue);
  }

  renderReportsView() {
    const mode = this.reportMode || 'month';
    const range = this.topRange || 'all';
    const showAll = !!this.topShowAll;
    const asTable = !!this.reportAsTable;

    const tile = (label, cur, prev, prevLabel) => {
      const diff = prev.total ? ((cur.total - prev.total) / prev.total) * 100 : null;
      const up = diff != null && diff >= 0;
      return `
        <div class="rep-tile">
          <div class="rep-tile-label">${label}</div>
          <div class="rep-tile-value num">${fmtMoney(cur.total)} <small>ر.ع</small></div>
          <div class="rep-tile-sub">${cur.count} فاتورة</div>
          <div class="rep-tile-cmp ${diff == null ? '' : up ? 'up' : 'down'}">
            ${diff == null ? `${prevLabel}: <span class="num">${fmtMoney(prev.total)}</span>`
              : `${up ? '▲' : '▼'} <span class="num">${Math.abs(diff).toFixed(0)}%</span> مقارنة بـ${prevLabel} (<span class="num">${fmtMoney(prev.total)}</span>)`}
          </div>
        </div>`;
    };

    const series = this.salesSeries(mode);
    const products = this.topProducts(range);
    const shown = showAll ? products : products.slice(0, 10);
    const totalRevenue = products.reduce((s, p) => s + p.revenue, 0);
    const modeTitle = { day: 'المبيعات اليومية — آخر 30 يوماً', month: 'المبيعات الشهرية — آخر 12 شهراً', year: 'المبيعات السنوية' }[mode];

    return `
      <div class="rep-tiles">
        ${tile('مبيعات اليوم', this.periodTotal('today'), this.periodTotal('yesterday'), 'أمس')}
        ${tile('مبيعات هذا الشهر', this.periodTotal('month'), this.periodTotal('lastMonth'), 'الشهر الماضي')}

              <button class="${mode === 'year' ? 'active' : ''}" data-rep-mode="year">سنوي</button>
            </div>
            <button class="btn btn-ghost btn-sm" id="repToggleTable">${asTable ? '📊 عرض كرسم' : '📋 عرض كجدول'}</button>
          </div>
        </div>
        ${asTable ? `
          <div class="table-wrap">
            <table>
              <thead><tr><th>الفترة</th><th>عدد الفواتير</th><th>إجمالي المبيعات</th></tr></thead>
              <tbody>
                ${[...series].reverse().map(b => `<tr><td>${esc(b.label)}</td><td class="num">${b.count}</td><td class="num">${fmtMoney(b.total)}</td></tr>`).join('')}
              </tbody>
            </table>
          </div>` : `
          <div class="rep-chart-wrap"><canvas id="salesChart"></canvas></div>
          ${typeof Chart === 'undefined' ? '<p class="text-center text-xs">تعذّر تحميل مكتبة الرسوم البيانية — استخدم "عرض كجدول"</p>' : ''}`}
      </div>

      <div class="card">
        <div class="card-head rep-head">
          <h3>🏆 الأعلى مبيعاً (${products.length} صنف)</h3>
          <div class="seg">
            <button class="${range === 'month' ? 'active' : ''}" data-top-range="month">هذا الشهر</button>
            <button class="${range === 'year' ? 'active' : ''}" data-top-range="year">هذه السنة</button>
            <button class="${range === 'all' ? 'active' : ''}" data-top-range="all">الكل</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>#</th><th>الصنف</th><th>النوع</th><th>الكمية المباعة</th><th>عدد الفواتير</th><th>الإيراد (قبل الخصم)</th><th>النسبة من الإيراد</th></tr>
            </thead>
            <tbody>
              ${shown.map((p, i) => {
                const share = totalRevenue ? (p.revenue / totalRevenue) * 100 : null;
                return `
                <tr>
                  <td class="num">${i < 3 ? ['🥇', '🥈', '🥉'][i] : i + 1}</td>

  bindReportsEvents() {
    const root = document.getElementById('content');
    root.querySelectorAll('[data-rep-mode]').forEach(b => b.addEventListener('click', () => {
      this.reportMode = b.dataset.repMode;
      this.switchView('reports');
    }));
    root.querySelectorAll('[data-top-range]').forEach(b => b.addEventListener('click', () => {
      this.topRange = b.dataset.topRange;
      this.topShowAll = false;
      this.switchView('reports');
    }));
    document.getElementById('repToggleTable')?.addEventListener('click', () => {
      this.reportAsTable = !this.reportAsTable;
      this.switchView('reports');
    });
    document.getElementById('topShowAll')?.addEventListener('click', () => {
      this.topShowAll = !this.topShowAll;
      this.switchView('reports');
    });
    this.drawSalesChart();

  drawSalesChart() {
    if (this.salesChart) { try { this.salesChart.destroy(); } catch (e) {} this.salesChart = null; }
    const canvas = document.getElementById('salesChart');
    if (!canvas || typeof Chart === 'undefined') return;
    const series = this.salesSeries(this.reportMode || 'month');
    const css = getComputedStyle(document.documentElement);
    const ink = (css.getPropertyValue('--text-600') || '#5B564C').trim();
    const grid = (css.getPropertyValue('--line') || '#E3DDD0').trim();
    const maxIdx = series.reduce((mi, b, i, arr) => b.total > arr[mi].total ? i : mi, 0);
    this.salesChart = new Chart(canvas, {
      type: 'bar',
      data: {
        labels: series.map(b => b.label),
        datasets: [{
          label: tr('إجمالي المبيعات'),
          data: series.map(b => +b.total.toFixed(3)),
          backgroundColor: series.map((b, i) => i === maxIdx && b.total > 0 ? '#B87A08' : '#D6900F'),
          borderRadius: { topLeft: 4, topRight: 4 },
          borderSkipped: 'bottom',
          maxBarThickness: 40,
          categoryPercentage: 0.8,
          barPercentage: 0.9,
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        locale: currentLang === 'en' ? 'en-GB' : 'ar-OM',
        plugins: {
          legend: { display: false },
          tooltip: {
            rtl: currentLang !== 'en',
            callbacks: {
              label: ctx => `${tr('إجمالي المبيعات')}: ${fmtMoney(ctx.parsed.y)} ${tr('ر.ع')}`,
              afterLabel: ctx => `${tr('عدد الفواتير')}: ${series[ctx.dataIndex].count}`,
            },
          },
        },
        scales: {
          x: { reverse: currentLang !== 'en', grid: { display: false }, ticks: { color: ink, font: { family: 'Almarai' }, maxRotation: 0, autoSkip: true } },
          y: { beginAtZero: true, position: currentLang !== 'en' ? 'right' : 'left', grid: { color: grid, drawBorder: false }, ticks: { color: ink, font: { family: 'Almarai' }, callback: v => fmtMoney(v) } },
        },
      },
    });
  }

    // حساب المبيعات

    // صافي الربح = المبيعات - المصروفات اليومية - المصاريف الثابتة - الدفعة الجزئية للموردين
    const netProfit = totalSales - dailyExpenses - fixedExpenses - totalSupplierPartialPayments;

        </div>
      </div>

      <div class="card" style="background: linear-gradient(135deg, #F2A71B 0%, #D6900F 100%); color: white; margin-top: 20px;">
        <div class="card-head" style="border-bottom-color: rgba(255,255,255,0.2); margin-bottom: 12px;">
          <h3 style="color: white;">💰 صافي الربح اليومي</h3>
        </div>
        <div style="font-size: 32px; font-weight: 800; text-align: center;">
          ${fmtMoney(netProfit)} ر.ع
        </div>
        <div style="font-size: 12px; text-align: center; margin-top: 8px; opacity: 0.9;">
          المبيعات (${fmtMoney(totalSales)}) - يومية (${fmtMoney(dailyExpenses)}) - ثابتة (${fmtMoney(fixedExpenses)}) - موردين (${fmtMoney(totalSupplierPartialPayments)})
        </div>
      </div>

      <div class="card" style="margin-top: 20px;">
        <div class="card-head">
          <h3>المصروفات (${filteredExpenses.length})</h3>
          <button class="btn btn-amber btn-sm" id="addExpenseBtn">➕ إضافة</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>النوع</th>
                <th>البيان</th>
                <th>المبلغ</th>
                <th>التاريخ</th>
                <th>الإجراءات</th>
              </tr>
            </thead>
            <tbody>
              ${filteredExpenses.map(e => `
                <tr>
                  <td>
                    <span class="badge ${e.expenseType === 'يومية' ? 'badge-info' : 'badge-warning'}">
                      ${e.expenseType}
                    </span>
                  </td>
                  <td>${esc(e.description || '-')}</td>
                  <td class="num">${fmtMoney(e.amount)}</td>
                  <td>${fmtDate(e.expenseDate)}</td>
                  <td>
                    <button class="btn btn-xs btn-danger" data-delete-expense="${e.id}">🗑️ حذف</button>
                  </td>
                </tr>
              `).join('') || '<tr><td colspan="5" class="text-center">لا توجد مصروفات</td></tr>'}
            </tbody>
          </table>
        </div>
      </div>
    `;
  }

  bindFixedExpensesEvents() {
    const addBtn = document.getElementById('addFixedExpenseBtn');
    if (addBtn && !addBtn.hasListener) {
      addBtn.hasListener = true;
      addBtn.addEventListener('click', () => {
        const type = document.getElementById('fixedExpenseTypeSelect').value;
        const description = document.getElementById('fixedExpenseDescInput').value.trim();
        const amount = parseFloat(document.getElementById('fixedExpenseAmountInput').value) || 0;
        const expenseDate = document.getElementById('fixedExpenseDateInput').value;

        if (!type || !amount) {
          showToast('أدخل النوع والمبلغ', 'error');
          return;
        }

        this.addRecord('expenses', {
          expense_type: 'ثابتة',
          description: type,
          notes: description,
          amount,
          expense_date: new Date(expenseDate).toISOString()
        }).then(() => {
          this.switchView('fixedExpenses');
        });
      });
    }
  }

  bindDailyExpensesEvents() {
    // معالجة رفع الصورة
    const imageInput = document.getElementById('dailyExpenseImageInput');
    if (imageInput && !imageInput.hasListener) {
      imageInput.hasListener = true;
      imageInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            this.dailyExpenseImage = event.target.result;
            document.getElementById('dailyExpenseImagePreview').style.display = 'block';
            document.getElementById('dailyExpenseImg').src = this.dailyExpenseImage;
          };
          reader.readAsDataURL(file);
        }
      });
    }

    const addBtn = document.getElementById('addDailyExpenseBtn');
    if (addBtn && !addBtn.hasListener) {
      addBtn.hasListener = true;
      addBtn.addEventListener('click', () => {
        const description = document.getElementById('dailyExpenseDescInput').value.trim();
        const amount = parseFloat(document.getElementById('dailyExpenseAmountInput').value) || 0;
        const expenseDate = document.getElementById('dailyExpenseDateInput').value;

        if (!description || !amount) {
          showToast('أدخل البيان والمبلغ', 'error');
          return;
        }

        const recordData = {
          expense_type: 'يومية',
          description,
          amount,
          expense_date: new Date(expenseDate).toISOString()
        };

        if (this.dailyExpenseImage) {
          recordData.image = this.dailyExpenseImage;
        }

        this.addRecord('expenses', recordData).then(() => {
          document.getElementById('dailyExpenseDescInput').value = '';
          document.getElementById('dailyExpenseAmountInput').value = '';
          document.getElementById('dailyExpenseImageInput').value = '';
          document.getElementById('dailyExpenseImagePreview').style.display = 'none';
          this.dailyExpenseImage = null;
          this.switchView('dailyExpenses');
        });
      });
    }
  }

  bindExpensesEvents() {
    document.getElementById('addExpenseBtn')?.addEventListener('click', () => {
      this.showAddExpenseModal();
    });

    document.querySelectorAll('[data-delete-expense]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.deleteExpense;
        if (confirm('هل تريد حذف هذه المصروفة؟')) {
          this.deleteRecord('expenses', id).then(() => {
            this.switchView('expenses');
          });
        }
      });
    });
  }

  showAddExpenseModal() {
    const content = `
      <div class="form-group">
        <label>نوع المصروفة *</label>
        <select id="expenseTypeSelect">
          <option value="يومية">مصروفة يومية</option>
          <option value="ثابتة">مصروفة ثابتة</option>
        </select>
      </div>
      <div class="form-group">
        <label>البيان *</label>
        <input type="text" id="expenseDescInput" placeholder="وصف المصروفة" required>
      </div>
      <div class="form-group">
        <label>المبلغ *</label>
        <input type="number" id="expenseAmountInput" step="0.01" min="0" placeholder="0.00" required>
      </div>
      <div class="form-group">
        <label>التاريخ</label>
        <input type="date" id="expenseDateInput" value="${new Date().toISOString().split('T')[0]}">
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="closeExpenseModalBtn">إلغاء</button>
        <button class="btn btn-amber" id="saveExpenseBtn">💾 حفظ</button>
      </div>
    `;

    const overlay = document.getElementById('modalOverlay');
    const box = document.getElementById('modalBox');
    box.innerHTML = `
      <div class="modal-head">
        <h3>${t('addExpense')}</h3>
        <button class="modal-close" onclick="document.getElementById('modalOverlay').classList.remove('active')">${icon('x') || '✕'}</button>
      </div>
      <div>${content}</div>
    `;
    overlay.classList.add('active');

    document.getElementById('closeExpenseModalBtn')?.addEventListener('click', () => {
      overlay.classList.remove('active');
    });

    document.getElementById('saveExpenseBtn')?.addEventListener('click', () => {
      const expenseType = document.getElementById('expenseTypeSelect').value;
      const description = document.getElementById('expenseDescInput').value;
      const amount = parseFloat(document.getElementById('expenseAmountInput').value) || 0;
      const expenseDate = document.getElementById('expenseDateInput').value;

      if (!description || !amount) {
        showToast('أدخل جميع البيانات المطلوبة', 'error');
        return;
      }

      this.addRecord('expenses', {
        expense_type: expenseType,
        description,
        amount,
        expense_date: new Date(expenseDate).toISOString()
      }).then(() => {
        overlay.classList.remove('active');
        this.switchView('expenses');
      });
    });
  }

  renderImportInventoryView() {
    const self = this;
    let loadedData = [];
    
    // ربط الأحداث بعد عرض الـ HTML
    setTimeout(() => {
      const fileInput = document.getElementById('importExcelFile');
      const uploadBtn = document.getElementById('importUploadBtn');
      const previewBtn = document.getElementById('importPreviewBtn');
      const startBtn = document.getElementById('importStartBtn');

      // معالج رفع الملف
      uploadBtn?.addEventListener('click', () => fileInput?.click());

      fileInput?.addEventListener('change', (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        const isCSV = file.name.endsWith('.csv');
        const reader = new FileReader();

        reader.onload = (event) => {
          try {
            let json = [];
            
            if (isCSV) {
              // قراءة CSV كـ نص
              const text = event.target?.result;
              const lines = text.trim().split('\n');
              
              if (lines.length < 2) throw new Error('الملف فارغ');
              
              const headers = lines[0].split(',').map(h => h.trim());
              json = lines.slice(1).map(line => {
                const values = line.split(',').map(v => v.trim());
                const obj = {};
                headers.forEach((h, i) => {
                  obj[h.toLowerCase()] = values[i] || '';
                });
                return obj;
              });
            } else {
              // قراءة Excel
              // التحقق من تحميل المكتبة
              if (typeof XLSX === 'undefined' || !XLSX.read) {
                throw new Error('مكتبة Excel لم تُحمل. يرجى استخدام ملف CSV أو إعادة تحميل الصفحة');
              }
              
              const data = event.target?.result;
              const workbook = XLSX.read(data, { type: 'array' });
              const worksheet = workbook.Sheets[workbook.SheetNames[0]];
              json = XLSX.utils.sheet_to_json(worksheet);
              
              // تحويل أسماء الأعمدة إلى lowercase
              json = json.map(row => {
                const newRow = {};
                Object.keys(row).forEach(key => {
                  newRow[key.toLowerCase()] = row[key];
                });
                return newRow;
              });
            }

            // معالجة البيانات وتحويل الأعمدة
            loadedData = json.map(row => {
              // البحث عن أسماء الأعمدة بأي شكل
              const brand = row.brand || row['الماركة'] || row['ماركة'] || '';
              const size = row.size || row['المقاس'] || row['مقاس'] || '';
              const stock = parseInt(row.stock || row['الكمية'] || row['كمية'] || row['qty'] || row['قطعة'] || 0) || 0;
              const selling_price = parseFloat(row.selling_price || row['السعر'] || row['سعر'] || row['price'] || 0) || 0;
              const cost = parseFloat(row.cost || row['سعر التكلفة'] || row['تكلفة'] || 0) || 0;
              const model = row.model || row['موديل'] || row['موديل الطراز'] || '2026';

              return {
                brand: String(brand).trim(),
                size: String(size).trim(),
                model: String(model).trim(),
                stock,
                selling_price,
                cost,
                supplier_id: null
              };
            }).filter(t => t.brand && t.size && t.stock > 0);

            if (loadedData.length === 0) {
              throw new Error('لم يتم العثور على بيانات صحيحة في الملف');
            }

            const statusMsg = document.getElementById('importFileStatus');
            if (statusMsg) {
              statusMsg.style.display = 'block';
              statusMsg.style.background = '#4caf50';
              statusMsg.style.color = 'white';
              statusMsg.textContent = `✅ تم تحميل ${loadedData.length} إطار من الملف`;
            }

            // تفعيل الأزرار
            if (previewBtn) previewBtn.disabled = false;
            if (startBtn) startBtn.disabled = false;

          } catch (error) {
            const statusMsg = document.getElementById('importFileStatus');
            if (statusMsg) {
              statusMsg.style.display = 'block';
              statusMsg.style.background = '#f44336';
              statusMsg.style.color = 'white';
              statusMsg.textContent = `❌ ${error.message}`;
            }
            console.error('خطأ في قراءة الملف:', error);
            loadedData = [];
          }
        };

        if (isCSV) {
          reader.readAsText(file);
        } else {
          reader.readAsArrayBuffer(file);
        }
      });

      // زر المعاينة
      previewBtn?.addEventListener('click', (e) => {
        e.preventDefault();
        if (loadedData.length === 0) {
          alert('يرجى تحميل ملف Excel أولاً');
          return;
        }

        const previewBox = document.getElementById('importPreviewBox');
        if (!previewBox) return;
        
        if (previewBox.style.display === 'none' || previewBox.style.display === '') {
          let html = '';
          let totalQty = 0;
          let totalPrice = 0;

          loadedData.forEach(tire => {
            html += `
              <div style="padding: 8px; background: white; margin-bottom: 6px; border-radius: 3px; border-left: 3px solid #f2a71b; font-size: 12px; display: flex; justify-content: space-between;">
                <span>${tire.brand} ${tire.size}</span>
                <span style="color: #f44336; font-weight: bold; margin: 0 10px;">×${tire.stock}</span>
                <span style="color: #4caf50; font-weight: bold;">${tire.selling_price.toFixed(2)}</span>
              </div>
            `;
            totalQty += tire.stock;
            totalPrice += tire.selling_price;
          });

          const tiresList = document.getElementById('importTiresList');
          if (tiresList) tiresList.innerHTML = html;
          
          const totalItemsEl = document.getElementById('importTotalItems');
          if (totalItemsEl) totalItemsEl.textContent = loadedData.length;

          const totalQtyEl = document.getElementById('importTotalQty');
          if (totalQtyEl) totalQtyEl.textContent = totalQty;
          
          const avgPriceEl = document.getElementById('importAvgPrice');
          if (avgPriceEl) avgPriceEl.textContent = (totalPrice / loadedData.length).toFixed(2);
          
          previewBox.style.display = 'block';
        } else {
          previewBox.style.display = 'none';
        }
      });

      // زر الاستيراج
      startBtn?.addEventListener('click', async (e) => {
        e.preventDefault();
        
        if (loadedData.length === 0) {
          alert('لا توجد بيانات للاستيراج');
          return;
        }

        startBtn.disabled = true;
        const progressDiv = document.getElementById('importProgress');
        const statusDiv = document.getElementById('importStatus');
        
        if (progressDiv) progressDiv.style.display = 'block';
        if (statusDiv) {
          statusDiv.style.display = 'block';
          statusDiv.style.background = '#2196f3';
          statusDiv.style.color = 'white';
          statusDiv.textContent = '⏳ جاري الاستيراج...';
        }

        let successful = 0;
        let failed = 0;

        for (let i = 0; i < loadedData.length; i++) {
          const tire = loadedData[i];

          try {
            const { error } = await self.supabase.from('tires').insert([tire]);

            if (error) {
              console.error(`خطأ في ${tire.brand} ${tire.size}:`, error);
              failed++;
            } else {
              successful++;
            }
          } catch (error) {
            console.error(`خطأ في ${tire.brand} ${tire.size}:`, error);
            failed++;
          }

          const progress = ((i + 1) / loadedData.length) * 100;
          const progressFill = document.getElementById('importProgressFill');
          const progressText = document.getElementById('importProgressText');
          
          if (progressFill) progressFill.style.width = progress + '%';
          if (progressText) progressText.textContent = `${i + 1}/${loadedData.length}`;
        }

        if (progressDiv) progressDiv.style.display = 'none';
        startBtn.disabled = false;

        if (statusDiv) {
          if (failed === 0) {
            statusDiv.style.background = '#4caf50';
            statusDiv.textContent = `✅ تم استيراج ${successful} إطار بنجاح!`;
            setTimeout(() => self.switchView('tires'), 1500);
          } else {
            statusDiv.style.background = '#f44336';
            statusDiv.textContent = `⚠️ تم استيراج ${successful} | فشل: ${failed}`;
          }
        }
      });

      // تعطيل الأزرار حتى يتم تحميل ملف
      if (previewBtn) previewBtn.disabled = true;
      if (startBtn) startBtn.disabled = true;

    }, 100);

    return `
      <div class="card">
        <div class="card-head">
          <h3>📦 استيراج الإطارات من Excel</h3>
        </div>

        <div style="background: #e3f2fd; border-left: 4px solid #2196f3; padding: 15px; border-radius: 5px; margin-bottom: 20px; color: #1976d2;">
          <strong>ℹ️ متطلبات الملف:</strong><br>
          الملف يجب أن يحتوي على الأعمدة: brand, size, stock, selling_price<br>
          الأعمدة الاختيارية: model, cost
        </div>

        <div style="margin-bottom: 20px; padding: 15px; background: #f5f5f5; border-radius: 5px;">
          <input type="file" id="importExcelFile" accept=".xlsx,.xls,.csv" style="display: none;">
          <button class="btn btn-amber" id="importUploadBtn" style="width: 100%; margin-bottom: 10px;">📁 اختر ملف Excel</button>
          <div id="importFileStatus" style="display: none; padding: 10px; border-radius: 3px; font-weight: bold; text-align: center;"></div>
        </div>

        <div class="grid-2" style="margin-bottom: 20px;">
          <div></div>
          <div style="display: flex; gap: 10px;">
            <button class="btn btn-ghost" id="importPreviewBtn" style="flex: 1;">👁️ معاينة</button>
            <button class="btn btn-amber" id="importStartBtn" style="flex: 1;">📥 استيراج</button>
          </div>
        </div>

        <div id="importProgress" style="display: none; margin: 20px 0;">
          <div style="background: #ddd; height: 8px; border-radius: 4px; overflow: hidden;">
            <div id="importProgressFill" style="height: 100%; background: linear-gradient(90deg, #f2a71b, #d6900f); width: 0%; transition: width 0.3s;"></div>
          </div>
          <div style="text-align: center; font-size: 12px; color: #666; margin-top: 5px;">
            <span id="importProgressText">0/0</span>
          </div>
        </div>

        <div id="importStatus" style="margin: 20px 0; padding: 15px; border-radius: 5px; display: none; font-weight: bold; text-align: center;">
        </div>

        <div id="importPreviewBox" style="display: none; background: #f5f5f5; border: 1px solid #ddd; border-radius: 5px; padding: 15px; max-height: 400px; overflow-y: auto; margin-top: 20px;">
          <div style="font-weight: bold; color: #333; margin-bottom: 10px;">📋 البيانات التي ستُضاف:</div>
          <div id="importTiresList"></div>
          <div style="background: #fff3cd; border-left: 4px solid #ffc107; padding: 15px; border-radius: 5px; margin-top: 15px;">
            <div style="display: flex; justify-content: space-between; padding: 5px 0; font-size: 14px;">
              <span>📊 إجمالي الإطارات:</span>
              <span style="font-weight: bold;" id="importTotalItems">0</span>
            </div>
            <div style="display: flex; justify-content: space-between; padding: 5px 0; font-size: 14px;">
              <span>📦 الكمية الإجمالية:</span>
              <span style="font-weight: bold;" id="importTotalQty">0</span>
            </div>
            <div style="display: flex; justify-content: space-between; padding: 5px 0; font-size: 14px;">
              <span>💵 متوسط السعر:</span>
              <span style="font-weight: bold;" id="importAvgPrice">0</span>
            </div>
          </div>
        </div>
      </div>
    `;
  }
}
