// الرمز الصغير: رمز الشركة الافتراضي، أو الشعار المرفوع إذا غيّره المدير

  return SHOP.logo && SHOP.logo !== DEFAULT_LOGO ? SHOP.logo : LOGO_MARK;
}

// ===== نوع الملف: 'manager' (ملف المدير) أو 'employee' (ملف الموظف employee.html) =====
const APP_MODE = 'manager';

// الصفحات المسموحة للموظف (المدير يرى كل شيء)
const EMPLOYEE_VIEWS = ['newSale', 'myHR', 'customers', 'appointments', 'tires', 'services', 'dailyExpenses'];
const SHOP_NAME = SHOP.name;
const SHOP_CR_NUMBER = SHOP.cr;

// طرق دفع الموردين
const SUPPLIER_PAY_METHODS = { cash: 'كاش', card: 'فيزا', transfer: 'تحويل' };
const PAY_TAG_RE = /\[طريقة الدفع: (كاش|فيزا|تحويل)\]\s*/;

function paymentMethodPicker(name, selected = 'cash') {
  const icons = { cash: '💵', card: '💳', transfer: '🏦' };
  return `
    <div class="pay-methods">
      ${Object.entries(SUPPLIER_PAY_METHODS).map(([k, label]) => `
        <label class="pay-method ${k === selected ? 'active' : ''}">
          <input type="radio" name="${name}" value="${k}" ${k === selected ? 'checked' : ''}>
          <span>${icons[k]} ${label}</span>
        </label>
      `).join('')}
    </div>
  `;
}

function readPaymentMethod(name) {
  return document.querySelector(`input[name="${name}"]:checked`)?.value || 'cash';
}

// طريقة الدفع لدفعة مورد (من العمود، أو من الملاحظات إن لم يوجد العمود)
function supplierPaymentMethod(pay) {
  if (pay.paymentMethod && SUPPLIER_PAY_METHODS[pay.paymentMethod]) return pay.paymentMethod;
  const m = PAY_TAG_RE.exec(pay.notes || '');
  if (m) return Object.keys(SUPPLIER_PAY_METHODS).find(k => SUPPLIER_PAY_METHODS[k] === m[1]) || null;
  return null;
}

// الخيارات الحالية: سنة، سنتين، 3 سنوات، 5 سنوات (3 و 6 أشهر للفواتير القديمة فقط)
// تاريخ محلي بصيغة YYYY-MM-DD (بدون تحويل للتوقيت العالمي)
function localDateStr(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

// أمر إنشاء جداول الموارد البشرية في Supabase
const HR_SETUP_SQL = "-- الموارد البشرية: الموظفون + الحضور والانصراف + الإجازات\ncreate table if not exists hr_employees (\n  id uuid primary key default gen_random_uuid(),\n  name text not null,\n  job_title text,\n  phone text,\n  annual_leave_days numeric default 30,\n  active boolean default true,\n  created_at timestamptz default now()\n);\n\ncreate table if not exists hr_attendance (\n  id uuid primary key default gen_random_uuid(),\n  employee_id uuid references hr_employees(id) on delete cascade,\n  work_date date not null,\n  check_in timestamptz,\n  check_out timestamptz,\n  notes text,\n  created_at timestamptz default now(),\n  unique (employee_id, work_date)\n);\n\ncreate table if not exists hr_leaves (\n  id uuid primary key default gen_random_uuid(),\n  employee_id uuid references hr_employees(id) on delete cascade,\n  start_date date not null,\n  end_date date not null,\n  days numeric not null default 0,\n  reason text,\n  status text not null default 'pending',\n  decided_at timestamptz,\n  created_at timestamptz default now()\n);\n\n-- نفس صلاحيات باقي جداول النظام (الوصول من الموقع)\nalter table hr_employees enable row level security;\nalter table hr_attendance enable row level security;\nalter table hr_leaves enable row level security;\ncreate policy \"app access\" on hr_employees for all using (true) with check (true);\ncreate policy \"app access\" on hr_attendance for all using (true) with check (true);\ncreate policy \"app access\" on hr_leaves for all using (true) with check (true);";

const WARRANTY_MONTHS = { warranty3M: 3, warranty6M: 6, warranty12M: 12, warranty24M: 24, warranty36M: 36, warranty60M: 60 };

// تاريخ انتهاء الضمان من تاريخ الفاتورة
function warrantyEndDate(fromIso, warranty) {
  const months = WARRANTY_MONTHS[warranty];
  if (!months) return null;
  const d = fromIso ? new Date(fromIso) : new Date();
  if (isNaN(d)) return null;
  d.setMonth(d.getMonth() + months);
  return d.toISOString();
}

function instagramHandle() {
  return String(SHOP.instagram || '').replace(/^@/, '').trim();
}

// قاموس ديناميكي: أسماء الخدمات بالإنجليزي من قاعدة البيانات + الاسم التجاري
let DYN_DICT = {};
let _trIndex = null;
const AR_CHAR = /[\u0600-\u06FF]/;

function isEn() {
  return currentLang === 'en';
}

function resetTranslations() {
  _trIndex = null;
}

function trIndex() {
  if (_trIndex) return _trIndex;
  const all = { ...SERVICE_GLOSSARY, ...UI_DICT, ...DYN_DICT };
  const map = new Map(Object.entries(all).map(([k, v]) => [k.trim(), v]));
  // العبارات القصيرة جداً (حرفان) تُترجم فقط إذا كانت النص كاملاً
  const keys = [...map.keys()].filter(k => k.replace(/\s/g, '').length > 2).sort((a, b) => b.length - a.length);
  const esc = k => k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = keys.length
    ? new RegExp('(?<![\\u0621-\\u064A])(' + keys.map(esc).join('|') + ')(?![\\u0621-\\u064A])', 'g')
    : null;
  _trIndex = { map, re };
  return _trIndex;
}

// ترجمة نص واحد (يحافظ على المسافات والرموز حوله)
function tr(str) {
  if (!isEn() || str == null) return str;
  str = String(str);
  if (!AR_CHAR.test(str)) return str;
  const { map, re } = trIndex();
  const lead = str.match(/^\s*/)[0], trail = str.match(/\s*$/)[0];
  const core = str.trim();
  if (map.has(core)) return lead + map.get(core) + trail;
  // تطابق كامل مع علامة في النهاية مثل "الاسم:" أو "السعر *"
  const m = core.match(/^(.*?)([\s:*؟?!.]+)$/);
  if (m && map.has(m[1].trim())) return lead + map.get(m[1].trim()) + m[2].replace('؟', '?') + trail;
  let out = re ? str.replace(re, k => map.get(k) ?? k) : str;
  return out.replace(/،/g, ',').replace(/؟/g, '?');
}

// ترجمة HTML كنص (للطباعة)
function trHtml(html) {
  if (!isEn()) return html;
  return html
    .replace(/<html lang="ar" dir="rtl">/, '<html lang="en" dir="ltr">')
    .replace(/>([^<]+)</g, (all, txt) => '>' + tr(txt) + '<');
}

const TR_ATTRS = ['placeholder', 'title', 'aria-label'];
function translateDom(root) {
  if (!isEn() || !root) return;
  if (root.nodeType === 3) {
    const v = tr(root.nodeValue);
    if (v !== root.nodeValue) root.nodeValue = v;
    return;
  }
  if (root.nodeType !== 1 || /^(SCRIPT|STYLE)$/.test(root.tagName)) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT, {
    acceptNode: n => {
      if (n.nodeType === 1 && /^(SCRIPT|STYLE)$/.test(n.tagName)) return NodeFilter.FILTER_REJECT;
      // لا نترجم ما يكتبه المستخدم داخل مربعات النص
      if (n.nodeType === 3 && n.parentNode && n.parentNode.tagName === 'TEXTAREA') return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  let n = root;
  do {
    if (n.nodeType === 3) {
      if (AR_CHAR.test(n.nodeValue)) {
        const v = tr(n.nodeValue);
        if (v !== n.nodeValue) n.nodeValue = v;
      }
    } else if (n.nodeType === 1) {
      TR_ATTRS.forEach(a => {
        const v = n.getAttribute(a);
        if (v && AR_CHAR.test(v)) n.setAttribute(a, tr(v));
      });
    }
  } while ((n = walker.nextNode()));
}

function applyLangDirection() {
  const root = document.documentElement;
  root.lang = isEn() ? 'en' : 'ar';
  root.dir = isEn() ? 'ltr' : 'rtl';
  const baseTitle = document.title.split(' | ')[0];
  document.title = isEn() ? tr(baseTitle) : baseTitle;
}

// مراقبة أي محتوى جديد يظهر على الشاشة وترجمته فوراً
(function setupAutoTranslate() {
  const start = () => {
    new MutationObserver(muts => {
      if (!isEn()) return;
      muts.forEach(m => m.addedNodes.forEach(node => translateDom(node)));
    }).observe(document.body, { childList: true, subtree: true });
  };
  if (document.body) start(); else document.addEventListener('DOMContentLoaded', start);
  ['confirm', 'alert', 'prompt'].forEach(fn => {
    const orig = window[fn].bind(window);
    window[fn] = (msg, ...rest) => orig(tr(msg), ...rest);
  });
})();

function uid() {

function esc(str) {
  const map = {
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#039;'
  };
  return String(str || '').replace(/[&<>"']/g, m => map[m]);
}

function fmtMoney(n) {
  return (Number(n) || 0).toFixed(2);
}

function fmtDate(iso) {
  if (!iso) return '-';
  try {
    return new Date(iso).toLocaleDateString(currentLang === 'en' ? 'en-GB' : 'ar-OM', {
      year: 'numeric',
      month: 'short',
      day: 'numeric'
    });
  } catch (e) {
    return '-';
  }
}

function showToast(msg, type = 'success') {
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `${icon(type === 'error' ? 'alert' : 'check')} <span>${esc(msg)}</span>`;
  wrap.appendChild(el);
  setTimeout(() => {
    el.style.opacity = '0';
    el.style.transition = 'opacity 0.3s';
    setTimeout(() => el.remove(), 300);
  }, 2600);
}

function hideModal() {
  document.getElementById('modalOverlay').classList.remove('active');
}

// =====================================================================

const FIELD_MAP = {
  tires: { 
    selling_price: 'sellingPrice', 
    cost: 'cost',
    supplier_id: 'supplierId'
  },
  services: {},
  customers: {},
  appointments: { customer_id: 'customerId', customer_name: 'customerName', service_name: 'serviceName', appointment_time: 'appointmentTime' },
  sales: {
    invoice_number: 'invoiceNumber',
    customer_id: 'customerId',
    customer_name: 'customerName',
    customer_phone: 'customerPhone',
    payment_method: 'paymentMethod',
    discount_amount: 'discountAmount',
    discount_percent: 'discountPercent',
    discount_total: 'discountTotal'
  },
  suppliers: {},
  supplier_invoices: {
    supplier_id: 'supplierId',
    invoice_number: 'invoiceNumber',
    total_amount: 'totalAmount',
    paid_amount: 'paidAmount',
    remaining_amount: 'remainingAmount',
    invoice_date: 'invoiceDate'
  },
  supplier_payments: {
    supplier_invoice_id: 'supplierInvoiceId',
    payment_amount: 'paymentAmount',
    payment_date: 'paymentDate',
    payment_method: 'paymentMethod'
  },
  expenses: {
    expense_type: 'expenseType',
    expense_date: 'expenseDate'
  },
};

function rowFromDb(row, table) {
  if (!row) return {};
  const map = FIELD_MAP[table] || {};
  const out = { ...row };
  
  Object.entries(map).forEach(([snake, camel]) => {
    // الاسم نفسه في الطرفين (مثل cost): لا نحذفه
    if (snake === camel) return;
    if (snake in out) {
      out[camel] = out[snake];
      delete out[snake];
    }
  });
  
  out.createdAt = row.created_at;
  delete out.created_at;
  return out;
}

function rowToDb(obj, table) {
  if (!obj) return {};
  const map = FIELD_MAP[table] || {};
  const out = { ...obj };
  
  Object.entries(map).forEach(([snake, camel]) => {
    if (snake === camel) return;
    if (camel in out) {
      out[snake] = out[camel];
      delete out[camel];
    }
  });
  
  delete out.id;
  delete out.createdAt;
  delete out.created_at;
  
  // Log data for debugging
  if (table === 'customers') {
    console.log(`🔍 Customers rowToDb:`, out);
  }
  
  return out;
}

class TireShopApp {
  constructor() {

    this.currentUser = null;

    this.isLoading = false; // علم لمنع تحميل متزامن متعدد
    
    // Database collections
    this.tires = [];
    this.services = [];
    this.customers = [];
    this.appointments = [];
    this.sales = [];
    this.suppliers = [];
    this.supplierInvoices = [];
    this.supplierPayments = [];
    this.expenses = [];
    
    // Sale wizard state
    this.saleWizard = this.emptySaleWizard();
    
    // Sales period filter
    this.currentSalesPeriod = 'today';
    this.currentCustomFromDate = null;
    this.currentCustomToDate = null;
    
    this.init();
  }

  async init() {
    applyLangDirection();
    try {
      const saved = sessionStorage.getItem('tireshop_user');
      if (saved) {
        const user = JSON.parse(saved);
        // جلسة المدير لا تُفتح في ملف الموظف والعكس
        if (user && user.role === APP_MODE) {
          this.currentUser = user;
          this.currentView = this.homeView();
        } else {
          sessionStorage.removeItem('tireshop_user');
        }
      }
    } catch (e) {
      console.error('Session load failed:', e);
    }

    try {
      if (window.supabase) {
        this.sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        console.log('✅ Supabase initialized');
      }
    } catch (e) {
      console.error('❌ Supabase init error:', e);
      this.sb = null;
    }

    if (this.currentUser) {
      await this.loadAllData();
    }

    this.render();
  }

  // ===== الصلاحيات =====
  isManager() {
    return this.currentUser?.role === 'manager';
  }

  canView(view) {
    // صفحات محذوفة من النظام
    if (view === 'importInventory') return false;
    return this.isManager() || EMPLOYEE_VIEWS.includes(view);
  }

  // صفحة معالج البيع: المدير داخل صفحة الفواتير، والموظف في صفحة "عملية بيع جديدة"
  saleView() {
    return this.isManager() ? 'sales' : 'newSale';
  }

  // الخصم للمدير فقط
  canDiscount() {
    return this.isManager();
  }

  homeView() {
    return this.isManager() ? 'dashboard' : EMPLOYEE_VIEWS[0];
  }

  // =====================================================================
  // الموارد البشرية: الموظفون + الحضور والانصراف + الإجازات السنوية
  // الجداول: hr_employees, hr_attendance, hr_leaves
  // =====================================================================

  async loadHR() {
    this.hrEmployees = this.hrEmployees || [];
    this.hrAttendance = this.hrAttendance || [];
    this.hrLeaves = this.hrLeaves || [];
    this.hrMissing = false;
    if (!this.sb) return;
    const tables = { hr_employees: 'hrEmployees', hr_attendance: 'hrAttendance', hr_leaves: 'hrLeaves' };
    const res = await Promise.all(Object.keys(tables).map(tb => this.sb.from(tb).select('*')));
    Object.keys(tables).forEach((tb, i) => {
      const { data, error } = res[i];
      if (error) {
        console.warn(`⚠️ جدول ${tb} غير متاح:`, error.message);
        this.hrMissing = true;
        return;
      }
      this[tables[tb]] = data || [];
    });
  }

  // كتابة مباشرة على جداول الموارد البشرية ثم إعادة تحميلها فقط
  async hrWrite(table, op, data, id) {
    if (!this.sb) {
      showToast('قاعدة البيانات غير متاحة', 'error');
      return false;
    }
    let q = this.sb.from(table);
    q = op === 'insert' ? q.insert([data]) : op === 'update' ? q.update(data).eq('id', id) : q.delete().eq('id', id);
    const { error } = await q;
    if (error) {
      console.error(`HR ${op} ${table}:`, error);
      const missing = /schema cache|does not exist/.test(error.message || '');
      const dup = error.code === '23505';
      showToast(missing ? 'جداول الموارد البشرية غير موجودة بعد في Supabase'
        : dup ? 'هذا السجل موجود مسبقاً (تم تسجيل حضور هذا اليوم)'
        : 'تعذّر الحفظ: ' + (error.message || ''), 'error');
      return false;
    }
    await this.loadHR();
    return true;
  }

  hrToday() {
    return localDateStr(new Date());
  }

  hrActiveEmployees() {
    return (this.hrEmployees || []).filter(e => e.active !== false).sort((a, b) => String(a.name).localeCompare(String(b.name), 'ar'));
  }

  hrEmpName(id) {
    return (this.hrEmployees || []).find(e => e.id === id)?.name || '—';
  }

  hrRecord(empId, date) {
    return (this.hrAttendance || []).find(a => a.employee_id === empId && a.work_date === date);
  }

  hrHours(rec) {
    if (!rec || !rec.check_in || !rec.check_out) return null;
    const h = (new Date(rec.check_out) - new Date(rec.check_in)) / 3600000;
    return h > 0 ? h : null;
  }

  fmtHours(h) {
    if (h == null) return '—';
    const hh = Math.floor(h), mm = Math.round((h - hh) * 60);
    return `${hh}:${String(mm).padStart(2, '0')}`;
  }

  fmtTime(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return isNaN(d) ? '—' : d.toLocaleTimeString(currentLang === 'en' ? 'en-GB' : 'ar-OM', { hour: '2-digit', minute: '2-digit' });
  }

  // أيام الإجازة: من تاريخ إلى تاريخ شاملة، بدون أيام الجمعة
  leaveDays(start, end) {
    if (!start || !end) return 0;
    const a = new Date(start + 'T00:00:00'), b = new Date(end + 'T00:00:00');
    if (isNaN(a) || isNaN(b) || b < a) return 0;
    let n = 0;
    for (let d = new Date(a); d <= b; d.setDate(d.getDate() + 1)) {
      if (d.getDay() !== 5) n++;
    }
    return n;
  }

  // رصيد الإجازات للسنة الحالية
  leaveBalance(emp) {
    const year = String(new Date().getFullYear());
    const mine = (this.hrLeaves || []).filter(l => l.employee_id === emp.id && String(l.start_date || '').startsWith(year));
    const sum = st => mine.filter(l => l.status === st).reduce((s, l) => s + (parseFloat(l.days) || 0), 0);
    const entitled = parseFloat(emp.annual_leave_days ?? 30) || 0;
    const used = sum('approved');
    const pending = sum('pending');
    return { entitled, used, pending, remaining: entitled - used };
  }

  // هل الموظف في إجازة معتمدة في هذا التاريخ؟
  onLeave(empId, date) {
    return (this.hrLeaves || []).some(l => l.employee_id === empId && l.status === 'approved' && l.start_date <= date && l.end_date >= date);
  }

  leaveOverlaps(empId, start, end, exceptId) {
    return (this.hrLeaves || []).some(l => l.id !== exceptId && l.employee_id === empId && l.status !== 'rejected' && l.start_date <= end && l.end_date >= start);
  }

  leaveStatusBadge(st) {
    return {
      pending: '<span class="badge badge-warning">⏳ بانتظار الموافقة</span>',
      approved: '<span class="badge badge-success">✅ معتمدة</span>',
      rejected: '<span class="badge badge-danger">❌ مرفوضة</span>',
    }[st] || '';
  }

  hrSetupNotice() {
    if (!this.isManager()) {
      return '<div class="card"><p class="text-center" style="padding: 30px;">قسم الحضور والإجازات غير مفعّل بعد. اطلب من المدير تفعيله.</p></div>';
    }
    return `
      <div class="card">
        <div class="card-head"><h3>⚙️ تفعيل قسم الموارد البشرية</h3></div>
        <p style="margin-bottom: 12px;">هذا القسم يحتاج ثلاثة جداول جديدة في Supabase. افتح <b>SQL Editor</b> في Supabase والصق الأمر التالي ثم اضغط <b>Run</b>، وبعدها أعد تحميل الصفحة.</p>
        <pre class="sql-box" dir="ltr">${esc(HR_SETUP_SQL)}</pre>
        <button class="btn btn-ghost btn-sm" id="copyHrSqlBtn">📋 نسخ الأمر</button>
      </div>
    `;
  }

  hrModal(title, body, onSave, saveLabel = 'حفظ') {
    const overlay = document.getElementById('modalOverlay');
    const box = document.getElementById('modalBox');
    box.innerHTML = `
      <div class="modal-head">
        <h3>${title}</h3>
        <button class="modal-close" id="hrModalClose">✕</button>
      </div>
      <div>${body}</div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="hrModalCancel">إلغاء</button>
        <button class="btn btn-amber" id="hrModalSave">${saveLabel}</button>
      </div>
    `;
    overlay.classList.add('active');
    const close = () => overlay.classList.remove('active');
    document.getElementById('hrModalClose').onclick = close;
    document.getElementById('hrModalCancel').onclick = close;
    const saveBtn = document.getElementById('hrModalSave');
    saveBtn.onclick = async () => {
      saveBtn.disabled = true;
      const ok = await onSave();
      if (ok) close(); else saveBtn.disabled = false;
    };
  }

  // ---------------------------------------------------------------------
  // صفحة المدير
  // ---------------------------------------------------------------------
  renderHRView() {
    if (this.hrMissing) return this.hrSetupNotice();
    const tab = this.hrTab || 'attendance';
    const pendingCount = (this.hrLeaves || []).filter(l => l.status === 'pending').length;
    const body = tab === 'leaves' ? this.renderHRLeaves() : tab === 'employees' ? this.renderHREmployees() : this.renderHRAttendance();
    return `
      <div class="seg hr-tabs">
        <button class="${tab === 'attendance' ? 'active' : ''}" data-hr-tab="attendance">🕘 الحضور والانصراف</button>
        <button class="${tab === 'leaves' ? 'active' : ''}" data-hr-tab="leaves">🌴 الإجازات ${pendingCount ? `<span class="hr-count">${pendingCount}</span>` : ''}</button>
        <button class="${tab === 'employees' ? 'active' : ''}" data-hr-tab="employees">👥 الموظفون</button>
      </div>
      ${body}
    `;
  }

  renderHRAttendance() {
    const date = this.hrDate || this.hrToday();
    const emps = this.hrActiveEmployees();
    const month = this.hrMonth || this.hrToday().slice(0, 7);

    const rows = emps.map(e => {
      const r = this.hrRecord(e.id, date);
      const leave = this.onLeave(e.id, date);
      const status = r?.check_out ? '<span class="badge badge-info">غادر</span>'
        : r?.check_in ? '<span class="badge badge-success">حاضر</span>'
        : leave ? '<span class="badge badge-warning">🌴 في إجازة</span>'
        : '<span class="badge badge-danger">لم يسجّل</span>';
      return `
        <tr>
          <td style="font-weight: 700;">${esc(e.name)}</td>
          <td>${status}</td>
          <td class="num">${this.fmtTime(r?.check_in)}</td>
          <td class="num">${this.fmtTime(r?.check_out)}</td>
          <td class="num">${this.fmtHours(this.hrHours(r))}</td>
          <td>${esc(r?.notes || '')}</td>
          <td><button class="btn btn-xs btn-blue" data-hr-edit-att="${e.id}">✏️ تعديل</button></td>
        </tr>`;
    }).join('');

    // ملخص الشهر
    const summary = emps.map(e => {
      const recs = (this.hrAttendance || []).filter(a => a.employee_id === e.id && String(a.work_date).startsWith(month));
      const days = recs.filter(a => a.check_in).length;
      const hours = recs.reduce((s, a) => s + (this.hrHours(a) || 0), 0);
      const openDays = recs.filter(a => a.check_in && !a.check_out).length;
      return `
        <tr>
          <td style="font-weight: 700;">${esc(e.name)}</td>
          <td class="num">${days}</td>
          <td class="num">${this.fmtHours(hours)}</td>
          <td class="num">${days ? this.fmtHours(hours / Math.max(1, days - openDays)) : '—'}</td>
          <td class="num">${openDays ? `<span style="color: var(--brake-red);">${openDays}</span>` : '0'}</td>
        </tr>`;
    }).join('');

    return `
      <div class="card">
        <div class="card-head rep-head">
          <h3>🕘 حضور يوم</h3>
          <input type="date" id="hrDateInput" value="${date}" class="hr-date">
        </div>
        ${emps.length ? `
        <div class="table-wrap">
          <table>
            <thead><tr><th>الموظف</th><th>الحالة</th><th>الحضور</th><th>الانصراف</th><th>ساعات العمل</th><th>ملاحظات</th><th></th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>` : '<p class="text-center" style="padding: 24px;">لا يوجد موظفون. أضفهم من تبويب "الموظفون".</p>'}
      </div>

      ${emps.length ? `
      <div class="card">
        <div class="card-head rep-head">
          <h3>📅 ملخص الشهر</h3>
          <input type="month" id="hrMonthInput" value="${month}" class="hr-date">
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>الموظف</th><th>أيام الحضور</th><th>مجموع الساعات</th><th>متوسط اليوم</th><th>أيام بدون انصراف</th></tr></thead>
            <tbody>${summary}</tbody>
          </table>
        </div>
      </div>` : ''}
    `;
  }

    const others = leaves.filter(l => l.status !== 'pending');

    const card = l => {
      const emp = (this.hrEmployees || []).find(e => e.id === l.employee_id);

            ${l.reason ? `<div class="text-xs">السبب: ${esc(l.reason)}</div>` : ''}
            ${bal ? `<div class="text-xs" style="${over ? 'color: var(--brake-red); font-weight: 700;' : ''}">الرصيد المتبقي: <span class="num">${+bal.remaining.toFixed(1)}</span> يوم${over ? ' — الطلب أكبر من الرصيد' : ''}</div>` : ''}
          </div>

          <button class="btn btn-amber btn-block" id="hrAddLeaveBtn">➕ تسجيل كإجازة معتمدة</button>
          ` : '<p class="text-center" style="padding: 20px;">أضف الموظفين أولاً.</p>'}
        </div>

        <div>
          <div class="card">
            <div class="card-head"><h3>⏳ طلبات بانتظار الموافقة (${pending.length})</h3></div>
            ${pending.map(card).join('') || '<p class="text-center" style="padding: 16px; color: var(--text-muted);">لا توجد طلبات جديدة</p>'}
          </div>

          <div class="card">
            <div class="card-head"><h3>📋 سجل الإجازات</h3></div>
            <div class="table-wrap">
              <table>
                <thead><tr><th>الموظف</th><th>من</th><th>إلى</th><th>الأيام</th><th>الحالة</th><th></th></tr></thead>
                <tbody>
                  ${others.map(l => `
                    <tr>
                      <td>${esc(this.hrEmpName(l.employee_id))}</td>
                      <td class="num">${fmtDate(l.start_date)}</td>
                      <td class="num">${fmtDate(l.end_date)}</td>
                      <td class="num">${l.days}</td>
                      <td>${this.leaveStatusBadge(l.status)}</td>
                      <td><button class="btn btn-xs btn-danger" data-hr-del-leave="${l.id}">🗑️</button></td>
                    </tr>`).join('') || '<tr><td colspan="6" class="text-center">لا توجد إجازات</td></tr>'}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  renderHREmployees() {
    const all = [...(this.hrEmployees || [])].sort((a, b) => (b.active !== false) - (a.active !== false) || String(a.name).localeCompare(String(b.name), 'ar'));
    return `
      <div class="grid-2 inv-grid">
        <div class="card">
          <div class="card-head"><h3>➕ إضافة موظف</h3></div>
          <div class="form-group"><label>الاسم *</label><input type="text" id="hrEmpName"></div>
          <div class="form-group"><label>المسمى الوظيفي</label><input type="text" id="hrEmpTitle" placeholder="مثال: فني إطارات"></div>

        <div class="card">
          <div class="card-head"><h3>👥 الموظفون (${all.length})</h3></div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>الاسم</th><th>المسمى</th><th>الهاتف</th><th>رصيد الإجازة</th><th>المستخدم</th><th>المتبقي</th><th>الحالة</th><th></th></tr></thead>
              <tbody>
                ${all.map(e => {
                  const b = this.leaveBalance(e);
                  const active = e.active !== false;
                  return `
                  <tr style="${active ? '' : 'opacity: 0.55;'}">
                    <td style="font-weight: 700;">${esc(e.name)}</td>
                    <td>${esc(e.job_title || '—')}</td>
                    <td class="num" dir="ltr">${esc(e.phone || '—')}</td>
                    <td class="num">${b.entitled}</td>
                    <td class="num">${+b.used.toFixed(1)}${b.pending ? ` <span class="text-xs">(+${b.pending} معلّق)</span>` : ''}</td>
                    <td class="num" style="font-weight: 800; color: ${b.remaining < 0 ? 'var(--brake-red)' : 'var(--tread-green)'};">${+b.remaining.toFixed(1)}</td>
                    <td>${active ? '<span class="badge badge-success">نشط</span>' : '<span class="badge">موقوف</span>'}</td>
                    <td><div class="action-cell">
                      <button class="btn btn-xs btn-blue" data-hr-edit-emp="${e.id}">✏️</button>
                      <button class="btn btn-xs btn-ghost" data-hr-toggle-emp="${e.id}" title="${active ? 'إيقاف' : 'تفعيل'}">${active ? '⏸️' : '▶️'}</button>
                    </div></td>
                  </tr>`;
                }).join('') || '<tr><td colspan="8" class="text-center">لا يوجد موظفون بعد</td></tr>'}
              </tbody>
            </table>
          </div>
          <p class="text-xs" style="margin-top: 10px;">الرصيد يُحسب للسنة الحالية. أيام الجمعة لا تُحتسب من الإجازة. الموظف الموقوف يبقى سجلّه محفوظاً لكنه لا يظهر في الحضور.</p>
        </div>
      </div>
    `;
  }

  bindHREvents() {
    document.getElementById('copyHrSqlBtn')?.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(HR_SETUP_SQL); showToast('تم نسخ الأمر', 'success'); }
      catch (e) { prompt('انسخ الأمر:', HR_SETUP_SQL); }
    });
    if (this.hrMissing) return;
    const root = document.getElementById('content');
    const rerender = () => this.switchView('hr');

    root.querySelectorAll('[data-hr-tab]').forEach(b => b.addEventListener('click', () => { this.hrTab = b.dataset.hrTab; rerender(); }));
    document.getElementById('hrDateInput')?.addEventListener('change', e => { this.hrDate = e.target.value || this.hrToday(); rerender(); });
    document.getElementById('hrMonthInput')?.addEventListener('change', e => { this.hrMonth = e.target.value || this.hrToday().slice(0, 7); rerender(); });

    // تعديل حضور يوم
    root.querySelectorAll('[data-hr-edit-att]').forEach(b => b.addEventListener('click', () => {
      const empId = b.dataset.hrEditAtt;
      const date = this.hrDate || this.hrToday();
      const r = this.hrRecord(empId, date);
      const hm = iso => { if (!iso) return ''; const d = new Date(iso); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
      this.hrModal(`تعديل حضور: ${esc(this.hrEmpName(empId))} — ${fmtDate(date)}`, `
        <div class="form-row">
          <div class="form-group"><label>وقت الحضور</label><input type="time" id="hrEditIn" value="${hm(r?.check_in)}"></div>
          <div class="form-group"><label>وقت الانصراف</label><input type="time" id="hrEditOut" value="${hm(r?.check_out)}"></div>
        </div>
        <div class="form-group"><label>ملاحظات</label><input type="text" id="hrEditNotes" value="${esc(r?.notes || '')}"></div>
        ${r ? '<label class="text-xs"><input type="checkbox" id="hrEditDelete"> حذف سجل هذا اليوم</label>' : ''}
      `, async () => {
        if (document.getElementById('hrEditDelete')?.checked) return this.hrWrite('hr_attendance', 'delete', null, r.id).then(ok => { if (ok) rerender(); return ok; });
        const tIn = document.getElementById('hrEditIn').value, tOut = document.getElementById('hrEditOut').value;
        if (!tIn) { showToast('أدخل وقت الحضور', 'error'); return false; }
        const toIso = t => t ? new Date(`${date}T${t}:00`).toISOString() : null;
        if (tOut && tOut <= tIn) { showToast('وقت الانصراف يجب أن يكون بعد الحضور', 'error'); return false; }
        const data = { employee_id: empId, work_date: date, check_in: toIso(tIn), check_out: toIso(tOut), notes: document.getElementById('hrEditNotes').value.trim() || null };
        const ok = r ? await this.hrWrite('hr_attendance', 'update', data, r.id) : await this.hrWrite('hr_attendance', 'insert', data);
        if (ok) { showToast('تم الحفظ', 'success'); rerender(); }
        return ok;
      });
    }));

    // الإجازات
    const fromI = document.getElementById('hrLeaveFrom'), toI = document.getElementById('hrLeaveTo');
    const hint = () => {
      const h = document.getElementById('hrLeaveDaysHint');
      if (!h) return;
      const n = this.leaveDays(fromI.value, toI.value);
      const emp = this.hrEmployees.find(e => e.id === document.getElementById('hrLeaveEmp').value);
      const bal = emp ? this.leaveBalance(emp) : null;
      h.textContent = n ? `${n} يوم (بدون الجمع)${bal ? ` — الرصيد المتبقي ${+bal.remaining.toFixed(1)} يوم` : ''}` : '';
    };
    [fromI, toI, document.getElementById('hrLeaveEmp')].forEach(el => el?.addEventListener('change', hint));
    document.getElementById('hrAddLeaveBtn')?.addEventListener('click', async () => {
      const empId = document.getElementById('hrLeaveEmp').value;
      const start = fromI.value, end = toI.value;
      const days = this.leaveDays(start, end);
      if (!start || !end || !days) { showToast('اختر تاريخ البداية والنهاية بشكل صحيح', 'error'); return; }
      if (this.leaveOverlaps(empId, start, end)) { showToast('توجد إجازة أخرى في نفس الفترة', 'error'); return; }
      const ok = await this.hrWrite('hr_leaves', 'insert', { employee_id: empId, start_date: start, end_date: end, days, reason: document.getElementById('hrLeaveReason').value.trim() || null, status: 'approved', decided_at: new Date().toISOString() });
      if (ok) { showToast('تم تسجيل الإجازة', 'success'); rerender(); }
    });
    const decide = async (id, status) => {
      const ok = await this.hrWrite('hr_leaves', 'update', { status, decided_at: new Date().toISOString() }, id);
      if (ok) { showToast(status === 'approved' ? 'تمت الموافقة على الإجازة' : 'تم رفض الطلب', 'success'); rerender(); }
    };
    root.querySelectorAll('[data-hr-approve]').forEach(b => b.addEventListener('click', () => decide(b.dataset.hrApprove, 'approved')));
    root.querySelectorAll('[data-hr-reject]').forEach(b => b.addEventListener('click', () => { if (confirm('رفض طلب الإجازة؟')) decide(b.dataset.hrReject, 'rejected'); }));
    root.querySelectorAll('[data-hr-del-leave]').forEach(b => b.addEventListener('click', async () => {
      if (!confirm('حذف هذه الإجازة من السجل؟')) return;
      if (await this.hrWrite('hr_leaves', 'delete', null, b.dataset.hrDelLeave)) { showToast('تم الحذف', 'success'); rerender(); }
    }));

    // الموظفون
    document.getElementById('hrAddEmpBtn')?.addEventListener('click', async () => {
      const name = document.getElementById('hrEmpName').value.trim();
      if (!name) { showToast('أدخل اسم الموظف', 'error'); return; }
      const ok = await this.hrWrite('hr_employees', 'insert', {
        name,
        job_title: document.getElementById('hrEmpTitle').value.trim() || null,
        phone: document.getElementById('hrEmpPhone').value.trim() || null,
        annual_leave_days: parseFloat(document.getElementById('hrEmpLeave').value) || 0,
        active: true,
      });
      if (ok) { showToast('تمت إضافة الموظف', 'success'); rerender(); }
    });
    root.querySelectorAll('[data-hr-toggle-emp]').forEach(b => b.addEventListener('click', async () => {
      const e = this.hrEmployees.find(x => x.id === b.dataset.hrToggleEmp);
      if (!e) return;
      const active = e.active !== false;
      if (active && !confirm(`إيقاف ${e.name}؟ سيبقى سجلّه محفوظاً.`)) return;
      if (await this.hrWrite('hr_employees', 'update', { active: !active }, e.id)) rerender();
    }));
    root.querySelectorAll('[data-hr-edit-emp]').forEach(b => b.addEventListener('click', () => {
      const e = this.hrEmployees.find(x => x.id === b.dataset.hrEditEmp);
      if (!e) return;
      this.hrModal(`تعديل: ${esc(e.name)}`, `
        <div class="form-group"><label>الاسم *</label><input type="text" id="hrEdName" value="${esc(e.name)}"></div>
        <div class="form-group"><label>المسمى الوظيفي</label><input type="text" id="hrEdTitle" value="${esc(e.job_title || '')}"></div>
        <div class="form-group"><label>رقم الهاتف</label><input type="tel" id="hrEdPhone" value="${esc(e.phone || '')}"></div>
        <div class="form-group"><label>رصيد الإجازة السنوية (يوم)</label><input type="number" id="hrEdLeave" min="0" value="${parseFloat(e.annual_leave_days ?? 30) || 0}"></div>
      `, async () => {
        const name = document.getElementById('hrEdName').value.trim();
        if (!name) { showToast('أدخل اسم الموظف', 'error'); return false; }
        const ok = await this.hrWrite('hr_employees', 'update', {
          name,
          job_title: document.getElementById('hrEdTitle').value.trim() || null,
          phone: document.getElementById('hrEdPhone').value.trim() || null,
          annual_leave_days: parseFloat(document.getElementById('hrEdLeave').value) || 0,
        }, e.id);
        if (ok) { showToast('تم التحديث', 'success'); rerender(); }
        return ok;
      });
    }));
  }

  // ---------------------------------------------------------------------
  // صفحة الموظف: تسجيل الحضور + طلب إجازة
  // ---------------------------------------------------------------------
  hrMe() {
    let id = null;
    try { id = localStorage.getItem('tireshop_hr_me'); } catch (e) {}
    return this.hrActiveEmployees().find(e => e.id === id) || null;
  }

  renderMyHRView() {
    if (this.hrMissing) return this.hrSetupNotice();
    const emps = this.hrActiveEmployees();
    if (!emps.length) {
      return '<div class="card"><p class="text-center" style="padding: 30px;">لم يُضف المدير أي موظف بعد.</p></div>';
    }
    const me = this.hrMe();
    const picker = `
      <div class="card hr-me">
        <label style="font-weight: 700;">👤 أنا:</label>
        <select id="hrMeSelect">
          <option value="">— اختر اسمك —</option>
          ${emps.map(e => `<option value="${e.id}" ${me && me.id === e.id ? 'selected' : ''}>${esc(e.name)}</option>`).join('')}
        </select>
      </div>`;
    if (!me) return picker;

    const today = this.hrToday();
    const rec = this.hrRecord(me.id, today);
    const bal = this.leaveBalance(me);
    const loc = currentLang === 'en' ? 'en-GB' : 'ar-OM';
    const recent = (this.hrAttendance || []).filter(a => a.employee_id === me.id).sort((a, b) => String(b.work_date).localeCompare(String(a.work_date))).slice(0, 7);
    const myLeaves = (this.hrLeaves || []).filter(l => l.employee_id === me.id).sort((a, b) => String(b.start_date).localeCompare(String(a.start_date)));

    let action;
    if (!rec?.check_in) action = `<button class="btn btn-green hr-big" id="hrCheckInBtn">✅ تسجيل حضور</button>`;
    else if (!rec.check_out) action = `<button class="btn btn-danger hr-big" id="hrCheckOutBtn">🚪 تسجيل انصراف</button>`;
    else action = `<div class="hr-done">✔️ أنهيت دوام اليوم — <span class="num">${this.fmtHours(this.hrHours(rec))}</span> ساعة</div>`;

    return `
      ${picker}
      <div class="grid-2">
        <div class="card hr-clock-card">
          <div class="hr-clock num" id="hrClock">${new Date().toLocaleTimeString(loc, { hour: '2-digit', minute: '2-digit' })}</div>
          <div class="text-xs">${new Date().toLocaleDateString(loc, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}</div>
          <div class="hr-times">
            <div><span>الحضور</span><b class="num">${this.fmtTime(rec?.check_in)}</b></div>
            <div><span>الانصراف</span><b class="num">${this.fmtTime(rec?.check_out)}</b></div>
          </div>
          ${this.onLeave(me.id, today) ? '<div class="text-xs" style="color: var(--amber-600); font-weight: 700;">🌴 لديك إجازة معتمدة اليوم</div>' : ''}
          ${action}
        </div>

        <div class="card">
          <div class="card-head"><h3>🌴 رصيد الإجازة السنوية</h3></div>
          <div class="hr-bal">
            <div><span>الرصيد</span><b class="num">${bal.entitled}</b></div>
            <div><span>المستخدم</span><b class="num">${+bal.used.toFixed(1)}</b></div>
            <div><span>بانتظار الموافقة</span><b class="num">${+bal.pending.toFixed(1)}</b></div>
            <div class="hl"><span>المتبقي</span><b class="num">${+bal.remaining.toFixed(1)}</b></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>من *</label><input type="date" id="myLeaveFrom" min="${today}"></div>
            <div class="form-group"><label>إلى *</label><input type="date" id="myLeaveTo" min="${today}"></div>
          </div>
          <div class="text-xs" id="myLeaveHint" style="margin-bottom: 10px;"></div>
          <div class="form-group"><label>السبب</label><input type="text" id="myLeaveReason" placeholder="اختياري"></div>
          <button class="btn btn-amber btn-block" id="myLeaveBtn">📨 إرسال طلب إجازة</button>
        </div>
      </div>

      <div class="grid-2">
        <div class="card">
          <div class="card-head"><h3>🕘 آخر أيام الدوام</h3></div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>اليوم</th><th>الحضور</th><th>الانصراف</th><th>الساعات</th></tr></thead>
              <tbody>
                ${recent.map(a => `<tr><td class="num">${fmtDate(a.work_date)}</td><td class="num">${this.fmtTime(a.check_in)}</td><td class="num">${this.fmtTime(a.check_out)}</td><td class="num">${this.fmtHours(this.hrHours(a))}</td></tr>`).join('') || '<tr><td colspan="4" class="text-center">لا يوجد سجل بعد</td></tr>'}
              </tbody>
            </table>
          </div>
        </div>
        <div class="card">
          <div class="card-head"><h3>📋 طلبات إجازتي</h3></div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>من</th><th>إلى</th><th>الأيام</th><th>الحالة</th><th></th></tr></thead>
              <tbody>
                ${myLeaves.map(l => `
                  <tr>
                    <td class="num">${fmtDate(l.start_date)}</td>
                    <td class="num">${fmtDate(l.end_date)}</td>
                    <td class="num">${l.days}</td>
                    <td>${this.leaveStatusBadge(l.status)}</td>
                    <td>${l.status === 'pending' ? `<button class="btn btn-xs btn-ghost" data-my-cancel-leave="${l.id}">إلغاء</button>` : ''}</td>
                  </tr>`).join('') || '<tr><td colspan="5" class="text-center">لا توجد طلبات</td></tr>'}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    `;
  }

  bindMyHREvents() {
    const rerender = () => this.switchView('myHR');
    document.getElementById('hrMeSelect')?.addEventListener('change', e => {
      try { localStorage.setItem('tireshop_hr_me', e.target.value); } catch (err) {}
      rerender();
    });
    const me = this.hrMe();
    if (!me) return;

    clearInterval(this.hrClockTimer);
    this.hrClockTimer = setInterval(() => {
      const el = document.getElementById('hrClock');
      if (!el) { clearInterval(this.hrClockTimer); return; }
      el.textContent = new Date().toLocaleTimeString(currentLang === 'en' ? 'en-GB' : 'ar-OM', { hour: '2-digit', minute: '2-digit' });
    }, 15000);

    document.getElementById('hrCheckInBtn')?.addEventListener('click', async (e) => {
      e.currentTarget.disabled = true;
      await this.loadHR(); // تأكد من آخر حالة قبل التسجيل
      const today = this.hrToday();
      if (this.hrRecord(me.id, today)?.check_in) { showToast('سجّلت حضورك اليوم مسبقاً', 'warning'); rerender(); return; }
      const ok = await this.hrWrite('hr_attendance', 'insert', { employee_id: me.id, work_date: today, check_in: new Date().toISOString() });
      if (ok) showToast(`تم تسجيل حضورك ${this.fmtTime(new Date().toISOString())}`, 'success');
      rerender();
    });
    document.getElementById('hrCheckOutBtn')?.addEventListener('click', async (e) => {
      if (!confirm('تسجيل الانصراف الآن؟')) return;
      e.currentTarget.disabled = true;
      const rec = this.hrRecord(me.id, this.hrToday());
      if (!rec) { rerender(); return; }
      const ok = await this.hrWrite('hr_attendance', 'update', { check_out: new Date().toISOString() }, rec.id);
      if (ok) showToast(`تم تسجيل انصرافك ${this.fmtTime(new Date().toISOString())}`, 'success');
      rerender();
    });

    const fromI = document.getElementById('myLeaveFrom'), toI = document.getElementById('myLeaveTo');
    const hint = () => {
      const n = this.leaveDays(fromI.value, toI.value);
      document.getElementById('myLeaveHint').textContent = n ? `${n} يوم (بدون الجمع)` : '';
    };
    fromI?.addEventListener('change', () => { if (toI.value < fromI.value) toI.value = fromI.value; toI.min = fromI.value; hint(); });
    toI?.addEventListener('change', hint);
    document.getElementById('myLeaveBtn')?.addEventListener('click', async (e) => {
      const start = fromI.value, end = toI.value;
      const days = this.leaveDays(start, end);
      if (!start || !end || !days) { showToast('اختر تاريخ البداية والنهاية بشكل صحيح', 'error'); return; }
      if (start < this.hrToday()) { showToast('لا يمكن طلب إجازة بتاريخ سابق', 'error'); return; }
      if (this.leaveOverlaps(me.id, start, end)) { showToast('لديك طلب آخر في نفس الفترة', 'error'); return; }
      const bal = this.leaveBalance(me);
      if (days > bal.remaining - bal.pending) { showToast(`الطلب (${days} يوم) أكبر من رصيدك المتاح (${+(bal.remaining - bal.pending).toFixed(1)} يوم)`, 'error'); return; }
      e.currentTarget.disabled = true;
      const ok = await this.hrWrite('hr_leaves', 'insert', { employee_id: me.id, start_date: start, end_date: end, days, reason: document.getElementById('myLeaveReason').value.trim() || null, status: 'pending' });
      if (ok) showToast('تم إرسال طلب الإجازة للمدير', 'success');
      rerender();
    });
    document.querySelectorAll('[data-my-cancel-leave]').forEach(b => b.addEventListener('click', async () => {
      if (!confirm('إلغاء طلب الإجازة؟')) return;
      if (await this.hrWrite('hr_leaves', 'delete', null, b.dataset.myCancelLeave)) { showToast('تم إلغاء الطلب', 'success'); rerender(); }
    }));
  }

  // ===== إعدادات المحل (انستجرام + رقم المحل) =====
  // تُحفظ في جدول settings على Supabase إن وُجد، وإلا على هذا الجهاز فقط
  applySettings(obj) {
    SHOP_EDITABLE_KEYS.forEach(k => {
      if (obj && typeof obj[k] === 'string' && obj[k].trim()) SHOP[k] = obj[k].trim();
    });
    // شعار محذوف (قيمة فارغة) = الرجوع للشعار الافتراضي
    if (obj && obj.logo === '') SHOP.logo = DEFAULT_LOGO;
    this.rebuildDynamicDict();
  }

  // أسماء الخدمات بالإنجليزي + الاسم التجاري بالإنجليزي
  // الاسم الإنجليزي للخدمة: من عمود name_en، وإن لم يوجد العمود فمن الحفظ البديل
  serviceNameEn(sv) {
    if (!sv) return '';
    const map = this.serviceEnMap || {};
    return String(sv.name_en || map[sv.id] || '').trim();
  }

  loadServiceEnMap(fromDb) {
    let map = {};
    try { map = JSON.parse(localStorage.getItem('tireshop_service_en') || '{}') || {}; } catch (e) {}
    if (fromDb) {
      try { map = { ...map, ...(JSON.parse(fromDb) || {}) }; } catch (e) {}
    }
    this.serviceEnMap = map;
  }

  // حفظ بديل عند عدم وجود عمود name_en: في جدول settings، وإلا على هذا الجهاز
  async saveServiceEnFallback(serviceId, nameEn) {
    const map = { ...(this.serviceEnMap || {}) };
    if (nameEn) map[serviceId] = nameEn; else delete map[serviceId];
    this.serviceEnMap = map;
    try { localStorage.setItem('tireshop_service_en', JSON.stringify(map)); } catch (e) {}
    if (this.sb) {
      const { error } = await this.sb.from('settings').upsert([{ key: 'serviceNamesEn', value: JSON.stringify(map) }], { onConflict: 'key' });
      if (!error) return 'db';
    }
    return 'local';
  }

  // بعد حفظ خدمة: تأكد أن الاسم الإنجليزي حُفظ فعلاً وأخبر المستخدم أين
  async afterServiceSaved(serviceId, nameEn) {
    const columnMissing = (this.lastDropped || []).includes('name_en');
    if (!serviceId) return;
    if (columnMissing) {
      const where = await this.saveServiceEnFallback(serviceId, nameEn);
      if (nameEn) {
        showToast(where === 'db'
          ? 'تم حفظ الاسم الإنجليزي (في جدول الإعدادات)'
          : 'تم حفظ الاسم الإنجليزي على هذا الجهاز فقط — أضف عمود name_en في Supabase ليظهر على كل الأجهزة', where === 'db' ? 'success' : 'warning');
      }
    } else if (this.serviceEnMap && this.serviceEnMap[serviceId]) {
      // العمود موجود وحُفظ فيه: نحذف النسخة البديلة القديمة
      await this.saveServiceEnFallback(serviceId, null);
    }
    this.rebuildDynamicDict();
  }

  rebuildDynamicDict() {
    DYN_DICT = {};
    if (SHOP.nameEn) DYN_DICT[SHOP.name] = SHOP.nameEn;
    (this.services || []).forEach(sv => {
      const en = this.serviceNameEn(sv);
      if (sv.name && en) DYN_DICT[sv.name.trim()] = en;
    });
    resetTranslations();
  }

  async loadSettings() {
    this.loadServiceEnMap();
    try {
      this.applySettings(JSON.parse(localStorage.getItem('tireshop_settings') || '{}'));
    } catch (e) {}
    this.settingsInDb = false;
    if (!this.sb) return;
    try {
      const { data, error } = await this.sb.from('settings').select('*');
      if (error) {
        console.warn('⚠️ جدول settings غير متاح، الإعدادات محفوظة على هذا الجهاز فقط:', error.message);
        return;
      }
      this.settingsInDb = true;
      const obj = {};
      (data || []).forEach(r => { obj[r.key] = r.value; });
      this.loadServiceEnMap(obj.serviceNamesEn);
      this.applySettings(obj);
      localStorage.setItem('tireshop_settings', JSON.stringify(obj));
    } catch (e) {
      console.warn('Settings load error:', e);
    }
  }

  async saveSettings(values) {
    // نحفظ فقط المفاتيح المرسلة حتى لا تُمسح الإعدادات الأخرى (مثل الشعار)
    const clean = {};
    SHOP_EDITABLE_KEYS.filter(k => k in values).forEach(k => { clean[k] = String(values[k] || '').trim(); });
    try {
      const stored = JSON.parse(localStorage.getItem('tireshop_settings') || '{}') || {};
      localStorage.setItem('tireshop_settings', JSON.stringify({ ...stored, ...clean }));
    } catch (e) {}
    this.applySettings(clean);
    if (!this.sb) return 'local';
    const rows = Object.entries(clean).map(([key, value]) => ({ key, value }));
    const { error } = await this.sb.from('settings').upsert(rows, { onConflict: 'key' });
    if (error) {
      console.warn('Settings save error:', error);
      this.settingsInDb = false;
      return 'local';
    }
    this.settingsInDb = true;
    return 'db';
  }

  async loadAllData() {
    if (!this.sb) {
      console.warn('⚠️ Supabase not available');
      await this.loadSettings();
      return;
    }

    // منع استدعاءات متعددة متزامنة
    if (this.isLoading) return;
    this.isLoading = true;

    try {
      const tables = [
        'tires', 'services', 'customers', 'appointments', 'sales',
        'suppliers', 'supplier_invoices', 'supplier_payments', 'expenses'
      ];

      // تحميل جميع الجداول بالتوازي بدلاً من التسلسل
      const results = await Promise.all(
        tables.map(table => 
          this.sb.from(table).select('*')
        )
      );

      // الجداول الأساسية: إذا فشلت كلها فقاعدة البيانات غير متاحة (غالباً المشروع موقوف مؤقتاً)
      const core = ['tires', 'services', 'customers', 'sales'];
      const coreFailed = core.filter(tb => results[tables.indexOf(tb)]?.error).length;
      this.dbOffline = coreFailed === core.length;
      if (this.dbOffline) {
        console.error('❌ قاعدة البيانات غير متاحة', results.map(r => r.error?.message));
        this.updateDbBanner();
        return; // لا نمسح البيانات المعروضة حالياً
      }

      results.forEach((result, idx) => {
        const table = tables[idx];
        const { data, error } = result;
        
        if (error) {
          console.error(`Error loading ${table}:`, error);
          return;
        }

        const mapped = data.map(row => rowFromDb(row, table));
        
        const propName = table
          .replace('supplier_invoices', 'supplierInvoices')
          .replace('supplier_payments', 'supplierPayments');
        
        this[propName] = mapped;
        console.log(`✅ Loaded ${mapped.length} from ${table}`);
      });
      await this.loadSettings();
      this.rebuildDynamicDict();
      await this.loadHR();
    } catch (e) {
      console.error('Data load error:', e);
      this.dbOffline = true;
    } finally {
      this.isLoading = false;
      this.updateDbBanner();
    }
  }

  // رسالة واضحة عند تعذّر الاتصال بقاعدة البيانات بدل جداول فارغة
  updateDbBanner() {
    const box = document.getElementById('dbBanner');
    if (!box) return;
    if (!this.dbOffline) {
      box.innerHTML = '';
      return;
    }
    box.innerHTML = `
      <div class="db-banner">
        <div>
          <b>⚠️ تعذّر الاتصال بقاعدة البيانات</b>
          <p>بياناتك محفوظة ولم تُحذف. السبب غالباً أن مشروع Supabase موقوف مؤقتاً بسبب عدم الاستخدام: سجّل الدخول إلى Supabase ثم اضغط "إعادة المحاولة".</p>
        </div>
        <button class="btn btn-amber" id="dbRetryBtn">🔄 إعادة المحاولة</button>
      </div>
    `;
    document.getElementById('dbRetryBtn')?.addEventListener('click', async (e) => {
      e.currentTarget.disabled = true;
      e.currentTarget.textContent = '⏳ جاري المحاولة...';
      await this.loadAllData();
      if (!this.dbOffline) {
        showToast('تم الاتصال بقاعدة البيانات', 'success');
        this.render();
      } else {
        showToast('ما زالت قاعدة البيانات غير متاحة', 'error');
      }
    });
  }

  // كتابة مرنة: تتجاوز الأعمدة غير الموجودة، وتحوّل null إلى نص فارغ إذا كان العمود لا يقبل الفراغ
  async writeWithRetry(dbData, doWrite) {
    const data = { ...dbData };
    const dropped = [];
    this.lastDropped = dropped;
    for (let attempt = 0; attempt < 8; attempt++) {
      const result = await doWrite(data);
      const error = result.error;
      if (!error) return { ...result, dropped };
      const msg = error.message || '';
      const missing = /'([^']+)' column/.exec(msg);
      if (missing && missing[1] in data) {
        console.warn(`⚠️ العمود "${missing[1]}" غير موجود في الجدول، تم تجاوزه`);
        dropped.push(missing[1]);
        delete data[missing[1]];
        continue;
      }
      const notNull = error.code === '23502' && /column "([^"]+)"/.exec(msg);
      if (notNull && notNull[1] in data && data[notNull[1]] === null) {
        data[notNull[1]] = '';
        continue;
      }
      return result;
    }
    return { error: { message: 'تعذّر الحفظ بعد عدة محاولات' } };
  }

  async addRecord(table, data) {
    if (!this.sb) {
      const id = uid();
      const record = { id, ...data, createdAt: new Date().toISOString() };
      this[table].unshift(record);
      return true;
    }

    try {
      const dbData = rowToDb(data, table);
      console.log(`📤 Sending to ${table}:`, dbData);
      console.log(`📤 Keys:`, Object.keys(dbData));
      
      // تحقق من البيانات
      if (!dbData || Object.keys(dbData).length === 0) {
        console.error('❌ No data to send!');
        showToast('بيانات فارغة!', 'error');
        return false;
      }
      
      // تحقق من أن البيانات ليست undefined/null
      Object.entries(dbData).forEach(([key, value]) => {
        console.log(`  ${key}: "${value}" (type: ${typeof value})`);
      });
      
      const { data: insertedData, error } = await this.writeWithRetry(dbData, d => this.sb.from(table).insert([d]));
      
      if (error) {
        console.error(`❌ Error adding to ${table}:`, error);
        console.error('Error message:', error.message);
        console.error('Error code:', error.code);
        console.error('Error details:', error.details);
        console.log('📤 Data tried to send:', dbData);
        const friendly = error.code === '23505'
          ? 'هذه القيمة مسجلة مسبقاً (مكررة) — ' + (error.details || '')
          : (error.message || 'خطأ');
        showToast(`❌ ${friendly}`, 'error');
        return false;
      }

      console.log('✅ Insert successful:', insertedData);
      await this.loadAllData();
      showToast(t('saved'), 'success');
      return true;
    } catch (e) {
      console.error('❌ Add record error:', e);
      console.error('Full error:', JSON.stringify(e));
      showToast(t('error'), 'error');
      return false;
    }
  }

  // ===== SALES WIZARD (سلة متعددة: خدمات + إطارات) =====

  emptySaleWizard() {
    return {
      active: false,
      step: 1,
      tab: 'services',
      cart: [],
      warranty: 'noWarranty',
      paymentMethod: 'cash',
      discount: 0,
      discountType: 'amount',
      customerName: '',
      customerPhone: '',
      editingSaleId: null,
      editingInvoiceNumber: null,
      originalTireQty: {},
    };
  }

  // الكمية المتاحة للبيع = المخزون الحالي + ما كان في الفاتورة الأصلية (عند التعديل)
  availableStock(tireId) {
    const tire = this.tires.find(x => x.id === tireId);
    const stock = parseInt(tire?.stock) || 0;
    return stock + (this.saleWizard.originalTireQty?.[tireId] || 0);
  }

  startEditSale(saleId) {
    const sale = this.sales.find(x => x.id === saleId);
    if (!sale) return;

    let items = sale.items;
    if (typeof items === 'string') {
      try { items = JSON.parse(items); } catch (e) { items = null; }
    }

    const cart = [];
    if (Array.isArray(items) && items.length) {
      items.forEach((i, idx) => {
        const type = i.type === 'tire' || i.type === 'service' ? i.type : 'custom';
        const refId = i.refId || ('c' + idx);
        cart.push({
          key: type + ':' + refId, type, refId,
          description: i.description || '-',
          unitPrice: parseFloat(i.unitPrice ?? i.unit_price) || 0,
          quantity: parseFloat(i.quantity) || 1,
        });
      });
    } else if (sale.service_name) {
      // فاتورة قديمة بدون تفاصيل الأصناف: نحاول مطابقة خدمة، وإلا سطر حر
      const service = this.services.find(x => x.name === sale.service_name);
      const qty = parseFloat(sale.quantity) || 1;
      const unit = parseFloat(sale.unit_price);
      if (service && unit) {
        cart.push({ key: 'service:' + service.id, type: 'service', refId: service.id, description: service.name, unitPrice: unit, quantity: qty });
      } else {
        cart.push({ key: 'custom:legacy', type: 'custom', refId: 'legacy', description: sale.service_name,
          unitPrice: unit || parseFloat(sale.subtotal) || parseFloat(sale.total) || 0, quantity: unit ? qty : 1 });
      }
    }

    const originalTireQty = {};
    cart.filter(l => l.type === 'tire').forEach(l => {
      originalTireQty[l.refId] = (originalTireQty[l.refId] || 0) + l.quantity;
    });

    const pct = parseFloat(sale.discountPercent) || 0;
    const amt = parseFloat(sale.discountAmount) || 0;

    this.saleWizard = {
      ...this.emptySaleWizard(),
      active: true,
      cart,
      warranty: sale.warranty || 'noWarranty',
      paymentMethod: sale.paymentMethod || 'cash',
      discountType: pct > 0 ? 'percent' : 'amount',
      discount: pct > 0 ? pct : amt,
      customerName: sale.customerName || '',
      customerPhone: sale.customerPhone || '',
      editingSaleId: sale.id,
      editingInvoiceNumber: sale.invoiceNumber,
      originalTireQty,
    };
    this.switchView(this.saleView());
  }

  startNewSale() {
    this.saleWizard = { ...this.emptySaleWizard(), active: true };
    this.switchView(this.saleView());
  }

  cancelSale() {
    this.saleWizard = this.emptySaleWizard();
    this.switchView(this.saleView());
  }

  nextWizardStep() {
    if (this.saleWizard.step < 3) {
      this.saleWizard.step++;
      this.switchView(this.saleView());
    }
  }

  prevWizardStep() {
    if (this.saleWizard.step > 1) {
      this.saleWizard.step--;
      this.switchView(this.saleView());
    }
  }

  tireLabel(tire) {
    return [tire.brand, tire.model, tire.size].filter(Boolean).join(' ');
  }

  // أضف عنصر للسلة أو زد كميته
  addToCart(type, refId) {
    const cart = this.saleWizard.cart;
    const key = type + ':' + refId;
    const line = cart.find(l => l.key === key);

    if (type === 'tire') {
      const tire = this.tires.find(x => x.id === refId);
      if (!tire) return;
      const stock = this.availableStock(refId);
      const inCart = line ? line.quantity : 0;
      if (inCart + 1 > stock) {
        showToast(`المخزون المتاح من هذا الإطار: ${stock} فقط`, 'warning');
        return;
      }
      if (line) line.quantity++;
      else cart.push({ key, type, refId, description: this.tireLabel(tire), unitPrice: parseFloat(tire.sellingPrice) || 0, quantity: 1 });
    } else {
      const service = this.services.find(x => x.id === refId);
      if (!service) return;
      if (line) line.quantity++;
      else cart.push({ key, type, refId, description: service.name, unitPrice: parseFloat(service.price) || 0, quantity: 1 });
    }
    this.switchView(this.saleView());
  }

  changeCartQty(key, delta) {
    const cart = this.saleWizard.cart;
    const line = cart.find(l => l.key === key);
    if (!line) return;
    const next = line.quantity + delta;
    if (next < 1) {
      this.saleWizard.cart = cart.filter(l => l.key !== key);
    } else {
      if (line.type === 'tire') {
        const stock = this.availableStock(line.refId);
        if (next > stock) {
          showToast(`المخزون المتاح: ${stock} فقط`, 'warning');
          return;
        }
      }
      line.quantity = next;
    }
    this.switchView(this.saleView());
  }

  removeFromCart(key) {
    this.saleWizard.cart = this.saleWizard.cart.filter(l => l.key !== key);
    this.switchView(this.saleView());
  }

  discountLabel() {
    const { percent } = this.cartTotals();
    return percent > 0 ? `الخصم (${+percent.toFixed(2)}%)` : 'الخصم';
  }

  cartTotals() {
    const subtotal = this.saleWizard.cart.reduce((s, l) => s + l.unitPrice * l.quantity, 0);
    const w = this.saleWizard;
    const value = this.canDiscount() ? Math.max(parseFloat(w.discount) || 0, 0) : 0;
    const isPercent = w.discountType === 'percent';
    const percent = isPercent ? Math.min(value, 100) : 0;
    let discount = isPercent ? subtotal * percent / 100 : value;
    discount = Math.round(Math.min(discount, subtotal) * 1000) / 1000;
    return { subtotal, discount, percent, total: subtotal - discount };
  }

  // عناصر الفاتورة للطباعة/الواتساب (تدعم الفواتير القديمة ذات الخدمة الواحدة)
  getSaleItems(sale) {
    let items = sale.items;
    if (typeof items === 'string') {
      try { items = JSON.parse(items); } catch (e) { items = null; }
    }
    if (Array.isArray(items) && items.length) {
      return items.map(i => ({
        description: i.description || i.name || '-',
        quantity: parseFloat(i.quantity) || 1,
        unitPrice: parseFloat(i.unitPrice ?? i.unit_price) || 0,
      }));
    }
    if (sale.service_name) {
      const unit = parseFloat(sale.unit_price);
      if (unit) {
        return [{ description: sale.service_name, quantity: parseFloat(sale.quantity) || 1, unitPrice: unit }];
      }
      // فاتورة متعددة الأصناف بدون عمود items: سطر واحد بالمجموع قبل الخصم
      const sub = parseFloat(sale.subtotal) || parseFloat(sale.total) || 0;
      return [{ description: sale.service_name, quantity: 1, unitPrice: sub }];
    }
    return [];
  }

  normalizePhone(phone) {
    let p = String(phone || '').replace(/\D/g, '');
    if (p.startsWith('00')) p = p.slice(2);
    if (p.length === 8) p = '968' + p; // رقم عماني محلي
    return p;
  }

  // رسالة واتساب موحّدة (من المعالج ومن قائمة الفواتير)
  buildInvoiceMessage(d) {
    let msg = `🏪 *${SHOP.name}*\n`;
    msg += `السجل التجاري: ${SHOP.cr}\n`;
    msg += `📋 *فاتورة رقم:* ${d.invoiceNumber}\n`;
    msg += `التاريخ: ${fmtDate(d.date)}\n`;
    msg += `*العميل:* ${d.customerName || '-'}\n\n*التفاصيل:*\n`;
    d.items.forEach(i => {
      msg += `• ${i.description} × ${i.quantity} = ${fmtMoney(i.unitPrice * i.quantity)}\n`;
    });
    if (d.discount > 0) {
      msg += `\n*المجموع:* ${fmtMoney(d.subtotal)}\n*${d.discountLabel}:* ${fmtMoney(d.discount)}\n`;
    }
    msg += `\n*الإجمالي:* ${fmtMoney(d.total)} ر.ع\n`;
    if (d.paymentMethod) msg += `*طريقة الدفع:* ${t(d.paymentMethod)}\n`;
    const end = warrantyEndDate(d.date, d.warranty);
    if (end) msg += `\n🛡️ *${t(d.warranty)}* — ساري حتى ${fmtDate(end)}\n`;
    msg += `\n📞 ${SHOP.phone}`;
    if (instagramHandle()) msg += `\n📷 انستجرام: @${instagramHandle()}`;
    msg += `\n\nشكراً لتعاملك معنا 🙏`;
    return tr(msg);
  }

  buildWizardInvoiceMessage(invoiceNumber) {
    const { subtotal, discount, total } = this.cartTotals();
    const w = this.saleWizard;
    const original = w.editingSaleId ? this.sales.find(x => x.id === w.editingSaleId) : null;
    return this.buildInvoiceMessage({
      invoiceNumber, date: original?.createdAt || new Date().toISOString(),
      customerName: w.customerName, items: w.cart, subtotal, discount,
      discountLabel: this.discountLabel(), total, warranty: w.warranty, paymentMethod: w.paymentMethod,
    });
  }

  // يحاول الحفظ، وإذا رفضت قاعدة البيانات عموداً غير موجود يحذفه ويعيد المحاولة
  async insertSaleRow(row) {
    const data = { ...row };
    const dropped = [];
    for (let attempt = 0; attempt < 8; attempt++) {
      const { error } = await this.sb.from('sales').insert([data]);
      if (!error) return { ok: true, dropped };
      const m = /'([^']+)' column/.exec(error.message || '') || /column "?([a-z_]+)"? .*does not exist/.exec(error.message || '');
      if (m && m[1] in data) {
        dropped.push(m[1]);
        delete data[m[1]];
        continue;
      }
      console.error('❌ Sale insert error:', error);
      return { ok: false, error };
    }
    return { ok: false, error: { message: 'too many retries' } };
  }

  async saveSale(invoiceNumber) {
    const w = this.saleWizard;
    if (!w.cart.length) {
      showToast('السلة فارغة', 'warning');
      return false;
    }
    if (this.isSavingSale) return false;
    this.isSavingSale = true;

    const { subtotal, discount, percent, total } = this.cartTotals();
    const totalQty = w.cart.reduce((s, l) => s + l.quantity, 0);
    const summary = w.cart.map(l => `${l.description} ×${l.quantity}`).join('، ');
    const items = w.cart.map(l => ({
      type: l.type, refId: l.refId, description: l.description,
      quantity: l.quantity, unitPrice: l.unitPrice,
    }));
    const editingId = w.editingSaleId;
    invoiceNumber = w.editingInvoiceNumber || invoiceNumber || ('INV-' + Date.now());

    const row = {
      invoice_number: invoiceNumber,
      customer_name: w.customerName,
      customer_phone: w.customerPhone,
      payment_method: w.paymentMethod,
      warranty: w.warranty,
      service_name: summary,
      quantity: totalQty,
      unit_price: w.cart.length === 1 ? w.cart[0].unitPrice : null,
      subtotal: subtotal,
      discount_amount: discount,
      discount_percent: percent,
      total: total,
      items: items,
    };

    try {
      // فرق كميات الإطارات: الجديد − الأصلي (عند الفاتورة الجديدة الأصلي = 0)
      const stockDelta = {};
      w.cart.filter(l => l.type === 'tire').forEach(l => {
        stockDelta[l.refId] = (stockDelta[l.refId] || 0) + l.quantity;
      });
      Object.entries(w.originalTireQty || {}).forEach(([id, q]) => {
        stockDelta[id] = (stockDelta[id] || 0) - q;
      });

      if (!this.sb) {
        if (editingId) {
          const idx = this.sales.findIndex(x => x.id === editingId);
          if (idx > -1) this.sales[idx] = { ...this.sales[idx], ...rowFromDb({ ...row, created_at: this.sales[idx].createdAt }, 'sales'), id: editingId };
        } else {
          this.sales.unshift({ ...rowFromDb({ ...row, id: uid(), created_at: new Date().toISOString() }, 'sales') });
        }
        Object.entries(stockDelta).forEach(([id, d]) => {
          const tire = this.tires.find(x => x.id === id);
          if (tire && d) tire.stock = (parseInt(tire.stock) || 0) - d;
        });
      } else {
        const res = editingId
          ? await this.writeWithRetry(row, d => this.sb.from('sales').update(d).eq('id', editingId)).then(r => ({ ok: !r.error, error: r.error, dropped: [] }))
          : await this.insertSaleRow(row);
        if (!res.ok) {
          showToast('لم تُحفظ الفاتورة: ' + (res.error?.message || ''), 'error');
          return false;
        }
        if (res.dropped.length) console.warn('⚠️ أعمدة غير موجودة في جدول sales ولم تُحفظ:', res.dropped);

        // تحديث مخزون الإطارات بالفرق فقط
        for (const [id, d] of Object.entries(stockDelta)) {
          if (!d) continue;
          const tire = this.tires.find(x => x.id === id);
          if (!tire) continue;
          const newStock = Math.max(0, (parseInt(tire.stock) || 0) - d);
          const { error } = await this.sb.from('tires').update({ stock: newStock }).eq('id', id);
          if (error) {
            console.error('Stock update error:', error);
            showToast('حُفظت الفاتورة لكن تعذّر تحديث مخزون: ' + this.tireLabel(tire), 'error');
          }
        }
        await this.loadAllData();
      }

      showToast(editingId ? 'تم تعديل الفاتورة' : t('invoiceCreated'), 'success');
      if (!this.isManager()) this.lastSaleNumber = invoiceNumber;
      this.saleWizard = this.emptySaleWizard();
      this.switchView(this.saleView());
      return true;
    } finally {
      this.isSavingSale = false;
    }
  }

  sendWhatsApp() {
    const w = this.saleWizard;

  // تصغير الصورة المرفوعة لتبقى خفيفة (حد أقصى 480 بكسل)
  readLogoFile(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('read'));
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error('image'));
        img.onload = () => {
          const scale = Math.min(1, 480 / Math.max(img.width, img.height));
          const c = document.createElement('canvas');
          c.width = Math.max(1, Math.round(img.width * scale));
          c.height = Math.max(1, Math.round(img.height * scale));
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          resolve(c.toDataURL('image/png'));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  bindShopSettingsEvents() {
    document.getElementById('logoFileInput')?.addEventListener('change', async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      if (file.size > 5 * 1024 * 1024) {
        showToast('حجم الصورة كبير (الحد 5MB)', 'error');
        return;
      }
      try {
        const dataUrl = await this.readLogoFile(file);
        const where = await this.saveSettings({ logo: dataUrl });
        showToast(where === 'db' ? 'تم تغيير الشعار' : 'تم تغيير الشعار على هذا الجهاز فقط', where === 'db' ? 'success' : 'warning');
        this.render();
      } catch (err) {
        showToast('تعذّرت قراءة الصورة', 'error');
      }
    });
    document.getElementById('logoResetBtn')?.addEventListener('click', async () => {
      if (!confirm('استعادة الشعار الأصلي؟')) return;
      await this.saveSettings({ logo: '' });
      SHOP.logo = DEFAULT_LOGO;
      showToast('تمت استعادة الشعار الأصلي', 'success');
      this.render();
    });
    document.getElementById('saveSettingsBtn')?.addEventListener('click', async () => {
      const phone = document.getElementById('settingPhone').value.trim();
      const instagram = document.getElementById('settingInstagram').value.trim().replace(/^@/, '');
      if (!phone) {
        showToast('أدخل رقم المحل', 'error');
        return;
      }
      if (instagram && !/^[A-Za-z0-9._]+$/.test(instagram)) {
        showToast('اسم انستجرام يحتوي على أحرف غير مسموحة', 'error');
        return;
      }
      const nameEn = document.getElementById('settingNameEn').value.trim();
      const where = await this.saveSettings({ phone, instagram, nameEn });
      showToast(where === 'db' ? 'تم حفظ الإعدادات' : 'تم الحفظ على هذا الجهاز فقط', where === 'db' ? 'success' : 'warning');
      this.switchView('shopSettings');
    });
    document.getElementById('previewInvoiceBtn')?.addEventListener('click', () => {

  getSalesByPeriod(period, customFromDate = null, customToDate = null) {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    
    let fromDate = new Date(today);
    let toDate = new Date(today);
    toDate.setHours(23, 59, 59, 999);

    if (period === 'yesterday') {
      fromDate = new Date(today);
      fromDate.setDate(today.getDate() - 1);
      toDate = new Date(fromDate);
      toDate.setHours(23, 59, 59, 999);
    } else if (period === 'week') {
      fromDate = new Date(today);
      fromDate.setDate(today.getDate() - 6);
      toDate = new Date(today);
      toDate.setHours(23, 59, 59, 999);
    } else if (period === 'month') {
      fromDate = new Date(today.getFullYear(), today.getMonth(), 1);
      toDate = new Date(today);
      toDate.setHours(23, 59, 59, 999);
    } else if (period === 'custom' && customFromDate && customToDate) {
      fromDate = new Date(customFromDate);
      fromDate.setHours(0, 0, 0, 0);
      toDate = new Date(customToDate);
      toDate.setHours(23, 59, 59, 999);
    } else if (period === 'custom') {
      return [];
    }

    return this.sales.filter(sale => {
      const saleDate = new Date(sale.createdAt);
      return saleDate >= fromDate && saleDate <= toDate;
    });
  }

  filterByDate(data, dateField) {
    const specificDate = document.getElementById('filterSpecificDate')?.value;
    const fromDate = document.getElementById('filterFromDate')?.value;
    const toDate = document.getElementById('filterToDate')?.value;

    return data.filter(item => {
      const itemDate = item[dateField];
      if (!itemDate) return true;

      const date = new Date(itemDate).toISOString().split('T')[0];

      if (specificDate && date !== specificDate) return false;
      if (fromDate && date < fromDate) return false;
      if (toDate && date > toDate) return false;

      return true;
    });
  }

  // حفظ دفعة مورد + تحديث رصيد فاتورة المورد (فقط إذا نجح حفظ الدفعة)
  async saveSupplierPayment(invoice, amount, method, notes) {
    const methodTag = `[طريقة الدفع: ${SUPPLIER_PAY_METHODS[method]}]`;
    const cleanNotes = (notes || '').trim();
    const colMissing = this.missingPayMethodCol === true;
    const row = {
      supplier_invoice_id: invoice.id,
      payment_amount: amount,
      payment_date: new Date().toISOString(),
      notes: colMissing ? (methodTag + ' ' + cleanNotes).trim() : cleanNotes,
    };
    if (!colMissing) row.payment_method = method;

    const ok = await this.addRecord('supplier_payments', row);
    if (ok === false) return false;

    // عمود payment_method غير موجود: نحفظ الطريقة داخل الملاحظات حتى لا تضيع
    if (!colMissing && (this.lastDropped || []).includes('payment_method')) {
      this.missingPayMethodCol = true;
      const saved = [...this.supplierPayments]
        .filter(p => p.supplierInvoiceId === invoice.id && Math.abs((parseFloat(p.paymentAmount) || 0) - amount) < 0.0001 && !supplierPaymentMethod(p))
        .sort((a, b) => String(b.paymentDate || b.createdAt).localeCompare(String(a.paymentDate || a.createdAt)))[0];
      if (saved && this.sb) {
        await this.sb.from('supplier_payments').update({ notes: (methodTag + ' ' + cleanNotes).trim() }).eq('id', saved.id);
      }
    }

    const paid = (parseFloat(invoice.paidAmount) || 0) + amount;
    const total = parseFloat(invoice.totalAmount) || 0;
    await this.updateRecord('supplier_invoices', invoice.id, {
      paid_amount: paid,
      remaining_amount: Math.max(0, Math.round((total - paid) * 1000) / 1000),
    });
    return true;
  }

    });
  }

  async updateRecord(table, id, data) {
    if (!this.sb) {
      const idx = this[table].findIndex(x => x.id === id);
      if (idx > -1) {
        this[table][idx] = { ...this[table][idx], ...data };
      }
      return true;
    }

    try {
      const dbData = rowToDb(data, table);
      const { error } = await this.writeWithRetry(dbData, d => this.sb.from(table).update(d).eq('id', id));
      
      if (error) {
        console.error(`Error updating ${table}:`, error);
        showToast('خطأ في التحديث: ' + (error.code === '23505' ? 'قيمة مكررة' : (error.message || '')), 'error');
        return false;
      }

      await this.loadAllData();
      showToast('تم التحديث', 'success');
      return true;
    } catch (e) {
      console.error('Update record error:', e);
      showToast('خطأ', 'error');
      return false;
    }
  }

  async deleteRecord(table, id) {
    if (!this.sb) {
      const idx = this[table].findIndex(x => x.id === id);
      if (idx > -1) {
        this[table].splice(idx, 1);
      }
      return true;
    }

    try {
      const { error } = await this.sb.from(table).delete().eq('id', id);
      
      if (error) {
        console.error(`Error deleting from ${table}:`, error);
        return false;
      }

      await this.loadAllData();
      showToast('تم الحذف', 'success');
      return true;
    } catch (e) {
      console.error('Delete record error:', e);
      return false;
    }
  }
