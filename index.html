  padding: 8px 0;
  font-size: 14px;
}

.invoice-row.total {
  font-size: 16px;
  font-weight: 700;
  padding: 12px 0;
  border-top: 2px solid var(--line);
  border-bottom: 2px solid var(--line);
}

.action-cell {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

/* Wizard Steps */
.wizard-container {
  max-width: 600px;
  margin: 0 auto;
}

.wizard-step {
  display: none;
}

.wizard-step.active {
  display: block;
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.wizard-progress {
  display: flex;
  gap: 8px;
  margin-bottom: 24px;
  justify-content: center;
}

.progress-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--line);
  transition: all 0.3s;
}

.progress-dot.active {
  background: var(--amber-500);
  transform: scale(1.2);
}

.progress-dot.done {
  background: var(--tread-green);
}

/* Service Grid */
.service-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 12px;
}

.service-card {
  padding: 16px;
  border: 2px solid var(--line);
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
  background: #fff;
}

.service-card:hover {
  border-color: var(--amber-500);
  box-shadow: 0 4px 12px rgba(242,167,27,0.1);
}

.service-card.selected {
  border-color: var(--amber-500);
  background: var(--amber-100);
}

.service-card h4 {
  margin: 0 0 8px;
  font-size: 14px;
  font-weight: 700;
}

.service-card .price {
  font-size: 12px;
  color: var(--tread-green);
  font-weight: 600;
}

/* Quantity Selector */
.quantity-selector {
  display: flex;
  align-items: center;
  gap: 12px;
  justify-content: center;
  margin: 20px 0;
}

.qty-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: #fff;
  font-size: 20px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
}

.qty-btn:hover {
  background: var(--amber-100);
  border-color: var(--amber-500);
}

.qty-display {
  font-size: 24px;
  font-weight: 800;
  min-width: 60px;
  text-align: center;
}

.qty-input {
  width: 100px;
  padding: 8px;
  border: 1px solid var(--line);
  border-radius: 5px;
  font-size: 16px;
  text-align: center;
  font-weight: 600;
}

/* Summary Box */
.summary-box {
  background: var(--concrete-100);
  padding: 16px;
  border-radius: 8px;
  margin: 20px 0;
}

.summary-row {
  display: flex;
  justify-content: space-between;
  padding: 8px 0;
  font-size: 14px;
}

.summary-row.total {
  font-size: 16px;
  font-weight: 700;
  padding: 12px 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  margin: 8px 0;
}

/* Warranty Options */
.warranty-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.warranty-option {
  padding: 14px;
  border: 2px solid var(--line);
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
  background: #fff;
}

.warranty-option:hover {
  border-color: var(--amber-500);
}

.warranty-option.selected {
  border-color: var(--amber-500);
  background: var(--amber-100);
}

.warranty-option h4 {
  margin: 0 0 4px;
  font-size: 14px;
  font-weight: 700;
}

.warranty-option p {
  margin: 0;
  font-size: 12px;
  color: var(--text-muted);
}

/* Date Filter Styles */
.card[style*="info-blue-bg"] {
  background: var(--info-blue-bg) !important;
  border: 1px solid var(--info-blue);
}

#applyDateFilterBtn, #clearDateFilterBtn {
  min-width: 100px;
}

@media (max-width: 768px) {
  .card[style*="info-blue-bg"] {
    padding: 16px;
  }
}

.wizard-container.wz-wide { max-width: 1100px; }
.wz-steps { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.wz-step { flex: 1; min-width: 90px; padding: 10px; border-radius: 8px; background: var(--paper); border: 1px solid var(--line); color: var(--text-muted); font-weight: 700; text-align: center; font-size: 14px; }
.wz-step.active { border-color: var(--amber-500); color: var(--text-900); background: var(--amber-100); }
.wz-step.done { color: var(--tread-green); }
.wz-num { display: inline-flex; width: 22px; height: 22px; border-radius: 50%; align-items: center; justify-content: center; background: currentColor; margin-left: 6px; }
.wz-num { color: #fff; background: var(--text-muted); }
.wz-step.active .wz-num { background: var(--amber-600); }
.wz-step.done .wz-num { background: var(--tread-green); }
.wz-layout { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(280px, 1fr); gap: 16px; align-items: start; }
.wz-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
.wz-tab { flex: 1; padding: 12px; border: 2px solid var(--line); border-radius: 8px; background: var(--paper); font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; }
.wz-tab.active { border-color: var(--amber-500); background: var(--amber-100); }
.wz-search { width: 100%; padding: 10px 12px; margin-bottom: 12px; border: 1px solid var(--line); border-radius: 8px; font-family: inherit; font-size: 14px; }
.pick-card { position: relative; user-select: none; }
.pick-card.out { opacity: 0.45; cursor: not-allowed; }
.pick-badge { position: absolute; top: -9px; left: -9px; box-shadow: 0 2px 4px rgba(0,0,0,.2); min-width: 24px; height: 24px; padding: 0 6px; border-radius: 12px; background: var(--amber-600); color: #fff; font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center; }
.cart-panel { position: sticky; top: 12px; }
.cart-line { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.cart-desc { flex: 1; display: flex; gap: 8px; align-items: center; min-width: 0; }
.cart-name { font-weight: 700; font-size: 14px; overflow-wrap: anywhere; }
.cart-type { font-size: 18px; }
.cart-qty { display: flex; align-items: center; gap: 6px; }
.qty-mini { width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--line); background: var(--concrete-100); font-size: 16px; font-weight: 800; cursor: pointer; }
.cart-line-total { font-weight: 800; min-width: 60px; text-align: left; }
.cart-remove { border: none; background: none; color: var(--brake-red); font-size: 16px; cursor: pointer; padding: 4px; }
@media (max-width: 800px) {
  .wz-layout { grid-template-columns: 1fr; }
  .cart-panel { position: static; }
}

.disc-row { display: flex; gap: 8px; }
.disc-row input { flex: 1; }
.disc-toggle { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex-shrink: 0; }
.disc-type { padding: 0 14px; border: none; background: var(--paper); font-family: inherit; font-weight: 800; font-size: 14px; cursor: pointer; color: var(--text-600); }
.disc-type.active { background: var(--amber-500); color: #fff; }

.wz-edit-banner { background: var(--info-blue-bg); color: var(--info-blue); border: 1px solid var(--info-blue); border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; font-weight: 700; }

.login-role-badge { display: inline-block; padding: 8px 18px; border-radius: 20px; background: var(--amber-100); color: var(--amber-600); font-weight: 800; }
.login-role-badge.emp { background: var(--info-blue-bg); color: var(--info-blue); }

.emp-link-box { display: flex; gap: 6px; margin: 8px 12px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.08); }
.emp-link { flex: 1; display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-radius: 6px; background: rgba(62,126,166,0.18); color: #cfe3f0; font-size: 14px; font-weight: 700; text-decoration: none; border: 1px solid rgba(62,126,166,0.45); transition: background 0.15s; }
.emp-link:hover { background: rgba(62,126,166,0.32); color: #fff; }
.emp-link-arrow { margin-right: auto; opacity: 0.7; }

.emp-copy:hover { background: rgba(255,255,255,0.12); }

.sale-done-icon { font-size: 56px; margin-bottom: 8px; }
.sale-done h2 { font-size: 24px; font-weight: 800; }
.sale-done-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 24px; }
.sale-done-actions .btn { min-width: 150px; padding: 12px 18px; }

// قاموس ديناميكي: أسماء الخدمات بالإنجليزي من قاعدة البيانات + الاسم التجاري
let DYN_DICT = {};
let _trIndex = null;
const AR_CHAR = /[\u0600-\u06FF]/;

function isEn() {
  return currentLang === 'en';
}

function resetTranslations() {
  _trIndex = null;
}

function trIndex() {
  if (_trIndex) return _trIndex;
  const all = { ...SERVICE_GLOSSARY, ...UI_DICT, ...DYN_DICT };
  const map = new Map(Object.entries(all).map(([k, v]) => [k.trim(), v]));
  // العبارات القصيرة جداً (حرفان) تُترجم فقط إذا كانت النص كاملاً
  const keys = [...map.keys()].filter(k => k.replace(/\s/g, '').length > 2).sort((a, b) => b.length - a.length);
  const esc = k => k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = keys.length
    ? new RegExp('(?<![\\u0621-\\u064A])(' + keys.map(esc).join('|') + ')(?![\\u0621-\\u064A])', 'g')
    : null;
  _trIndex = { map, re };
  return _trIndex;
}

// ترجمة نص واحد (يحافظ على المسافات والرموز حوله)
function tr(str) {
  if (!isEn() || str == null) return str;
  str = String(str);
  if (!AR_CHAR.test(str)) return str;
  const { map, re } = trIndex();
  const lead = str.match(/^\s*/)[0], trail = str.match(/\s*$/)[0];
  const core = str.trim();
  if (map.has(core)) return lead + map.get(core) + trail;
  // تطابق كامل مع علامة في النهاية مثل "الاسم:" أو "السعر *"
  const m = core.match(/^(.*?)([\s:*؟?!.]+)$/);
  if (m && map.has(m[1].trim())) return lead + map.get(m[1].trim()) + m[2].replace('؟', '?') + trail;
  let out = re ? str.replace(re, k => map.get(k) ?? k) : str;
  return out.replace(/،/g, ',').replace(/؟/g, '?');
}

// ترجمة HTML كنص (للطباعة)
function trHtml(html) {
  if (!isEn()) return html;
  return html
    .replace(/<html lang="ar" dir="rtl">/, '<html lang="en" dir="ltr">')
    .replace(/>([^<]+)</g, (all, txt) => '>' + tr(txt) + '<');
}

const TR_ATTRS = ['placeholder', 'title', 'aria-label'];
function translateDom(root) {
  if (!isEn() || !root) return;
  if (root.nodeType === 3) {
    const v = tr(root.nodeValue);
    if (v !== root.nodeValue) root.nodeValue = v;
    return;
  }
  if (root.nodeType !== 1 || /^(SCRIPT|STYLE)$/.test(root.tagName)) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT, {
    acceptNode: n => {
      if (n.nodeType === 1 && /^(SCRIPT|STYLE)$/.test(n.tagName)) return NodeFilter.FILTER_REJECT;
      // لا نترجم ما يكتبه المستخدم داخل مربعات النص
      if (n.nodeType === 3 && n.parentNode && n.parentNode.tagName === 'TEXTAREA') return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  let n = root;
  do {
    if (n.nodeType === 3) {
      if (AR_CHAR.test(n.nodeValue)) {
        const v = tr(n.nodeValue);
        if (v !== n.nodeValue) n.nodeValue = v;
      }
    } else if (n.nodeType === 1) {
      TR_ATTRS.forEach(a => {
        const v = n.getAttribute(a);
        if (v && AR_CHAR.test(v)) n.setAttribute(a, tr(v));
      });
    }
  } while ((n = walker.nextNode()));
}

function applyLangDirection() {
  const root = document.documentElement;
  root.lang = isEn() ? 'en' : 'ar';
  root.dir = isEn() ? 'ltr' : 'rtl';
  const baseTitle = document.title.split(' | ')[0];
  document.title = isEn() ? tr(baseTitle) : baseTitle;
}

// مراقبة أي محتوى جديد يظهر على الشاشة وترجمته فوراً
(function setupAutoTranslate() {
  const start = () => {
    new MutationObserver(muts => {
      if (!isEn()) return;
      muts.forEach(m => m.addedNodes.forEach(node => translateDom(node)));
    }).observe(document.body, { childList: true, subtree: true });
  };
  if (document.body) start(); else document.addEventListener('DOMContentLoaded', start);
  ['confirm', 'alert', 'prompt'].forEach(fn => {
    const orig = window[fn].bind(window);
    window[fn] = (msg, ...rest) => orig(tr(msg), ...rest);
  });
})();

  x: '❌',
  whatsapp: '💬',
  warranty: '🛡️',
};

function icon(name) {
  return ICONS[name] || '•';
}

// =====================================================================
// UTILITY FUNCTIONS
// =====================================================================

function uid() {
  return Math.random().toString(36).substr(2, 9);
}

function esc(str) {
  const map = {
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#039;'
  };
  return String(str || '').replace(/[&<>"']/g, m => map[m]);
}

function fmtMoney(n) {
  return (Number(n) || 0).toFixed(2);
}

function fmtDate(iso) {
  if (!iso) return '-';
  try {
    return new Date(iso).toLocaleDateString(currentLang === 'en' ? 'en-GB' : 'ar-OM', {
      year: 'numeric',
      month: 'short',
      day: 'numeric'
    });
  } catch (e) {
    return '-';
  }
}

function showToast(msg, type = 'success') {
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `${icon(type === 'error' ? 'alert' : 'check')} <span>${esc(msg)}</span>`;
  wrap.appendChild(el);
  setTimeout(() => {
    el.style.opacity = '0';
    el.style.transition = 'opacity 0.3s';
    setTimeout(() => el.remove(), 300);
  }, 2600);
}

function hideModal() {
  document.getElementById('modalOverlay').classList.remove('active');
}

// =====================================================================
// DATABASE FIELD MAPPING
// =====================================================================

const FIELD_MAP = {
  tires: { 
    selling_price: 'sellingPrice', 
    cost: 'cost',
    supplier_id: 'supplierId'
  },
  services: {},
  customers: {},
  appointments: { customer_id: 'customerId', customer_name: 'customerName', service_name: 'serviceName', appointment_time: 'appointmentTime' },
  sales: {
    invoice_number: 'invoiceNumber',
    customer_id: 'customerId',
    customer_name: 'customerName',
    customer_phone: 'customerPhone',
    payment_method: 'paymentMethod',
    discount_amount: 'discountAmount',
    discount_percent: 'discountPercent',
    discount_total: 'discountTotal'
  },
  suppliers: {},
  supplier_invoices: {
    supplier_id: 'supplierId',
    invoice_number: 'invoiceNumber',
    total_amount: 'totalAmount',
    paid_amount: 'paidAmount',
    remaining_amount: 'remainingAmount',
    invoice_date: 'invoiceDate'
  },
  supplier_payments: {
    supplier_invoice_id: 'supplierInvoiceId',
    payment_amount: 'paymentAmount',
    payment_date: 'paymentDate'
  },
  expenses: {
    expense_type: 'expenseType',
    expense_date: 'expenseDate'
  },
};

function rowFromDb(row, table) {
  if (!row) return {};
  const map = FIELD_MAP[table] || {};
  const out = { ...row };
  
  Object.entries(map).forEach(([snake, camel]) => {
    if (snake in out) {
      out[camel] = out[snake];
      delete out[snake];
    }
  });
  
  out.createdAt = row.created_at;
  delete out.created_at;
  return out;
}

function rowToDb(obj, table) {
  if (!obj) return {};
  const map = FIELD_MAP[table] || {};
  const out = { ...obj };
  
  Object.entries(map).forEach(([snake, camel]) => {
    if (camel in out) {
      out[snake] = out[camel];
      delete out[camel];
    }
  });
  
  delete out.id;
  delete out.createdAt;
  delete out.created_at;
  
  // Log data for debugging
  if (table === 'customers') {
    console.log(`🔍 Customers rowToDb:`, out);
  }
  
  return out;
}

class TireShopApp {
  constructor() {
    this.sb = null;
    this.currentUser = null;
    this.currentView = 'login';
    this.isLoading = false; // علم لمنع تحميل متزامن متعدد
    
    // Database collections
    this.tires = [];
    this.services = [];
    this.customers = [];
    this.appointments = [];
    this.sales = [];
    this.suppliers = [];
    this.supplierInvoices = [];
    this.supplierPayments = [];
    this.expenses = [];
    
    // Sale wizard state
    this.saleWizard = this.emptySaleWizard();
    
    // Sales period filter
    this.currentSalesPeriod = 'today';
    this.currentCustomFromDate = null;
    this.currentCustomToDate = null;
    
    this.init();
  }

  async init() {
    applyLangDirection();
    try {
      const saved = sessionStorage.getItem('tireshop_user');
      if (saved) {
        const user = JSON.parse(saved);
        // جلسة المدير لا تُفتح في ملف الموظف والعكس
        if (user && user.role === APP_MODE) {
          this.currentUser = user;
          this.currentView = this.homeView();
        } else {
          sessionStorage.removeItem('tireshop_user');
        }
      }
    } catch (e) {
      console.error('Session load failed:', e);
    }

    try {
      if (window.supabase) {
        this.sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      }
    } catch (e) {
      console.error('❌ Supabase init error:', e);
      this.sb = null;
    }

    if (this.currentUser) {
      await this.loadAllData();
    }

    this.render();
  }

  // ===== الصلاحيات =====
  isManager() {
    return this.currentUser?.role === 'manager';
  }

  canView(view) {
    return this.isManager() || EMPLOYEE_VIEWS.includes(view);
  }

  // صفحة معالج البيع: المدير داخل صفحة الفواتير، والموظف في صفحة "عملية بيع جديدة"
  saleView() {
    return this.isManager() ? 'sales' : 'newSale';
  }

  // الخصم للمدير فقط
  canDiscount() {
    return this.isManager();
  }

  homeView() {
    return this.isManager() ? 'dashboard' : EMPLOYEE_VIEWS[0];
  }

  // ===== إعدادات المحل (انستجرام + رقم المحل) =====
  // تُحفظ في جدول settings على Supabase إن وُجد، وإلا على هذا الجهاز فقط
  applySettings(obj) {
    SHOP_EDITABLE_KEYS.forEach(k => {
      if (obj && typeof obj[k] === 'string' && obj[k].trim()) SHOP[k] = obj[k].trim();
    });
    this.rebuildDynamicDict();
  }

  // أسماء الخدمات بالإنجليزي + الاسم التجاري بالإنجليزي
  // الاسم الإنجليزي للخدمة: من عمود name_en، وإن لم يوجد العمود فمن الحفظ البديل
  serviceNameEn(sv) {
    if (!sv) return '';
    const map = this.serviceEnMap || {};
    return String(sv.name_en || map[sv.id] || '').trim();
  }

  loadServiceEnMap(fromDb) {
    let map = {};
    try { map = JSON.parse(localStorage.getItem('tireshop_service_en') || '{}') || {}; } catch (e) {}
    if (fromDb) {
      try { map = { ...map, ...(JSON.parse(fromDb) || {}) }; } catch (e) {}
    }
    this.serviceEnMap = map;
  }

  // حفظ بديل عند عدم وجود عمود name_en: في جدول settings، وإلا على هذا الجهاز
  async saveServiceEnFallback(serviceId, nameEn) {
    const map = { ...(this.serviceEnMap || {}) };
    if (nameEn) map[serviceId] = nameEn; else delete map[serviceId];
    this.serviceEnMap = map;
    try { localStorage.setItem('tireshop_service_en', JSON.stringify(map)); } catch (e) {}
    if (this.sb) {
      const { error } = await this.sb.from('settings').upsert([{ key: 'serviceNamesEn', value: JSON.stringify(map) }], { onConflict: 'key' });
      if (!error) return 'db';
    }
    return 'local';
  }

  // بعد حفظ خدمة: تأكد أن الاسم الإنجليزي حُفظ فعلاً وأخبر المستخدم أين
  async afterServiceSaved(serviceId, nameEn) {
    const columnMissing = (this.lastDropped || []).includes('name_en');
    if (!serviceId) return;
    if (columnMissing) {
      const where = await this.saveServiceEnFallback(serviceId, nameEn);
      if (nameEn) {
        showToast(where === 'db'
          ? 'تم حفظ الاسم الإنجليزي (في جدول الإعدادات)'
          : 'تم حفظ الاسم الإنجليزي على هذا الجهاز فقط — أضف عمود name_en في Supabase ليظهر على كل الأجهزة', where === 'db' ? 'success' : 'warning');
      }
    } else if (this.serviceEnMap && this.serviceEnMap[serviceId]) {
      // العمود موجود وحُفظ فيه: نحذف النسخة البديلة القديمة
      await this.saveServiceEnFallback(serviceId, null);
    }
    this.rebuildDynamicDict();
  }

  rebuildDynamicDict() {
    DYN_DICT = {};
    if (SHOP.nameEn) DYN_DICT[SHOP.name] = SHOP.nameEn;
    (this.services || []).forEach(sv => {
      const en = this.serviceNameEn(sv);
      if (sv.name && en) DYN_DICT[sv.name.trim()] = en;
    });
    resetTranslations();
  }

  async loadSettings() {
    this.loadServiceEnMap();
    try {
      this.applySettings(JSON.parse(localStorage.getItem('tireshop_settings') || '{}'));
    } catch (e) {}
    this.settingsInDb = false;
    if (!this.sb) return;
    try {
      const { data, error } = await this.sb.from('settings').select('*');
      if (error) {
        console.warn('⚠️ جدول settings غير متاح، الإعدادات محفوظة على هذا الجهاز فقط:', error.message);
        return;
      }
      this.settingsInDb = true;
      const obj = {};
      (data || []).forEach(r => { obj[r.key] = r.value; });
      this.loadServiceEnMap(obj.serviceNamesEn);
      this.applySettings(obj);
      localStorage.setItem('tireshop_settings', JSON.stringify(obj));
    } catch (e) {
      console.warn('Settings load error:', e);
    }
  }

  async saveSettings(values) {
    const clean = {};
    SHOP_EDITABLE_KEYS.forEach(k => { clean[k] = String(values[k] || '').trim(); });
    try { localStorage.setItem('tireshop_settings', JSON.stringify(clean)); } catch (e) {}
    this.applySettings(clean);
    if (!this.sb) return 'local';
    const rows = Object.entries(clean).map(([key, value]) => ({ key, value }));
    const { error } = await this.sb.from('settings').upsert(rows, { onConflict: 'key' });
    if (error) {
      console.warn('Settings save error:', error);
      this.settingsInDb = false;
      return 'local';
    }
    this.settingsInDb = true;
    return 'db';
  }

  async loadAllData() {
    if (!this.sb) {
      console.warn('⚠️ Supabase not available');
      await this.loadSettings();
      return;
    }

    // منع استدعاءات متعددة متزامنة
    if (this.isLoading) return;
    this.isLoading = true;

    try {
      const tables = [
        'tires', 'services', 'customers', 'appointments', 'sales',
        'suppliers', 'supplier_invoices', 'supplier_payments', 'expenses'
      ];

      // تحميل جميع الجداول بالتوازي بدلاً من التسلسل
      const results = await Promise.all(
        tables.map(table => 
          this.sb.from(table).select('*')
        )
      );

      results.forEach((result, idx) => {
        const table = tables[idx];
        const { data, error } = result;
        
        if (error) {
          console.error(`Error loading ${table}:`, error);
          return;
        }

        const mapped = data.map(row => rowFromDb(row, table));
        
        const propName = table
          .replace('supplier_invoices', 'supplierInvoices')
          .replace('supplier_payments', 'supplierPayments');
        
        this[propName] = mapped;
        console.log(`✅ Loaded ${mapped.length} from ${table}`);
      });
      await this.loadSettings();
      this.rebuildDynamicDict();
    } catch (e) {
      console.error('Data load error:', e);
    } finally {
      this.isLoading = false;
    }
  }

  // كتابة مرنة: تتجاوز الأعمدة غير الموجودة، وتحوّل null إلى نص فارغ إذا كان العمود لا يقبل الفراغ
  async writeWithRetry(dbData, doWrite) {
    const data = { ...dbData };
    const dropped = [];
    this.lastDropped = dropped;
    for (let attempt = 0; attempt < 8; attempt++) {
      const result = await doWrite(data);
      const error = result.error;
      if (!error) return { ...result, dropped };
      const msg = error.message || '';
      const missing = /'([^']+)' column/.exec(msg);
      if (missing && missing[1] in data) {
        console.warn(`⚠️ العمود "${missing[1]}" غير موجود في الجدول، تم تجاوزه`);
        dropped.push(missing[1]);
        delete data[missing[1]];
        continue;
      }
      const notNull = error.code === '23502' && /column "([^"]+)"/.exec(msg);
      if (notNull && notNull[1] in data && data[notNull[1]] === null) {
        data[notNull[1]] = '';
        continue;
      }
      return result;
    }
    return { error: { message: 'تعذّر الحفظ بعد عدة محاولات' } };
  }

  async addRecord(table, data) {
    if (!this.sb) {
      const id = uid();
      const record = { id, ...data, createdAt: new Date().toISOString() };
      this[table].unshift(record);
      return true;
    }

    try {
      const dbData = rowToDb(data, table);
      console.log(`📤 Sending to ${table}:`, dbData);
      console.log(`📤 Keys:`, Object.keys(dbData));
      
      // تحقق من البيانات
      if (!dbData || Object.keys(dbData).length === 0) {
        console.error('❌ No data to send!');
        showToast('بيانات فارغة!', 'error');
        return false;
      }
      
      // تحقق من أن البيانات ليست undefined/null
      Object.entries(dbData).forEach(([key, value]) => {
        console.log(`  ${key}: "${value}" (type: ${typeof value})`);
      });
      
      const { data: insertedData, error } = await this.writeWithRetry(dbData, d => this.sb.from(table).insert([d]));
      
      if (error) {
        console.error(`❌ Error adding to ${table}:`, error);
        console.error('Error message:', error.message);
        console.error('Error code:', error.code);
        console.error('Error details:', error.details);
        console.log('📤 Data tried to send:', dbData);
        const friendly = error.code === '23505'
          ? 'هذه القيمة مسجلة مسبقاً (مكررة) — ' + (error.details || '')
          : (error.message || 'خطأ');
        showToast(`❌ ${friendly}`, 'error');
        return false;
      }

      console.log('✅ Insert successful:', insertedData);
      await this.loadAllData();
      showToast(t('saved'), 'success');
      return true;
    } catch (e) {
      console.error('❌ Add record error:', e);
      console.error('Full error:', JSON.stringify(e));
      showToast(t('error'), 'error');
      return false;
    }
  }

  login(username, password, role) {
    const creds = {
      manager: { u: 'admin', p: 'admin123', name: 'المدير' },
      employee: { u: 'employee', p: 'emp123', name: 'الموظف' },
    };

  logout() {

    this.saleWizard = this.emptySaleWizard();

    sessionStorage.removeItem('tireshop_user');
    this.render();
  }

  // ===== SALES WIZARD (سلة متعددة: خدمات + إطارات) =====

  emptySaleWizard() {
    return {
      active: false,
      step: 1,
      tab: 'services',
      cart: [],
      warranty: 'noWarranty',
      paymentMethod: 'cash',
      discount: 0,
      discountType: 'amount',
      customerName: '',
      customerPhone: '',
      editingSaleId: null,
      editingInvoiceNumber: null,
      originalTireQty: {},
    };
  }

  // الكمية المتاحة للبيع = المخزون الحالي + ما كان في الفاتورة الأصلية (عند التعديل)
  availableStock(tireId) {
    const tire = this.tires.find(x => x.id === tireId);
    const stock = parseInt(tire?.stock) || 0;
    return stock + (this.saleWizard.originalTireQty?.[tireId] || 0);
  }

  startEditSale(saleId) {
    const sale = this.sales.find(x => x.id === saleId);
    if (!sale) return;

    let items = sale.items;
    if (typeof items === 'string') {
      try { items = JSON.parse(items); } catch (e) { items = null; }
    }

    const cart = [];
    if (Array.isArray(items) && items.length) {
      items.forEach((i, idx) => {
        const type = i.type === 'tire' || i.type === 'service' ? i.type : 'custom';
        const refId = i.refId || ('c' + idx);
        cart.push({
          key: type + ':' + refId, type, refId,
          description: i.description || '-',
          unitPrice: parseFloat(i.unitPrice ?? i.unit_price) || 0,
          quantity: parseFloat(i.quantity) || 1,
        });
      });
    } else if (sale.service_name) {
      // فاتورة قديمة بدون تفاصيل الأصناف: نحاول مطابقة خدمة، وإلا سطر حر
      const service = this.services.find(x => x.name === sale.service_name);
      const qty = parseFloat(sale.quantity) || 1;
      const unit = parseFloat(sale.unit_price);
      if (service && unit) {
        cart.push({ key: 'service:' + service.id, type: 'service', refId: service.id, description: service.name, unitPrice: unit, quantity: qty });
      } else {
        cart.push({ key: 'custom:legacy', type: 'custom', refId: 'legacy', description: sale.service_name,
          unitPrice: unit || parseFloat(sale.subtotal) || parseFloat(sale.total) || 0, quantity: unit ? qty : 1 });
      }
    }

    const originalTireQty = {};
    cart.filter(l => l.type === 'tire').forEach(l => {
      originalTireQty[l.refId] = (originalTireQty[l.refId] || 0) + l.quantity;
    });

    const pct = parseFloat(sale.discountPercent) || 0;
    const amt = parseFloat(sale.discountAmount) || 0;

    this.saleWizard = {
      ...this.emptySaleWizard(),
      active: true,
      cart,
      warranty: sale.warranty || 'noWarranty',
      paymentMethod: sale.paymentMethod || 'cash',
      discountType: pct > 0 ? 'percent' : 'amount',
      discount: pct > 0 ? pct : amt,
      customerName: sale.customerName || '',
      customerPhone: sale.customerPhone || '',
      editingSaleId: sale.id,
      editingInvoiceNumber: sale.invoiceNumber,
      originalTireQty,
    };
    this.switchView(this.saleView());
  }

  startNewSale() {
    this.saleWizard = { ...this.emptySaleWizard(), active: true };
    this.switchView(this.saleView());
  }

  cancelSale() {
    this.saleWizard = this.emptySaleWizard();
    this.switchView(this.saleView());
  }

  nextWizardStep() {
    if (this.saleWizard.step < 3) {
      this.saleWizard.step++;
      this.switchView(this.saleView());
    }
  }

  prevWizardStep() {
    if (this.saleWizard.step > 1) {
      this.saleWizard.step--;
      this.switchView(this.saleView());
    }
  }

  tireLabel(tire) {
    return [tire.brand, tire.model, tire.size].filter(Boolean).join(' ');
  }

  // أضف عنصر للسلة أو زد كميته
  addToCart(type, refId) {
    const cart = this.saleWizard.cart;
    const key = type + ':' + refId;
    const line = cart.find(l => l.key === key);

    if (type === 'tire') {
      const tire = this.tires.find(x => x.id === refId);
      if (!tire) return;
      const stock = this.availableStock(refId);
      const inCart = line ? line.quantity : 0;
      if (inCart + 1 > stock) {
        showToast(`المخزون المتاح من هذا الإطار: ${stock} فقط`, 'warning');
        return;
      }
      if (line) line.quantity++;
      else cart.push({ key, type, refId, description: this.tireLabel(tire), unitPrice: parseFloat(tire.sellingPrice) || 0, quantity: 1 });
    } else {
      const service = this.services.find(x => x.id === refId);
      if (!service) return;
      if (line) line.quantity++;
      else cart.push({ key, type, refId, description: service.name, unitPrice: parseFloat(service.price) || 0, quantity: 1 });
    }
    this.switchView(this.saleView());
  }

  changeCartQty(key, delta) {
    const cart = this.saleWizard.cart;
    const line = cart.find(l => l.key === key);
    if (!line) return;
    const next = line.quantity + delta;
    if (next < 1) {
      this.saleWizard.cart = cart.filter(l => l.key !== key);
    } else {
      if (line.type === 'tire') {
        const stock = this.availableStock(line.refId);
        if (next > stock) {
          showToast(`المخزون المتاح: ${stock} فقط`, 'warning');
          return;
        }
      }
      line.quantity = next;
    }
    this.switchView(this.saleView());
  }

  removeFromCart(key) {
    this.saleWizard.cart = this.saleWizard.cart.filter(l => l.key !== key);
    this.switchView(this.saleView());
  }

  discountLabel() {
    const { percent } = this.cartTotals();
    return percent > 0 ? `الخصم (${+percent.toFixed(2)}%)` : 'الخصم';
  }

  cartTotals() {
    const subtotal = this.saleWizard.cart.reduce((s, l) => s + l.unitPrice * l.quantity, 0);
    const w = this.saleWizard;
    const value = this.canDiscount() ? Math.max(parseFloat(w.discount) || 0, 0) : 0;
    const isPercent = w.discountType === 'percent';
    const percent = isPercent ? Math.min(value, 100) : 0;
    let discount = isPercent ? subtotal * percent / 100 : value;
    discount = Math.round(Math.min(discount, subtotal) * 1000) / 1000;
    return { subtotal, discount, percent, total: subtotal - discount };
  }

  // عناصر الفاتورة للطباعة/الواتساب (تدعم الفواتير القديمة ذات الخدمة الواحدة)
  getSaleItems(sale) {
    let items = sale.items;
    if (typeof items === 'string') {
      try { items = JSON.parse(items); } catch (e) { items = null; }
    }
    if (Array.isArray(items) && items.length) {
      return items.map(i => ({
        description: i.description || i.name || '-',
        quantity: parseFloat(i.quantity) || 1,
        unitPrice: parseFloat(i.unitPrice ?? i.unit_price) || 0,
      }));
    }
    if (sale.service_name) {
      const unit = parseFloat(sale.unit_price);
      if (unit) {
        return [{ description: sale.service_name, quantity: parseFloat(sale.quantity) || 1, unitPrice: unit }];
      }
      // فاتورة متعددة الأصناف بدون عمود items: سطر واحد بالمجموع قبل الخصم
      const sub = parseFloat(sale.subtotal) || parseFloat(sale.total) || 0;
      return [{ description: sale.service_name, quantity: 1, unitPrice: sub }];
    }
    return [];
  }

  normalizePhone(phone) {
    let p = String(phone || '').replace(/\D/g, '');
    if (p.startsWith('00')) p = p.slice(2);
    if (p.length === 8) p = '968' + p; // رقم عماني محلي
    return p;
  }

  // رسالة واتساب موحّدة (من المعالج ومن قائمة الفواتير)
  buildInvoiceMessage(d) {
    let msg = `🏪 *${SHOP.name}*\n`;
    msg += `السجل التجاري: ${SHOP.cr}\n`;
    msg += `📋 *فاتورة رقم:* ${d.invoiceNumber}\n`;
    msg += `التاريخ: ${fmtDate(d.date)}\n`;
    msg += `*العميل:* ${d.customerName || '-'}\n\n*التفاصيل:*\n`;
    d.items.forEach(i => {
      msg += `• ${i.description} × ${i.quantity} = ${fmtMoney(i.unitPrice * i.quantity)}\n`;
    });
    if (d.discount > 0) {
      msg += `\n*المجموع:* ${fmtMoney(d.subtotal)}\n*${d.discountLabel}:* ${fmtMoney(d.discount)}\n`;
    }
    msg += `\n*الإجمالي:* ${fmtMoney(d.total)} ر.ع\n`;
    if (d.paymentMethod) msg += `*طريقة الدفع:* ${t(d.paymentMethod)}\n`;
    const end = warrantyEndDate(d.date, d.warranty);
    if (end) msg += `\n🛡️ *${t(d.warranty)}* — ساري حتى ${fmtDate(end)}\n`;
    msg += `\n📞 ${SHOP.phone}`;
    if (instagramHandle()) msg += `\n📷 انستجرام: @${instagramHandle()}`;
    msg += `\n\nشكراً لتعاملك معنا 🙏`;
    return tr(msg);
  }

  buildWizardInvoiceMessage(invoiceNumber) {
    const { subtotal, discount, total } = this.cartTotals();
    const w = this.saleWizard;
    const original = w.editingSaleId ? this.sales.find(x => x.id === w.editingSaleId) : null;
    return this.buildInvoiceMessage({
      invoiceNumber, date: original?.createdAt || new Date().toISOString(),
      customerName: w.customerName, items: w.cart, subtotal, discount,
      discountLabel: this.discountLabel(), total, warranty: w.warranty, paymentMethod: w.paymentMethod,
    });
  }

  // يحاول الحفظ، وإذا رفضت قاعدة البيانات عموداً غير موجود يحذفه ويعيد المحاولة
  async insertSaleRow(row) {
    const data = { ...row };
    const dropped = [];
    for (let attempt = 0; attempt < 8; attempt++) {
      const { error } = await this.sb.from('sales').insert([data]);
      if (!error) return { ok: true, dropped };
      const m = /'([^']+)' column/.exec(error.message || '') || /column "?([a-z_]+)"? .*does not exist/.exec(error.message || '');
      if (m && m[1] in data) {
        dropped.push(m[1]);
        delete data[m[1]];
        continue;
      }
      console.error('❌ Sale insert error:', error);
      return { ok: false, error };
    }
    return { ok: false, error: { message: 'too many retries' } };
  }

  async saveSale(invoiceNumber) {
    const w = this.saleWizard;
    if (!w.cart.length) {
      showToast('السلة فارغة', 'warning');
      return false;
    }
    if (this.isSavingSale) return false;
    this.isSavingSale = true;

    const { subtotal, discount, percent, total } = this.cartTotals();
    const totalQty = w.cart.reduce((s, l) => s + l.quantity, 0);
    const summary = w.cart.map(l => `${l.description} ×${l.quantity}`).join('، ');
    const items = w.cart.map(l => ({
      type: l.type, refId: l.refId, description: l.description,
      quantity: l.quantity, unitPrice: l.unitPrice,
    }));
    const editingId = w.editingSaleId;
    invoiceNumber = w.editingInvoiceNumber || invoiceNumber || ('INV-' + Date.now());

    const row = {
      invoice_number: invoiceNumber,
      customer_name: w.customerName,
      customer_phone: w.customerPhone,
      payment_method: w.paymentMethod,
      warranty: w.warranty,
      service_name: summary,
      quantity: totalQty,
      unit_price: w.cart.length === 1 ? w.cart[0].unitPrice : null,
      subtotal: subtotal,
      discount_amount: discount,
      discount_percent: percent,
      total: total,
      items: items,
    };

    try {
      // فرق كميات الإطارات: الجديد − الأصلي (عند الفاتورة الجديدة الأصلي = 0)
      const stockDelta = {};
      w.cart.filter(l => l.type === 'tire').forEach(l => {
        stockDelta[l.refId] = (stockDelta[l.refId] || 0) + l.quantity;
      });
      Object.entries(w.originalTireQty || {}).forEach(([id, q]) => {
        stockDelta[id] = (stockDelta[id] || 0) - q;
      });

      if (!this.sb) {
        if (editingId) {
          const idx = this.sales.findIndex(x => x.id === editingId);
          if (idx > -1) this.sales[idx] = { ...this.sales[idx], ...rowFromDb({ ...row, created_at: this.sales[idx].createdAt }, 'sales'), id: editingId };
        } else {
          this.sales.unshift({ ...rowFromDb({ ...row, id: uid(), created_at: new Date().toISOString() }, 'sales') });
        }
        Object.entries(stockDelta).forEach(([id, d]) => {
          const tire = this.tires.find(x => x.id === id);
          if (tire && d) tire.stock = (parseInt(tire.stock) || 0) - d;
        });
      } else {
        const res = editingId
          ? await this.writeWithRetry(row, d => this.sb.from('sales').update(d).eq('id', editingId)).then(r => ({ ok: !r.error, error: r.error, dropped: [] }))
          : await this.insertSaleRow(row);
        if (!res.ok) {
          showToast('لم تُحفظ الفاتورة: ' + (res.error?.message || ''), 'error');
          return false;
        }
        if (res.dropped.length) console.warn('⚠️ أعمدة غير موجودة في جدول sales ولم تُحفظ:', res.dropped);

        // تحديث مخزون الإطارات بالفرق فقط
        for (const [id, d] of Object.entries(stockDelta)) {
          if (!d) continue;
          const tire = this.tires.find(x => x.id === id);
          if (!tire) continue;
          const newStock = Math.max(0, (parseInt(tire.stock) || 0) - d);
          const { error } = await this.sb.from('tires').update({ stock: newStock }).eq('id', id);
          if (error) {
            console.error('Stock update error:', error);
            showToast('حُفظت الفاتورة لكن تعذّر تحديث مخزون: ' + this.tireLabel(tire), 'error');
          }
        }
        await this.loadAllData();
      }

      showToast(editingId ? 'تم تعديل الفاتورة' : t('invoiceCreated'), 'success');
      if (!this.isManager()) this.lastSaleNumber = invoiceNumber;
      this.saleWizard = this.emptySaleWizard();
      this.switchView(this.saleView());
      return true;
    } finally {
      this.isSavingSale = false;
    }
  }

  sendWhatsApp() {
    const w = this.saleWizard;
    const invoiceNumber = w.editingInvoiceNumber || ('INV-' + Date.now());
    const phone = this.normalizePhone(w.customerPhone);

    this.saveSale(invoiceNumber);
  }

    if (this.currentUser?.role !== 'manager') {
      return '<div class="card"><p class="text-center" style="padding: 30px;">هذه الصفحة للمدير فقط</p></div>';
    }
    return `
      <div class="card" style="max-width: 640px;">
        <div class="card-head"><h3>⚙️ بيانات تظهر في الفاتورة</h3></div>

        <div class="summary-box" style="margin-bottom: 18px;">
          <div class="summary-row"><span>الاسم التجاري:</span><span>${esc(SHOP.name)}</span></div>
          <div class="summary-row"><span>رقم السجل التجاري:</span><span class="num">${esc(SHOP.cr)}</span></div>

        <div class="form-group">

        <div class="form-group">

        <div class="form-group">

        </div>

        <div class="modal-footer">
          <button class="btn btn-ghost" id="previewInvoiceBtn">🖨️ معاينة فاتورة تجريبية</button>
          <button class="btn btn-amber" id="saveSettingsBtn">💾 حفظ</button>
        </div>
      </div>
    `;

  bindShopSettingsEvents() {
    document.getElementById('saveSettingsBtn')?.addEventListener('click', async () => {
      const phone = document.getElementById('settingPhone').value.trim();
      const instagram = document.getElementById('settingInstagram').value.trim().replace(/^@/, '');
      if (!phone) {
        showToast('أدخل رقم المحل', 'error');
        return;
      }
      if (instagram && !/^[A-Za-z0-9._]+$/.test(instagram)) {
        showToast('اسم انستجرام يحتوي على أحرف غير مسموحة', 'error');
        return;
      }
      const nameEn = document.getElementById('settingNameEn').value.trim();
      const where = await this.saveSettings({ phone, instagram, nameEn });
      showToast(where === 'db' ? 'تم حفظ الإعدادات' : 'تم الحفظ على هذا الجهاز فقط', where === 'db' ? 'success' : 'warning');
      this.switchView('shopSettings');
    });
    document.getElementById('previewInvoiceBtn')?.addEventListener('click', () => {
      this.printSaleInvoice({
        invoiceNumber: 'INV-تجريبية', customerName: 'عميل تجريبي', customerPhone: '9xxxxxxx',
        createdAt: new Date().toISOString(), warranty: 'warranty6M', paymentMethod: 'cash',
        items: [{ description: 'مثال: إطار 205/55R16', quantity: 4, unitPrice: 30 }, { description: 'مثال: ترصيص', quantity: 4, unitPrice: 1 }],
        subtotal: 124, total: 124,
      });
    });
  }

  renderNewSaleView() {
    // شاشة التأكيد بعد الحفظ
    if (this.lastSaleNumber) {
      const sale = this.sales.find(x => x.invoiceNumber === this.lastSaleNumber);
      return `
        <div class="card sale-done">
          <div class="sale-done-icon">✅</div>
          <h2>تم حفظ الفاتورة</h2>
          <p class="num" style="font-size: 18px; margin: 6px 0 4px;">${esc(this.lastSaleNumber)}</p>
          ${sale ? `<p style="color: var(--text-600);">${esc(sale.customerName || '')} — الإجمالي <b class="num">${fmtMoney(sale.total)}</b> ر.ع</p>` : ''}
          <div class="sale-done-actions">
            ${sale ? `
              <button class="btn btn-blue" id="donePrintBtn">🖨️ طباعة الفاتورة</button>
              <button class="btn btn-green" id="doneWhatsappBtn">📱 إرسال واتساب</button>
            ` : ''}
            <button class="btn btn-amber" id="doneNewSaleBtn">➕ عملية بيع جديدة</button>
          </div>
        </div>
      `;
    }
    if (!this.saleWizard || !this.saleWizard.active) {
      this.saleWizard = { ...this.emptySaleWizard(), active: true };
    }
    return this.renderSalesWizardView();
  }

  bindNewSaleDoneEvents() {
    const sale = this.lastSaleNumber ? this.sales.find(x => x.invoiceNumber === this.lastSaleNumber) : null;
    document.getElementById('donePrintBtn')?.addEventListener('click', () => sale && this.printSaleInvoice(sale));
    document.getElementById('doneWhatsappBtn')?.addEventListener('click', () => {
      if (sale) this.sendInvoiceViaWhatsApp(sale, sale.customerPhone || '');
    });
    document.getElementById('doneNewSaleBtn')?.addEventListener('click', () => {
      this.lastSaleNumber = null;
      this.startNewSale();
    });
  }

  renderSalesWizardView() {
    if (this.saleWizard.step === 2) return this.renderWizardStep2();
    if (this.saleWizard.step === 3) return this.renderWizardStep3();
    return this.renderWizardStep1();
  }

  wizardProgress(step) {
    const labels = ['الأصناف', 'الدفع', 'العميل'];
    const w = this.saleWizard;
    return `
      ${w.editingSaleId ? `<div class="wz-edit-banner">✏️ تعديل الفاتورة رقم <b class="num">${esc(w.editingInvoiceNumber || '')}</b></div>` : ''}
      <div class="wz-steps">
        ${labels.map((l, i) => `
          <div class="wz-step ${i + 1 < step ? 'done' : ''} ${i + 1 === step ? 'active' : ''}">
            <span class="wz-num">${i + 1 < step ? '✓' : i + 1}</span> ${l}
          </div>
        `).join('')}
      </div>
    `;
  }

  renderCartPanel(editable) {
    const w = this.saleWizard;
    const { subtotal, discount, total } = this.cartTotals();
    const lines = w.cart.map(l => `
      <div class="cart-line">
        <div class="cart-desc">
          <span class="cart-type">${l.type === 'tire' ? '🛞' : l.type === 'custom' ? '📝' : '🔧'}</span>
          <div>
            <div class="cart-name">${esc(l.description)}</div>
            <div class="text-xs" style="color: var(--text-muted);">${fmtMoney(l.unitPrice)} × ${l.quantity}</div>
          </div>
        </div>
        ${editable ? `
          <div class="cart-qty">
            <button class="qty-mini" data-cart-dec="${l.key}">−</button>
            <span class="num">${l.quantity}</span>
            <button class="qty-mini" data-cart-inc="${l.key}">+</button>
          </div>
        ` : ''}
        <div class="cart-line-total num">${fmtMoney(l.unitPrice * l.quantity)}</div>
        ${editable ? `<button class="cart-remove" data-cart-remove="${l.key}" title="حذف">✕</button>` : ''}
      </div>
    `).join('');

    return `
      <div class="card cart-panel">
        <div class="card-head"><h3>🧾 الفاتورة (${w.cart.length} صنف)</h3></div>
        ${lines || '<p class="text-center" style="padding: 24px; color: var(--text-muted);">اضغط على خدمة أو إطار لإضافته</p>'}
        <div class="summary-box" style="margin-top: 12px;">
          <div class="summary-row"><span>المجموع:</span><span class="num">${fmtMoney(subtotal)}</span></div>
          ${discount > 0 ? `<div class="summary-row"><span>${this.discountLabel()}:</span><span class="num">− ${fmtMoney(discount)}</span></div>` : ''}
          <div class="summary-row total"><span>الإجمالي:</span><span class="num">${fmtMoney(total)}</span></div>
        </div>
      </div>
    `;
  }

  renderWizardStep1() {
    const w = this.saleWizard;
    const inCart = (type, id) => w.cart.find(l => l.key === type + ':' + id)?.quantity || 0;

    const serviceCards = this.services.map(s => {
      const q = inCart('service', s.id);
      return `
        <div class="service-card pick-card ${q ? 'selected' : ''}" data-add-item="service" data-ref-id="${s.id}" data-search="${esc(s.name).toLowerCase()}">
          ${q ? `<span class="pick-badge">${q}</span>` : ''}
          <h4>${esc(s.name)}</h4>
          <div class="price num">${fmtMoney(parseFloat(s.price) || 0)}</div>
        </div>
      `;
    }).join('');

    const tireCards = this.tires.map(tr => {
      const q = inCart('tire', tr.id);
      const stock = this.availableStock(tr.id);
      const label = this.tireLabel(tr);
      return `
        <div class="service-card pick-card ${q ? 'selected' : ''} ${stock <= 0 ? 'out' : ''}" ${stock > 0 ? `data-add-item="tire" data-ref-id="${tr.id}"` : ''} data-search="${esc(label).toLowerCase()}">
          ${q ? `<span class="pick-badge">${q}</span>` : ''}
          <h4>${esc(tr.brand || '')} ${esc(tr.model || '')}</h4>
          <div class="text-xs num" style="margin: 4px 0;">${esc(tr.size || '')}</div>
          <div class="price num">${fmtMoney(parseFloat(tr.sellingPrice) || 0)}</div>
          <div class="text-xs" style="color: ${stock > 0 ? 'var(--tread-green)' : 'var(--brake-red)'};">${stock > 0 ? 'المتوفر: ' + stock : 'نفد المخزون'}</div>
        </div>
      `;
    }).join('');

    const isTires = w.tab === 'tires';
    const list = isTires ? tireCards : serviceCards;
    const emptyMsg = isTires ? 'لا توجد إطارات في المخزون' : 'لا توجد خدمات. أضف خدمة من صفحة الخدمات أولاً.';

    return `
      <div class="wizard-container wz-wide">
        ${this.wizardProgress(1)}
        <div class="wz-layout">
          <div class="card">
            <div class="wz-tabs">
              <button class="wz-tab ${!isTires ? 'active' : ''}" data-wz-tab="services">🔧 الخدمات</button>
              <button class="wz-tab ${isTires ? 'active' : ''}" data-wz-tab="tires">🛞 الإطارات</button>
            </div>
            <input type="search" id="wzSearch" class="wz-search" placeholder="${isTires ? 'ابحث بالماركة أو المقاس...' : 'ابحث عن خدمة...'}">
            ${list ? `<div class="service-grid">${list}</div>` : `<p class="text-center" style="padding: 30px;">${emptyMsg}</p>`}
          </div>
          ${this.renderCartPanel(true)}
        </div>
        <div class="modal-footer">
          <button class="btn btn-ghost" id="cancelWizardBtn">إلغاء</button>
          <button class="btn btn-amber" id="nextStep1Btn" ${w.cart.length ? '' : 'disabled'}>التالي ←</button>
        </div>
      </div>
    `;
  }

  renderWizardStep2() {
    const w = this.saleWizard;
    const warranties = ['noWarranty', 'warranty3M', 'warranty6M', 'warranty12M'];
    return `
      <div class="wizard-container wz-wide">
        ${this.wizardProgress(2)}
        <div class="wz-layout">
          <div class="card">
            <div class="card-head"><h3>الضمان والدفع</h3></div>

            <h4 style="margin: 16px 0 10px; font-weight: 700;">الضمان:</h4>
            <div class="warranty-grid">
              ${warranties.map(k => `
                <div class="warranty-option ${w.warranty === k ? 'selected' : ''}" data-warranty="${k}">
                  <h4>${t(k)}</h4>
                </div>
              `).join('')}
            </div>

            <div class="grid-2" style="margin-top: 20px;">
              <div class="form-group">
                <label>طريقة الدفع</label>
                <select id="paymentMethodSelect">
                  ${['cash', 'card', 'check', 'transfer'].map(k => `<option value="${k}" ${w.paymentMethod === k ? 'selected' : ''}>${t(k)}</option>`).join('')}
                </select>
              </div>
${this.canDiscount() ? `
              <div class="form-group">
                <label>الخصم — اختياري</label>
                <div class="disc-row">
                  <div class="disc-toggle">
                    <button type="button" class="disc-type ${w.discountType !== 'percent' ? 'active' : ''}" data-disc-type="amount">ر.ع</button>
                    <button type="button" class="disc-type ${w.discountType === 'percent' ? 'active' : ''}" data-disc-type="percent">%</button>
                  </div>
                  <input type="number" id="discountInput" min="0" ${w.discountType === 'percent' ? 'max="100" step="1"' : 'step="0.1"'} value="${parseFloat(w.discount) || ''}" placeholder="${w.discountType === 'percent' ? 'مثال: 10' : 'مثال: 5'}">
                </div>
                <div class="text-xs" id="discountHint" style="margin-top: 6px; color: var(--text-muted);"></div>
              </div>` : ''}
            </div>
          </div>
          <div id="wzCartBox">${this.renderCartPanel(false)}</div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-ghost" id="prevStep2Btn">→ رجوع</button>
          <button class="btn btn-amber" id="nextStep2Btn">التالي ←</button>
        </div>
      </div>
    `;
  }

  renderWizardStep3() {
    const w = this.saleWizard;
    return `
      <div class="wizard-container wz-wide">
        ${this.wizardProgress(3)}
        <div class="wz-layout">
          <div class="card">
            <div class="card-head"><h3>${t('customerInfo')}</h3></div>
            <div class="form-group">
              <label>${t('customerName')} *</label>
              <input type="text" id="customerNameInput" list="wzCustomersList" value="${esc(w.customerName)}" placeholder="اكتب الاسم أو اختر عميلاً مسجلاً">
              <datalist id="wzCustomersList">
                ${this.customers.map(c => `<option value="${esc(c.name)}">${esc(c.phone || '')}</option>`).join('')}
              </datalist>
            </div>
            <div class="form-group">
              <label>${t('customerPhone')} *</label>
              <input type="tel" id="customerPhoneInput" value="${esc(w.customerPhone)}" placeholder="9xxxxxxx">
            </div>
            <div class="summary-box">
              <div class="summary-row"><span>الضمان:</span><span>${t(w.warranty)}</span></div>
              <div class="summary-row"><span>طريقة الدفع:</span><span>${t(w.paymentMethod)}</span></div>
            </div>
          </div>
          ${this.renderCartPanel(false)}
        </div>
        <div class="modal-footer">
          <button class="btn btn-ghost" id="prevStep3Btn">→ رجوع</button>
          <button class="btn btn-blue" id="saveInvoiceBtn" style="flex: 1;">${icon('save')} ${w.editingSaleId ? 'حفظ التعديلات' : t('saveSale')}</button>
          <button class="btn btn-green" id="sendWhatsappBtn" style="flex: 1;">${icon('whatsapp')} حفظ وإرسال واتساب</button>
        </div>
      </div>
    `;
  }

  render() {
    const app = document.getElementById('app');
    
    if (!this.currentUser) {
      app.innerHTML = this.renderLoginView();
      this.bindLoginEvents();
      return;
    }

    app.innerHTML = this.renderShell();
    this.switchView(this.currentView);
  }

  renderShell() {
    const initials = tr(this.currentUser.name).trim().charAt(0);
    
    let navItems = [
      ['dashboard', t('dashboard'), 'dashboard'],
      ['services', t('services'), 'services'],
      ['customers', t('customers'), 'customers'],
      ['tires', t('tires'), 'tires'],
      ['appointments', t('appointments'), 'appointments'],
      ['sales', t('sales'), 'sales'],
      ['reports', t('reports'), 'reports'],
      ['fixedExpenses', `💰 ${t('fixedExpenses')}`, 'fixedExpenses'],
      ['dailyExpenses', `💸 ${t('dailyExpenses')}`, 'dailyExpenses'],
      ['importInventory', '📦 استيراج المخزون', 'importInventory'],
    ];

    if (this.currentUser.role === 'manager') {
      navItems.push(['suppliers', t('suppliers'), 'suppliers']);
      navItems.push(['supplierInvoices', t('supplierInvoices'), 'supplierInvoices']);
      navItems.push(['supplierPayments', t('supplierPayments'), 'supplierPayments']);
      navItems.push(['supplierSummary', t('supplierSummary'), 'supplierSummary']);
      navItems.push(['shopSettings', '⚙️ إعدادات المحل', 'shopSettings']);
    }
    if (!this.isManager()) {
      navItems.unshift(['newSale', 'عملية بيع جديدة', 'sales']);
    }
    navItems = navItems.filter(([view]) => this.canView(view));

    return `
      <div class="shell">
        <aside class="sidebar">
          <div class="brand">
            <div class="brand-mark">🏪</div>
            <div class="brand-text">
              <h1>ورشتي</h1>
              <p>${esc(SHOP.name)}</p>
            </div>
          </div>

          <nav class="side-nav">
            ${navItems.map(([view, label, ico]) => `
              <button class="side-link" data-view="${view}">
                ${icon(ico)}
                <span>${label}</span>
              </button>
            `).join('')}
          </nav>

          ${this.isManager() ? `
          <div class="emp-link-box">
            <a class="emp-link" href="employee.html" target="_blank" rel="noopener" title="تفتح في تبويب جديد">
              <span>👔</span><span>صفحة الموظف</span><span class="emp-link-arrow">↗</span>
            </a>
            <button class="emp-copy" id="copyEmpLinkBtn" title="نسخ رابط صفحة الموظف">📋</button>
          </div>` : ''}

          <div class="side-foot">
            <div class="user-chip">
              <div class="user-avatar">${esc(initials)}</div>
              <div class="user-meta">
                <p>${esc(this.currentUser.name)}</p>
                <span>${this.currentUser.role === 'manager' ? t('manager') : t('employee')}</span>
              </div>
            </div>
            <button class="lang-btn" id="langBtn">${currentLang === 'ar' ? 'EN' : 'AR'}</button>
            <button class="logout-btn" id="logoutBtn">${icon('logout')} ${t('logout')}</button>
          </div>
        </aside>

        <main class="main">
          <div class="page-title" id="pageTitle"></div>
          <div id="content"></div>
        </main>
      </div>
    `;
  }

  switchView(view) {
    if (this.currentUser && !this.canView(view)) {
      view = this.homeView();
    }
    if (view !== 'newSale' && this.currentView === 'newSale') {
      this.lastSaleNumber = null;
    }
    this.currentView = view;
    
    document.querySelectorAll('.side-link').forEach(b => {
      b.classList.toggle('active', b.dataset.view === view);
    });

    const titles = {
      dashboard: t('dashboard'),
      tires: t('tires'),
      services: t('services'),
      customers: t('customers'),
      appointments: t('appointments'),
      sales: t('sales'),
      reports: t('reports'),
      fixedExpenses: `💰 ${t('fixedExpenses')}`,
      dailyExpenses: `💸 ${t('dailyExpenses')}`,
      suppliers: t('suppliers'),
      supplierInvoices: t('supplierInvoices'),
      supplierPayments: t('supplierPayments'),
      supplierSummary: t('supplierSummary'),
      importInventory: '📦 استيراج المخزون',
      shopSettings: '⚙️ إعدادات المحل',
      newSale: '🧾 عملية بيع جديدة',
    };
    
    document.getElementById('pageTitle').textContent = titles[view] || t('dashboard');

    const renderers = {
      dashboard: () => this.renderDashboard(),
      sales: () => this.renderSalesView(),
      services: () => this.renderServicesView(),
      customers: () => this.renderCustomersView(),
      tires: () => this.renderTiresView(),
      appointments: () => this.renderAppointmentsView(),
      reports: () => this.renderReportsView(),
      fixedExpenses: () => this.renderFixedExpensesView(),
      dailyExpenses: () => this.renderDailyExpensesView(),
      suppliers: () => this.renderSuppliersView(),
      supplierInvoices: () => this.renderSupplierInvoicesView(),
      supplierPayments: () => this.renderSupplierPaymentsView(),
      supplierSummary: () => this.renderSupplierSummaryView(),
      importInventory: () => this.renderImportInventoryView(),
      shopSettings: () => this.renderShopSettingsView(),
      newSale: () => this.renderNewSaleView(),
    };

    const content = document.getElementById('content');
    content.innerHTML = (renderers[view] || (() => ''))();
    
    this.bindViewEvents(view);
  }

  bindLoginEvents() {
    const submit = () => {
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value;
      if (!u || !p) {
        showToast('أدخل المستخدم وكلمة المرور', 'warning');
        return;
      }
      this.login(u, p, APP_MODE);
    };
    document.getElementById('doLoginBtn')?.addEventListener('click', submit);
    ['username', 'password'].forEach(id => {
      document.getElementById(id)?.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
    });
  }

  // ===== MODAL EDIT FUNCTIONS =====

  showEditSupplierModal(supplier) {
    const content = `
      <div class="form-group">
        <label>الاسم *</label>
        <input type="text" id="editSupplierName" value="${esc(supplier.name)}">
      </div>
      <div class="form-group">
        <label>الهاتف</label>
        <input type="tel" id="editSupplierPhone" value="${esc(supplier.phone || '')}">
      </div>

  getSalesByPeriod(period, customFromDate = null, customToDate = null) {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    
    let fromDate = new Date(today);
    let toDate = new Date(today);
    toDate.setHours(23, 59, 59, 999);

    if (period === 'yesterday') {
      fromDate = new Date(today);
      fromDate.setDate(today.getDate() - 1);
      toDate = new Date(fromDate);
      toDate.setHours(23, 59, 59, 999);
    } else if (period === 'week') {
      fromDate = new Date(today);
      fromDate.setDate(today.getDate() - 6);
      toDate = new Date(today);
      toDate.setHours(23, 59, 59, 999);
    } else if (period === 'month') {
      fromDate = new Date(today.getFullYear(), today.getMonth(), 1);
      toDate = new Date(today);
      toDate.setHours(23, 59, 59, 999);
    } else if (period === 'custom' && customFromDate && customToDate) {
      fromDate = new Date(customFromDate);
      fromDate.setHours(0, 0, 0, 0);
      toDate = new Date(customToDate);
      toDate.setHours(23, 59, 59, 999);
    } else if (period === 'custom') {
      return [];
    }

    return this.sales.filter(sale => {
      const saleDate = new Date(sale.createdAt);
      return saleDate >= fromDate && saleDate <= toDate;
    });
  }

  filterByDate(data, dateField) {
    const specificDate = document.getElementById('filterSpecificDate')?.value;
    const fromDate = document.getElementById('filterFromDate')?.value;
    const toDate = document.getElementById('filterToDate')?.value;

    return data.filter(item => {
      const itemDate = item[dateField];
      if (!itemDate) return true;

      const date = new Date(itemDate).toISOString().split('T')[0];

      if (specificDate && date !== specificDate) return false;
      if (fromDate && date < fromDate) return false;
      if (toDate && date > toDate) return false;

      return true;
    });
  }

  sendInvoiceViaWhatsApp(sale, phone) {
    const items = this.getSaleItems(sale);
    const discount = parseFloat(sale.discountAmount) || 0;
    const pct = parseFloat(sale.discountPercent) || 0;
    const message = this.buildInvoiceMessage({
      invoiceNumber: sale.invoiceNumber, date: sale.createdAt, customerName: sale.customerName, items,
      subtotal: parseFloat(sale.subtotal) || (parseFloat(sale.total) || 0) + discount,
      discount, discountLabel: pct > 0 ? `الخصم (${+pct.toFixed(2)}%)` : 'الخصم',
      total: parseFloat(sale.total) || 0, warranty: sale.warranty, paymentMethod: sale.paymentMethod,
    });

    const encodedMessage = encodeURIComponent(message);
    const cleanPhone = this.normalizePhone(phone);
    const whatsappUrl = `https://wa.me/${cleanPhone}?text=${encodedMessage}`;
    
    window.open(whatsappUrl, '_blank');
  }

  async updateRecord(table, id, data) {
    if (!this.sb) {
      const idx = this[table].findIndex(x => x.id === id);
      if (idx > -1) {
        this[table][idx] = { ...this[table][idx], ...data };
      }
      return true;
    }

    try {
      const dbData = rowToDb(data, table);
      const { error } = await this.writeWithRetry(dbData, d => this.sb.from(table).update(d).eq('id', id));
      
      if (error) {
        console.error(`Error updating ${table}:`, error);
        showToast('خطأ في التحديث: ' + (error.code === '23505' ? 'قيمة مكررة' : (error.message || '')), 'error');
        return false;
      }

      await this.loadAllData();
      showToast('تم التحديث', 'success');
      return true;
    } catch (e) {
      console.error('Update record error:', e);
      showToast('خطأ', 'error');
      return false;
    }
  }

  async deleteRecord(table, id) {
    if (!this.sb) {
      const idx = this[table].findIndex(x => x.id === id);
      if (idx > -1) {
        this[table].splice(idx, 1);
      }
      return true;
    }

    try {
      const { error } = await this.sb.from(table).delete().eq('id', id);
      
      if (error) {
        console.error(`Error deleting from ${table}:`, error);
        return false;
      }

      await this.loadAllData();
      showToast('تم الحذف', 'success');
      return true;
    } catch (e) {
      console.error('Delete record error:', e);
      return false;
    }
  }

      phone: val('Phone') || null,

  validCustomer(data) {

      showToast('صيغة البريد الإلكتروني غير صحيحة (أو اتركه فارغاً)', 'error');
      return false;
    }
    return true;

        }

          supplier_id: supplierId,
          invoice_number: invoiceNumber,
          total_amount: totalAmount,
          paid_amount: 0,
          remaining_amount: totalAmount,
          invoice_date: new Date().toISOString()
        };

  bindSupplierPaymentsEvents() {
    const addBtn = document.getElementById('addPaymentBtn');
    if (addBtn && !addBtn.hasListener) {
      addBtn.hasListener = true;
      addBtn.addEventListener('click', () => {
        const invoiceId = document.getElementById('paymentInvoice').value;
        const amount = parseFloat(document.getElementById('paymentAmount').value) || 0;
        const notes = document.getElementById('paymentNotes').value;
        const invoice = this.supplierInvoices.find(i => i.id === invoiceId);

        if (!invoiceId || !amount || !invoice) {
          showToast('أدخل البيانات', 'error');
          return;
        }

        if (amount > invoice.remainingAmount) {
          showToast('المبلغ أكبر من المتبقي', 'error');
          return;
        }

        this.addRecord('supplier_payments', {
          supplier_invoice_id: invoiceId,
          payment_amount: amount,
          payment_date: new Date().toISOString(),
          notes
        }).then(() => {
          // تحديث المبلغ المدفوع والمتبقي
          const newPaidAmount = (invoice.paidAmount || 0) + amount;
          const newRemainingAmount = invoice.totalAmount - newPaidAmount;
          
          this.updateRecord('supplier_invoices', invoiceId, {
            paid_amount: newPaidAmount,
            remaining_amount: newRemainingAmount
          }).then(() => {
            document.getElementById('paymentInvoice').value = '';
            document.getElementById('paymentAmount').value = '';
            document.getElementById('paymentNotes').value = '';
            this.switchView('supplierPayments');
          });
        });
      });
    }
  }

  bindSalesWizardEvents() {
    document.getElementById('newSaleBtn')?.addEventListener('click', () => this.startNewSale());
    const w = this.saleWizard;
    const wizardActive = !!(w && w.active);

    if (wizardActive) {
      const root = document.getElementById('content');

      // أزرار عامة للسلة (إضافة / زيادة / نقص / حذف / تبويب)
      root.querySelectorAll('[data-add-item]').forEach(el => {
        el.addEventListener('click', () => this.addToCart(el.dataset.addItem, el.dataset.refId));
      });
      root.querySelectorAll('[data-cart-inc]').forEach(el => el.addEventListener('click', () => this.changeCartQty(el.dataset.cartInc, 1)));
      root.querySelectorAll('[data-cart-dec]').forEach(el => el.addEventListener('click', () => this.changeCartQty(el.dataset.cartDec, -1)));
      root.querySelectorAll('[data-cart-remove]').forEach(el => el.addEventListener('click', () => this.removeFromCart(el.dataset.cartRemove)));
      root.querySelectorAll('[data-wz-tab]').forEach(el => el.addEventListener('click', () => {
        w.tab = el.dataset.wzTab;
        this.switchView(this.saleView());
      }));

      // بحث فوري بدون إعادة رسم الصفحة
      document.getElementById('wzSearch')?.addEventListener('input', (e) => {
        const q = e.target.value.trim().toLowerCase();
        root.querySelectorAll('.pick-card').forEach(card => {
          card.style.display = !q || (card.dataset.search || '').includes(q) ? '' : 'none';
        });
      });

      document.getElementById('cancelWizardBtn')?.addEventListener('click', () => {
        const msg = w.editingSaleId ? 'إلغاء التعديل؟ ستبقى الفاتورة كما كانت.' : 'إلغاء الفاتورة وحذف الأصناف المختارة؟';
        if (w.cart.length && !confirm(msg)) return;
        this.cancelSale();
      });
      document.getElementById('nextStep1Btn')?.addEventListener('click', () => this.nextWizardStep());

      // الخطوة 2
      root.querySelectorAll('.warranty-option').forEach(opt => {
        opt.addEventListener('click', () => {
          root.querySelectorAll('.warranty-option').forEach(o => o.classList.remove('selected'));
          opt.classList.add('selected');
          w.warranty = opt.dataset.warranty;
        });
      });
      document.getElementById('paymentMethodSelect')?.addEventListener('change', (e) => {
        w.paymentMethod = e.target.value;
      });
      const refreshDiscount = () => {
        const box = document.getElementById('wzCartBox');
        if (box) box.innerHTML = this.renderCartPanel(false);
        const hint = document.getElementById('discountHint');
        const { discount, percent, subtotal } = this.cartTotals();
        if (hint) {
          hint.textContent = !discount ? ''
            : w.discountType === 'percent'
              ? `= ${fmtMoney(discount)} ر.ع`
              : `= ${subtotal ? +(discount / subtotal * 100).toFixed(2) : 0}% من المجموع`;
        }
        const raw = parseFloat(w.discount) || 0;
        if (w.discountType === 'percent' && raw > 100) showToast('أقصى نسبة خصم 100%', 'warning');
        if (w.discountType !== 'percent' && raw > subtotal) showToast('الخصم أكبر من المجموع', 'warning');
      };
      document.getElementById('discountInput')?.addEventListener('input', (e) => {
        w.discount = parseFloat(e.target.value) || 0;
        refreshDiscount();
      });
      root.querySelectorAll('[data-disc-type]').forEach(btn => btn.addEventListener('click', () => {
        if (w.discountType === btn.dataset.discType) return;
        w.discountType = btn.dataset.discType;
        w.discount = 0;
        this.switchView(this.saleView());
        document.getElementById('discountInput')?.focus();
      }));
      if (document.getElementById('discountInput')) refreshDiscount();
      document.getElementById('prevStep2Btn')?.addEventListener('click', () => this.prevWizardStep());
      document.getElementById('nextStep2Btn')?.addEventListener('click', () => this.nextWizardStep());

      // الخطوة 3
      const nameInput = document.getElementById('customerNameInput');
      const phoneInput = document.getElementById('customerPhoneInput');
      nameInput?.addEventListener('input', (e) => {
        w.customerName = e.target.value;
        const match = this.customers.find(c => c.name === e.target.value);
        if (match && match.phone && phoneInput) {
          phoneInput.value = match.phone;
          w.customerPhone = match.phone;
        }
      });
      phoneInput?.addEventListener('input', (e) => { w.customerPhone = e.target.value; });

      const checkCustomer = () => {
        if (!w.customerName.trim() || !w.customerPhone.trim()) {
          showToast('أدخل اسم العميل ورقم الهاتف', 'warning');
          return false;
        }
        return true;
      };
      document.getElementById('saveInvoiceBtn')?.addEventListener('click', () => {
        if (checkCustomer()) this.saveSale();
      });
      document.getElementById('sendWhatsappBtn')?.addEventListener('click', () => {
        if (checkCustomer()) this.sendWhatsApp();
      });
      document.getElementById('prevStep3Btn')?.addEventListener('click', () => this.prevWizardStep());
    }

    // معالجات التصفية السريعة للمبيعات
    document.querySelectorAll('[data-period-filter]').forEach(btn => {
      btn.addEventListener('click', () => {
        const period = btn.dataset.periodFilter;
        
        if (period === 'custom') {
          const picker = document.getElementById('customDatePicker');
          if (picker) {
            picker.style.display = picker.style.display === 'none' ? 'flex' : 'none';
          }
        } else {
          this.currentSalesPeriod = period;
          this.currentCustomFromDate = null;
          this.currentCustomToDate = null;
          this.switchView(this.saleView());
        }
      });
    });

    document.getElementById('applyCustomPeriod')?.addEventListener('click', () => {
      const fromInput = document.getElementById('customFromDate')?.value;
      const toInput = document.getElementById('customToDate')?.value;
      
      if (!fromInput || !toInput) {
        showToast('اختر التاريخين', 'warning');
        return;
      }
      
      this.currentSalesPeriod = 'custom';
      this.currentCustomFromDate = fromInput;
      this.currentCustomToDate = toInput;
      this.switchView(this.saleView());
    });
  }
