  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Almarai', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      padding: 40px;
      max-width: 600px;
      width: 100%;
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
      text-align: center;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      color: #555;
      margin-bottom: 8px;
      font-weight: bold;
    }
    input[type="text"], input[type="number"], select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 14px;
      font-family: 'Almarai', sans-serif;
    }
    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: opacity 0.3s;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 5px;
      text-align: center;
      font-weight: bold;
      display: none;
    }
    .status.success {
      background: #4caf50;
      color: white;
      display: block;
    }
    .status.error {
      background: #f44336;
      color: white;
      display: block;
    }
    .status.loading {
      background: #2196f3;
      color: white;
      display: block;
    }
    .tires-preview {
      background: #f5f5f5;
      border: 1px solid #ddd;
      border-radius: 5px;
      padding: 15px;
      margin-top: 20px;
      max-height: 300px;
      overflow-y: auto;
    }
    .tire-item {
      padding: 8px;
      background: white;
      margin-bottom: 8px;
      border-radius: 3px;
      border-left: 3px solid #667eea;
      font-size: 13px;
    }
    .progress-bar {
      width: 100%;
      height: 6px;
      background: #ddd;
      border-radius: 3px;
      margin-top: 10px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: #4caf50;
      width: 0%;
      transition: width 0.3s;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔧 أداة استيراد الإطارات</h1>
    
    <div class="form-group">
      <label>اختر المورد:</label>
      <select id="supplierSelect">
        <option value="">جاري تحميل الموردين...</option>
      </select>
    </div>

    <div class="form-group">
      <label>سعر التكلفة (اختياري - للجميع):</label>
      <input type="number" id="costPrice" step="0.01" placeholder="اترك فارغاً للقيمة الافتراضية">
    </div>

    <button onclick="importTires()">📥 استيراد 30 إطار</button>
    
    <div id="status" class="status"></div>
    
    <div class="progress-bar" id="progressBar" style="display:none;">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div id="tiresPreview" class="tires-preview" style="display:none;">
      <h3>📋 البيانات التي ستُضاف:</h3>
      <div id="tiresList"></div>
    </div>
  </div>

  <script>

      {"name": "ATLANDER  215/55/R17", "size": "215/55/R17", "brand": "ATLANDER", "model": "2026", "quantity": 16, "selling_price": 21.2},

      {"name": "ATLANDER  245/45/R20", "size": "245/45/R20", "brand": "ATLANDER", "model": "2026", "quantity": 8, "selling_price": 29.0},
      {"name": "ATLANDER  275/60/R20", "size": "275/60/R20", "brand": "ATLANDER", "model": "2026", "quantity": 4, "selling_price": 44.0}
    ];

    // تحميل الموردين عند فتح الصفحة
    async function loadSuppliers() {
      try {
        const { data } = await sb.from('suppliers').select('id, name');
        const select = document.getElementById('supplierSelect');
        select.innerHTML = '<option value="">اختر المورد:</option>';
        
        if (data && data.length > 0) {
          data.forEach(supplier => {
            const option = document.createElement('option');
            option.value = supplier.id;
            option.textContent = supplier.name;
            select.appendChild(option);
          });
        } else {
          select.innerHTML += '<option disabled>لا توجد موردين - أضف مورد أولاً</option>';
        }
      } catch (error) {
        showStatus('❌ خطأ في تحميل الموردين: ' + error.message, 'error');
      }
    }

    async function importTires() {
      const supplierId = document.getElementById('supplierSelect').value;
      const costPrice = parseFloat(document.getElementById('costPrice').value) || 0;

      if (!supplierId) {
        showStatus('❌ يرجى اختيار مورد أولاً', 'error');
        return;
      }

      showStatus('⏳ جاري الاستيراد...', 'loading');
      document.getElementById('progressBar').style.display = 'block';
      
      let successful = 0;
      let failed = 0;

      for (let i = 0; i < tiresData.length; i++) {
        const tire = tiresData[i];
        
        try {
          const { error } = await sb.from('tires').insert([{
            name: tire.name,
            size: tire.size,
            brand: tire.brand,
            model: tire.model,
            quantity: tire.quantity,
            selling_price: tire.selling_price,
            cost_price: costPrice,
            supplier_id: supplierId
          }]);

          if (error) {
            console.error(`خطأ في ${tire.name}:`, error);
            failed++;
          } else {
            successful++;
          }
        } catch (error) {
          console.error(`خطأ في ${tire.name}:`, error);
          failed++;
        }

        // تحديث شريط التقدم
        const progress = ((i + 1) / tiresData.length) * 100;
        document.getElementById('progressFill').style.width = progress + '%';
      }

      document.getElementById('progressBar').style.display = 'none';
      
      if (failed === 0) {
        showStatus(`✅ تم استيراد ${successful} إطار بنجاح!`, 'success');
      } else {
        showStatus(`⚠️ تم استيراد ${successful} إطار | فشل: ${failed}`, 'error');
      }
    }

    function showStatus(message, type) {
      const statusEl = document.getElementById('status');
      statusEl.textContent = message;
      statusEl.className = 'status ' + type;
    }

    // تحميل الموردين عند فتح الصفحة
    window.addEventListener('load', loadSuppliers);
  </script>
</body>
</html>
