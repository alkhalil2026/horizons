    }
    .button-group {
      display: flex;
      gap: 10px;
    }
    button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.3s;
      font-family: 'Almarai', sans-serif;
    }
    .btn-import {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

    }
    .btn-preview {
      background: #f5f5f5;
      color: #333;
      border: 2px solid #ddd;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 5px;
      text-align: center;
      font-weight: bold;
      display: none;
    }
    .status.success {
      background: #4caf50;
      color: white;
      display: block;
    }
    .status.error {
      background: #f44336;
      color: white;
      display: block;
    }
    .status.loading {
      background: #2196f3;
      color: white;
      display: block;
    }
    .progress-bar {
      width: 100%;
      height: 8px;
      background: #ddd;
      border-radius: 4px;
      margin-top: 15px;
      overflow: hidden;
      display: none;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
      width: 0%;
      transition: width 0.3s;
    }
    .progress-text {
      text-align: center;
      font-size: 12px;
      color: #666;
      margin-top: 5px;
    }
    .tires-preview {
      background: #f5f5f5;
      border: 1px solid #ddd;
      border-radius: 5px;
      padding: 15px;
      margin-top: 20px;
      max-height: 400px;
      overflow-y: auto;
      display: none;
    }
    .tires-preview.show {
      display: block;
    }
    .preview-header {
      font-weight: bold;
      color: #333;
      margin-bottom: 10px;
    }
    .tire-item {
      padding: 8px;
      background: white;
      margin-bottom: 6px;
      border-radius: 3px;
      border-left: 3px solid #667eea;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
    }
    .tire-name {
      flex: 1;
    }
    .tire-qty {
      color: #f44336;
      font-weight: bold;
      margin: 0 10px;
    }
    .tire-price {
      color: #4caf50;
      font-weight: bold;
    }
    .stats {
      background: #fff3cd;
      border-left: 4px solid #ffc107;
      padding: 15px;
      border-radius: 5px;
      margin-top: 20px;
      display: none;
    }
    .stats.show {
      display: block;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      font-size: 14px;
    }
    .stat-label { color: #666; }
    .stat-value { font-weight: bold; color: #333; }
  </style>
</head>
<body>

      ℹ️ سيتم إضافة الإطارات بسعر البيع المحدد والكمية المتوفرة
    </div>

    <div class="form-group">
      <label>💰 سعر التكلفة (اختياري - للجميع):</label>
      <input type="number" id="costPrice" step="0.01" placeholder="اترك فارغاً للقيمة الافتراضية (0)">

    <div class="button-group">
      <button class="btn-preview" onclick="showPreview()">👁️ معاينة</button>
      <button class="btn-import" onclick="importTires()" id="importBtn">📥 استيراد الآن</button>
    </div>
    
    <div id="status" class="status"></div>
    
    <div class="progress-bar" id="progressBar">
      <div class="progress-fill" id="progressFill"></div>

    <div id="tiresPreview" class="tires-preview">
      <div class="preview-header">📋 البيانات التي ستُضاف:</div>
      <div id="tiresList"></div>
    </div>

    <div id="stats" class="stats">
      <div class="stat-row">
        <span class="stat-label">📊 إجمالي الإطارات:</span>
        <span class="stat-value" id="totalTires">30</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">📦 الكمية الإجمالية:</span>
        <span class="stat-value" id="totalQuantity">0</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">💵 متوسط السعر:</span>
        <span class="stat-value" id="avgPrice">0</span>
      </div>
    </div>
  </div>

  <script>

      {"name": "ATLANDER  275/60/R20", "size": "275/60/R20", "brand": "ATLANDER", "model": "2026", "quantity": 4, "selling_price": 44.0}
    ];

    function showPreview() {
      const previewEl = document.getElementById('tiresPreview');
      const listEl = document.getElementById('tiresList');
      const statsEl = document.getElementById('stats');
      
      if (previewEl.classList.contains('show')) {
        previewEl.classList.remove('show');
        statsEl.classList.remove('show');
      } else {
        let html = '';
        let totalQty = 0;
        let totalPrice = 0;
        
        tiresData.forEach(tire => {
          html += `
            <div class="tire-item">
              <span class="tire-name">${tire.name}</span>
              <span class="tire-qty">×${tire.quantity}</span>
              <span class="tire-price">${tire.selling_price.toFixed(2)}</span>
            </div>
          `;
          totalQty += tire.quantity;
          totalPrice += tire.selling_price;
        });
        
        listEl.innerHTML = html;
        document.getElementById('totalQuantity').textContent = totalQty;
        document.getElementById('avgPrice').textContent = (totalPrice / tiresData.length).toFixed(2);
        
        previewEl.classList.add('show');
        statsEl.classList.add('show');
      }
    }

    async function importTires() {
      const costPrice = parseFloat(document.getElementById('costPrice').value) || 0;
      const importBtn = document.getElementById('importBtn');
      
      importBtn.disabled = true;
      showStatus('⏳ جاري الاستيراد...', 'loading');
      document.getElementById('progressBar').style.display = 'block';
      
      let successful = 0;
      let failed = 0;

      for (let i = 0; i < tiresData.length; i++) {
        const tire = tiresData[i];
        
        try {
          const { error } = await sb.from('tires').insert([{
            name: tire.name,
            size: tire.size,
            brand: tire.brand,
            model: tire.model,
            quantity: tire.quantity,
            selling_price: tire.selling_price,
            cost_price: costPrice,
            supplier_id: null
          }]);

          if (error) {
            console.error(`خطأ في ${tire.name}:`, error);
            failed++;
          } else {
            successful++;
          }
        } catch (error) {
          console.error(`خطأ في ${tire.name}:`, error);
          failed++;
        }

        // تحديث شريط التقدم
        const progress = ((i + 1) / tiresData.length) * 100;
        document.getElementById('progressFill').style.width = progress + '%';
        document.getElementById('progressText').textContent = `${i + 1}/${tiresData.length}`;
      }

      document.getElementById('progressBar').style.display = 'none';
      importBtn.disabled = false;
      
      if (failed === 0) {
        showStatus(`✅ تم استيراد ${successful} إطار بنجاح!`, 'success');
      } else {
        showStatus(`⚠️ تم استيراد ${successful} | فشل: ${failed}`, 'error');
      }
    }

    function showStatus(message, type) {
      const statusEl = document.getElementById('status');
      statusEl.textContent = message;
      statusEl.className = 'status ' + type;
    }
  </script>
</body>
</html>
