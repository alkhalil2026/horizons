* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Cairo', Arial, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.container {
  background: white;
  border-radius: 12px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
  padding: 40px;
  max-width: 600px;
  width: 100%;
}

h1 {
  text-align: center;
  color: #333;
  margin-bottom: 10px;
  font-size: 28px;
}

.subtitle {
  text-align: center;
  color: #666;
  margin-bottom: 30px;
  font-size: 14px;
}

.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  margin-bottom: 30px;
}

.stat-box {
  background: #f8f9fa;
  padding: 15px;
  border-radius: 8px;
  text-align: center;
  border-left: 4px solid #667eea;
}

.stat-number {
  font-size: 28px;
  font-weight: bold;
  color: #667eea;
}

.stat-label {
  font-size: 12px;
  color: #999;
  margin-top: 5px;
}

.button-group {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}

button {
  flex: 1;
  padding: 12px 20px;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s;
}

.btn-primary {
  background: #667eea;
  color: white;
}

.btn-primary:hover {
  background: #5568d3;
  transform: translateY(-2px);
  box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
}

.btn-secondary {
  background: #f0f0f0;
  color: #333;
}

.btn-secondary:hover {
  background: #e0e0e0;
}

.btn-success {
  background: #10b981;
  color: white;
}

.btn-success:hover {
  background: #059669;
}

.btn-danger {
  background: #ef4444;
  color: white;
}

.btn-danger:hover {
  background: #dc2626;
}

.progress-section {
  display: none;
  margin-bottom: 20px;
}

.progress-bar {
  width: 100%;
  height: 8px;
  background: #e0e0e0;
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 10px;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #667eea, #764ba2);
  width: 0%;
  transition: width 0.3s;
}

.progress-text {
  font-size: 12px;
  color: #666;
  text-align: center;
}

.results {
  display: none;
  margin-top: 20px;
  padding: 15px;
  background: #f8f9fa;
  border-radius: 8px;
}

.success-message {
  color: #10b981;
  font-weight: 600;
  margin-bottom: 10px;
}

.error-message {
  color: #ef4444;
  font-weight: 600;
  margin-bottom: 10px;
}

.warning-message {
  color: #f59e0b;
  font-weight: 600;
  margin-bottom: 10px;
}

.preview-table {
  margin-top: 15px;
  max-height: 300px;
  overflow-y: auto;
}

.preview-table table {
  width: 100%;
  font-size: 12px;
  border-collapse: collapse;
}

.preview-table th {
  background: #667eea;
  color: white;
  padding: 8px;
  text-align: right;
  font-weight: 600;
}

.preview-table td {
  padding: 8px;
  border-bottom: 1px solid #e0e0e0;
}

.status-icon {
  display: inline-block;
  width: 20px;
  height: 20px;
  margin-right: 8px;
  line-height: 20px;
  text-align: center;
  border-radius: 50%;
  font-size: 12px;
  font-weight: bold;
}

.status-success {
  background: #d1fae5;
  color: #10b981;
}

.status-error {
  background: #fee2e2;
  color: #ef4444;
}

.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0.5);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}

.modal.active {
  display: flex;
}

.modal-content {
  background: white;
  padding: 30px;
  border-radius: 12px;
  max-width: 500px;
  width: 90%;
  text-align: center;
}

.modal-icon {
  font-size: 48px;
  margin-bottom: 15px;
}

.modal h2 {
  margin-bottom: 10px;
  color: #333;
}

.modal p {
  color: #666;
  margin-bottom: 20px;
}

input[type="file"] {

let importedCount = 0;

document.getElementById('importBtn').addEventListener('click', importTires);
document.getElementById('clearBtn').addEventListener('click', clearAllTires);

async function importTires() {
  const btn = document.getElementById('importBtn');
  btn.disabled = true;
  btn.textContent = '⏳ جاري الاستيراد...';

  const progressSection = document.getElementById('progressSection');
  const progressFill = document.getElementById('progressFill');
  const progressText = document.getElementById('progressText');
  const results = document.getElementById('results');

  progressSection.style.display = 'block';
  results.style.display = 'none';

  let successCount = 0;
  let errorCount = 0;
  const totalTires = tiresData.length;

  // قسم البيانات إلى مجموعات من 20
  for (let i = 0; i < tiresData.length; i += 20) {
    const batch = tiresData.slice(i, i + 20);
    
    try {
      const { error } = await supabase.from('tires').insert(batch);
      
      if (error) {
        errorCount += batch.length;
        console.error('خطأ:', error);
      } else {
        successCount += batch.length;
      }
    } catch (err) {
      errorCount += batch.length;
      console.error('خطأ:', err);
    }

    // تحديث شريط التقدم
    const progress = Math.round(((i + 20) / totalTires) * 100);
    progressFill.style.width = Math.min(progress, 100) + '%';
    progressText.textContent = `تم معالجة ${Math.min(i + 20, totalTires)} من ${totalTires} إطار`;

    // تأخير بسيط
    await new Promise(resolve => setTimeout(resolve, 300));
  }

  // اكتمال التقدم
  progressFill.style.width = '100%';
  progressText.textContent = 'اكتمل الاستيراد!';

  // عرض النتائج
  progressSection.style.display = 'none';
  results.style.display = 'block';
  
  if (errorCount === 0) {
    results.innerHTML = `
      <div class="success-message">✅ تم استيراد جميع الإطارات بنجاح!</div>
      <p><strong>${successCount}</strong> إطار تم إدخاله في النظام</p>
    `;
    document.getElementById('successMessage').textContent = `تم إدخال ${successCount} إطار بنجاح في المخزون!`;
    document.getElementById('successModal').classList.add('active');
    document.getElementById('importedTires').textContent = successCount;
  } else {
    results.innerHTML = `
      <div class="warning-message">⚠️ تم الاستيراد مع بعض الأخطاء</div>
      <p><strong>${successCount}</strong> إطار تم إدخاله بنجاح</p>
      <p style="color: #ef4444;"><strong>${errorCount}</strong> إطار فشل إدخاله</p>
    `;
    document.getElementById('importedTires').textContent = successCount;
  }

  btn.disabled = false;
  btn.textContent = '📤 استيراد البيانات';
}

async function clearAllTires() {
  if (!confirm('هل أنت متأكد من حذف جميع الإطارات؟ هذه العملية لا يمكن التراجع عنها!')) {
    return;
  }

  const btn = document.getElementById('clearBtn');
  btn.disabled = true;
  btn.textContent = '⏳ جاري المسح...';

  try {
    const { error } = await supabase.from('tires').delete().neq('id', 0);
    
    if (error) {
      document.getElementById('errorMessage').textContent = 'خطأ: ' + error.message;
      document.getElementById('errorModal').classList.add('active');
    } else {
      alert('✅ تم مسح جميع الإطارات بنجاح!');
      document.getElementById('importedTires').textContent = '0';
    }
  } catch (err) {
    document.getElementById('errorMessage').textContent = 'خطأ: ' + err.message;
    document.getElementById('errorModal').classList.add('active');
  }

  btn.disabled = false;
  btn.textContent = '🗑️ مسح الكل';
}
