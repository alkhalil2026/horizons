# يُبقي مشروع Supabase نشطاً حتى لا يُوقَف تلقائياً بسبب عدم الاستخدام
# يرسل طلب قراءة خفيف كل 3 أيام (لا يغيّر أي بيانات)
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 5 */3 * *'   # الساعة 9:17 صباحاً بتوقيت عُمان، كل 3 أيام
  workflow_dispatch:          # زر للتشغيل اليدوي من تبويب Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: https://ahrnorjzezkusghqqbfv.supabase.co
          SUPABASE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFocm5vcmp6ZXprdXNnaHFxYmZ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3Mzc5NzksImV4cCI6MjEwNTMxMzk3OX0.eFVLGMmapEgiAcueu_mV94KRcr_OcIS59BkTQPJcWbo
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/tires?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")
          echo "Supabase responded with HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::Supabase did not respond normally (HTTP $status). The project may be paused — sign in to supabase.com to restore it."
            exit 1
          fi
